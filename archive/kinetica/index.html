<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kinetica - 2D Physics Engine</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#4fd1c5; --accent2:#60a5fa; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
  header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:1.3rem;color:var(--accent)}
  header p{margin:0;color:var(--muted);font-size:0.85rem}
  .layout{flex:1;display:flex;min-height:0}
  canvas{flex:1;background:#0f172a;display:block;min-width:0}
  .panel{width:320px;background:var(--panel);border-left:1px solid var(--border);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
  .panel h3{margin:0;font-size:0.9rem;color:var(--accent);text-transform:uppercase;letter-spacing:0.06em}
  .btn{padding:8px 12px;border:1px solid var(--border);background:#0f172a;color:var(--text);border-radius:6px;cursor:pointer;font-size:0.85rem}
  .btn:hover{border-color:var(--accent2)}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap}
  .field{display:flex;align-items:center;gap:8px;font-size:0.82rem}
  .field label{color:var(--muted);min-width:60px}
  .field input, .field select{background:#0f172a;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:0.85rem}
  .telemetry{font-family:monospace;font-size:0.8rem;background:#0f172a;border:1px solid var(--border);border-radius:6px;padding:10px;line-height:1.7}
  .telemetry span{color:var(--accent2)}
  @media(max-width:720px){ .layout{flex-direction:column} .panel{width:100%;border-left:none;border-top:1px solid var(--border)} canvas{height:55vh} }
</style>
</head>
<body>
<header>
  <h1>Kinetica</h1>
  <p>2D impulse-based physics - SAT + sequential impulses + deterministic core</p>
  <a href="../" style="margin-left:auto;color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:6px 10px;border-radius:6px">Back to Random</a>
</header>
<div class="layout">
  <canvas id="canvas"></canvas>
  <div class="panel">
    <h3>Scene</h3>
    <div class="field"><label>Preset</label><select id="scene"><option value="stack" selected>Stack (10 boxes)</option><option value="pendulum">Pendulum</option><option value="mixed">Mixed 100</option><option value="free">Free motion</option></select></div>
    <div class="field"><label>Seed</label><input id="seed" type="number" value="42" style="width:100px" /></div>
    <div class="btn-row"><button class="btn" id="btn-reset">Reset</button><button class="btn" id="btn-pause">Pause</button><button class="btn" id="btn-step">Step</button></div>

    <h3>Spawn</h3>
    <div class="btn-row"><button class="btn" id="btn-box">Box</button><button class="btn" id="btn-circle">Circle</button><button class="btn" id="btn-poly">Polygon</button></div>
    <p style="font-size:0.75rem;color:var(--muted);margin:0">Click-drag a body to fling it. Shift+click two bodies to joint them.</p>

    <h3>World</h3>
    <div class="btn-row"><button class="btn" id="btn-gravity">Gravity: ON</button></div>
    <div class="field"><label><input type="checkbox" id="chk-sleep" checked /> Sleeping</label></div>
    <div class="field"><label><input type="checkbox" id="chk-aabb" /> Show AABBs</label></div>
    <div class="field"><label><input type="checkbox" id="chk-contacts" /> Show contacts</label></div>
    <div class="field"><label><input type="checkbox" id="chk-vel" /> Show velocities</label></div>

    <h3>Joints</h3>
    <div class="field"><label><input type="checkbox" id="chk-joint" /> Joint pick</label><select id="joint-type"><option value="revolute">Revolute (pin)</option><option value="distance">Distance (rope)</option></select></div>

    <h3>Telemetry</h3>
    <div class="telemetry">
      FPS: <span id="fps">-</span><br/>
      Bodies: <span id="body-count">-</span><br/>
      KE: <span id="ke">-</span><br/>
      Checksum: <span id="checksum" style="word-break:break-all">-</span><br/>
      <button class="btn" id="btn-checksum" style="margin-top:8px">Copy checksum</button>
    </div>
  </div>
</div>
<script type="module" src="./dist/ui/main.js"></script>
</body>
</html>
