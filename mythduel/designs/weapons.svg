<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Mythduel weapon design sheets">
<title>Mythduel weapon sheets - original designs</title>
<rect width="900" height="420" fill="#efe9d8"/>
<text x="20" y="30" font-family="sans-serif" font-size="16" fill="#232a36">Weapons - original designs (no screen likeness)</text>
<g>
<text x="40" y="70" font-family="sans-serif" font-size="15" fill="#232a36">hafra (northern haft-hammer): long ash haft, compact wedge head, lanyard</text>
<rect x="60" y="100" width="300" height="16" rx="6" fill="#6b4a2e" stroke="#232a36" stroke-width="3"/>
<rect x="330" y="82" width="70" height="52" rx="8" fill="#4a4f59" stroke="#232a36" stroke-width="3"/>
<path d="M330 82 L400 108 L400 134 L330 134 Z" fill="#5b616c" stroke="#232a36" stroke-width="2"/>
<circle cx="60" cy="108" r="10" fill="none" stroke="#232a36" stroke-width="3"/>
<path d="M60 108 Q 40 140 60 165" stroke="#8a5a3c" stroke-width="5" fill="none"/>
<text x="40" y="200" font-family="sans-serif" font-size="14" fill="#232a36">grips: grounded / raised / low / gripped / lowered - throw spins flat, caught by haft</text>
</g>
<g>
<text x="480" y="70" font-family="sans-serif" font-size="15" fill="#232a36">keraunos-rod (Olympian shaft-bolt): tapered shaft, faceted glass-bronze head</text>
<rect x="500" y="100" width="260" height="14" rx="6" fill="#7a5a2e" stroke="#232a36" stroke-width="3"/>
<polygon points="760,72 800,107 760,142 728,107" fill="#b98d3e" stroke="#232a36" stroke-width="3"/>
<line x1="744" y1="88" x2="776" y2="126" stroke="#efe9d8" stroke-width="2"/>
<line x1="776" y1="88" x2="744" y2="126" stroke="#efe9d8" stroke-width="2"/>
<text x="480" y="200" font-family="sans-serif" font-size="14" fill="#232a36">grips: grounded / raised / high / gripped / lowered / dropped - throw flies true, caught by shaft</text>
</g>
<g>
<text x="40" y="260" font-family="sans-serif" font-size="15" fill="#232a36">silhouette reads at 390px: Thor broad wedge (shoulders 2.1) vs Zeus narrow column (shoulders 1.8)</text>
<polygon points="80,300 200,300 180,380 100,380" fill="#3d4c63" stroke="#232a36" stroke-width="3"/>
<polygon points="300,300 380,300 370,380 310,380" fill="#ece7da" stroke="#ece7da" stroke-width="3"/>
<polygon points="300,300 380,300 370,380 310,380" fill="none" stroke="#232a36" stroke-width="3"/>
<text x="480" y="300" font-family="sans-serif" font-size="14" fill="#232a36">distinct at both widths: rust wedge vs marble column;</text>
<text x="480" y="324" font-family="sans-serif" font-size="14" fill="#232a36">weapons distinct: wedge head vs faceted point.</text>
</g>
</svg>
