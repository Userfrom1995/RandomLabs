<style>

  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 15px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  header { padding: 28px 40px 12px; }
  h1 { margin:0; font-size: 26px; letter-spacing: .5px; }
  h1 .glyphforge { color: var(--accent); }
  .meta { color: var(--muted); margin: 6px 0 0; }
  main { padding: 0 40px 48px; }
  .controls { display:flex; flex-wrap:wrap; gap:16px; align-items:center; padding:16px 18px; background:var(--card); border:1px solid var(--border); border-radius:8px; margin:18px 0; }
  .controls label { color: var(--muted); display:flex; flex-direction:column; gap:6px; font-size:12px; }
  .controls input[type=text] { font: 15px/1.4 ui-monospace, monospace; padding:8px 10px; width: 46ch; background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:6px; }
  .controls select, .controls input[type=number] { font: 14px ui-monospace, monospace; padding:7px 8px; background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:6px; }
  .preview { display:flex; flex-direction:column; gap:10px; }
  .preview .ascii-out { margin:0; padding:18px; background:var(--card); border:1px solid var(--border); border-radius:8px; line-height:1.15; }
  .block-grid { display:grid; padding:18px; background:var(--card); border:1px solid var(--border); border-radius:8px; width:max-content; }
  .px { display:inline-block; }
  .px.on { background:var(--on); }
  .px.off { background:var(--off); }
  .ascii .px.on { background:none; }
  h2 { margin: 36px 0 10px; font-size: 17px; }
  .gallery { display:grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap:10px; }
  .glyph-card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px; text-align:center; }
  .glyph-card .label { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  .glyph-card .sample { font-size: 22px; color: var(--fg); }
  .glyph-card .grid { display:grid; margin: 8px auto 0; width:max-content; }
  .glyph-card .cell { width:6px; height:6px; }
  .glyph-card .cell.on { background:var(--on); }
  .glyph-card .cell.off { background:var(--off); }
  .kerns { color: var(--muted); font-size: 12px; margin-top: 6px; }
  footer { padding: 10px 40px 30px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1><span class="glyphforge">Glyphforge</span> specimen</h1>

</header>
<main>
  <section class="controls">
    <label>Text
      <input type="text" id="text" value="AVATAR To the rescue!" autocomplete="off">
    </label>
    <label>Mode
      <select id="mode">
        <option value="blocks" selected>blocks</option>
        <option value="ascii">ascii</option>
      </select>
    </label>
    <label>Scale
      <input type="number" id="scale" value="4" min="1" max="16" step="1">
    </label>
  </section>
  <section id="preview" class="preview"></section>
  <h2>Glyph gallery</h2>
  <section id="gallery" class="gallery"></section>
</main>
