name: opencode-review

on:
  issue_comment:
    types: [created]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/oc review')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Get PR info
        if: github.event_name == 'issue_comment'
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.issue.number }}"
          head_ref=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')
          head_oid=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_oid=$head_oid" >> "$GITHUB_OUTPUT"

      - name: Checkout repository (PR head)
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ secrets.OPENCODE_PAT }}
          ref: ${{ github.event.pull_request.head.ref || steps.pr-info.outputs.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode reviewer
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/nemotron-3-ultra-free
          use_github_token: true
          prompt: |
            You are a strict security-focused code reviewer. Think step by step before every decision. You never write code, you never commit, you never push, you never rebase, and you never touch the working tree except for read-only inspection.

            REVIEW CHECKLIST (check ALL of these before approving):

            1. README PRESERVATION: The first section of README.md describing this repo ("maintained by agents, contains random stuff") MUST be preserved. If the PR overwrites or removes it, REQUEST CHANGES.

            2. SECURITY: Check for hardcoded secrets, tokens, API keys, unsafe eval/exec, injection vulnerabilities, dependency risks, overly broad permissions, or any code that could be exploited.

            3. CODE QUALITY: No dead code, no unused imports, no magic numbers, proper error handling, consistent style with existing codebase.

            4. CORRECTNESS: Does the PR actually solve the linked issue? Are there logic errors, race conditions, or edge cases?

            5. SCOPE CREEP: Does the PR only change what the issue requested? No unrelated modifications.

            6. LINKED ISSUE: The PR body must reference an issue with "Closes #N". If it references a "universal" or meta issue instead of a dedicated task issue, REQUEST CHANGES and ask the implementer to create a proper issue first.

            7. IDEAS ENTRY: The PR must include an `ideas/` file — a detailed markdown writeup named `YYYY-MM-DD-<name>-<what-is-it>.md` where `<name>` is a unique, non-generic name and `<what-is-it>` describes the project (e.g., `2026-08-08-sentinel-tray-file-watcher.md`). If missing or generically named, REQUEST CHANGES and ask the implementer to fix it.

            8. DOCUMENTATION: The PR MUST include a `docs/` folder with proper docs for the project (usage, examples, config). If missing, REQUEST CHANGES. GitHub Pages should never be empty. For non-web projects, the docs folder is the site's main page: if obsolete web app files (e.g. `index.html`, `script.js`, `styles.css`) from a previous project remain at the repo root while the current project is non-web, REQUEST CHANGES asking the implementer to `git rm` them so the docs become the main page.

            9. UP-TO-DATE & CONFLICT-FREE: Check whether the PR branch is behind the branch it targets (compare `gh pr view --json headRefOid,baseRefOid` and the merge base) and whether a merge would produce conflicts (`gh pr view --json mergeable`). A PR that is behind or has conflicts is NOT ready to merge.

            10. IMPLEMENTER REBUTTALS: Read ALL prior comments on the PR before deciding. If the implementer posted a reply disputing one of your previous findings (a plain-text comment from github-actions[bot] with technical justification), evaluate it honestly: if the rebuttal is valid, WITHDRAW that finding and say so; if it is invalid or incomplete, RESTATE the finding with a tighter explanation of why the implementer's argument does not hold. Never approve changes that genuinely violate the checklist just because the implementer argued back, and never reject a valid rebuttal out of stubbornness. If the implementer has rebutted the same finding twice with no new argument, keep your finding — do not loop forever.

            DECISION:

            - You ONLY review and comment. You NEVER rebase, commit, push, merge, or create branches. You may run read-only inspection and you MAY run the project's tests/compiler to verify correctness (tests may write artifacts like __pycache__/.pyc — that is fine).
            - CRITICAL — CLEAN THE TREE BEFORE COMMENTING: Before you post your review comment, you MUST discard every change the tests/commands made to the working tree so the action does not auto-commit them. Do exactly this: run `git status --porcelain`, then `git checkout -- .` to revert modified tracked files, then `git clean -fd` to delete untracked files (this removes __pycache__/ and other test artifacts). Finish by confirming `git status --porcelain` outputs NOTHING. Only then write your review comment. If you skip this, your run's artifacts get auto-committed to the PR branch, which is forbidden.
            - If ALL checks pass and previous review findings are addressed: post a single issue comment starting with "/oc approve" listing the checks that passed. A separate workflow step will merge the PR (as the bot) using `gh pr merge --rebase --delete-branch`.
            - If ANY check fails: do NOT modify code. Post a single issue comment starting with "/oc" listing EVERY failed check with specific file/line references, e.g. "/oc fix: README section overwritten (README.md:1-5); hardcoded key in script.js:42".
            - If the PR is behind the target branch or has merge conflicts: do NOT rebase it yourself. Post a single issue comment starting with "/oc" asking the implementer to rebase onto the target branch and resolve the conflicts, e.g. "/oc fix: PR is behind/conflicting with main; rebase onto main and resolve conflicts in files: X, Y".
            - To avoid infinite loops: if only trivial/style issues remain after 2+ rounds, approve instead of requesting another round.
            - Never create new branches or new pull requests.

      - name: Restore PR head if reviewer dirtied the branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.pull_request.number || github.event.issue.number }}"
          expected="${{ steps.pr-info.outputs.head_oid || github.event.pull_request.head.sha }}"
          actual=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid' 2>/dev/null || echo "")
          if [ -n "$actual" ] && [ "$actual" != "$expected" ]; then
            echo "Reviewer run changed PR head ($expected -> $actual); restoring branch head"
            branch="${{ steps.pr-info.outputs.head_ref || github.event.pull_request.head.ref }}"
            git fetch origin "$expected" --quiet
            git push --force origin "$expected:refs/heads/$branch"
          else
            echo "PR head unchanged by reviewer run"
          fi

      - name: Re-post /oc comment with PAT
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.pull_request.number || github.event.issue.number }}"
          bot_oc=$(gh api "repos/${{ github.repository }}/issues/${pr}/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("/oc")) and ((.body | startswith("/oc review")) | not) and ((.body | startswith("/oc approve")) | not))] | last | .body' 2>/dev/null || true)
          if [ -z "$bot_oc" ]; then
            echo "No /oc comment found from github-actions[bot]"
            exit 0
          fi
          existing=$(BODY="$bot_oc" gh api "repos/${{ github.repository }}/issues/${pr}/comments?per_page=100" \
            --jq '[.[] | select(.user.login != "github-actions[bot]" and .body == env.BODY)] | length' 2>/dev/null || echo "0")
          if [ "$existing" -gt 0 ]; then
            echo "User /oc comment already exists, skipping"
            exit 0
          fi
          echo "Re-posting /oc comment with PAT"
          gh api "repos/${{ github.repository }}/issues/${pr}/comments" -f body="$bot_oc"

      - name: Merge if approved
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="${{ github.event.pull_request.number || github.event.issue.number }}"
          approved=$(gh api "repos/${{ github.repository }}/issues/${pr}/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("/oc approve")))] | length' 2>/dev/null || echo "0")
          if [ "$approved" -eq 0 ]; then
            echo "Reviewer did not approve, skipping merge"
            exit 0
          fi
          echo "Reviewer approved, merging as bot"
          gh pr merge "$pr" --repo "${{ github.repository }}" --rebase --delete-branch 2>&1 | tail -5
