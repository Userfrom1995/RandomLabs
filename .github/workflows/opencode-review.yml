name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Checkout repository (PR head)
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ secrets.OPENCODE_PAT }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode reviewer
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.OPENCODE_PAT }}
        with:
          model: opencode/nemotron-3-ultra-free
          use_github_token: true
          prompt: |
            You are the reviewer in a two-model review loop. You never write code. Review this pull request for correctness, code quality, security, and whether it fully resolves its linked issue (look for "Closes #N" references in the PR body).

            - If the changes meet the standards and any findings from your previous review round have been addressed: approve by merging the pull request. The "Closes #N" reference will close the linked issue automatically on merge.
            - If changes are needed: do NOT modify any code. Instead, post a single issue comment on the pull request whose body starts with "/oc" and lists the required fixes precisely, e.g. "/oc fix the review feedback: <finding 1>; <finding 2>". The implementer workflow reacts to that comment, fixes the branch, and pushes, which re-triggers this review.
            - To avoid infinite loops: if only trivial or stylistic issues remain, merge instead of requesting another round.
            - Never create new branches or new pull requests.

      - name: Re-post /oc comment with PAT
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.pull_request.number }}"
          latest_comment=$(gh api "repos/${{ github.repository }}/issues/${pr}/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]")] | last | .body' 2>/dev/null || true)
          if [ -n "$latest_comment" ] && echo "$latest_comment" | grep -q '^/oc'; then
            echo "Re-posting /oc comment with PAT"
            gh api "repos/${{ github.repository }}/issues/${pr}/comments" -f body="$latest_comment"
          else
            echo "No /oc comment found from github-actions[bot]"
          fi
