name: opencode-review

on:
  issue_comment:
    types: [created]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/oc review')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Get PR info
        if: github.event_name == 'issue_comment'
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.issue.number }}"
          head_ref=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')
          head_oid=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')
          author=$(gh pr view "$pr" --repo "${{ github.repository }}" --json author --jq '.author.login')
          head_repo=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRepository --jq '.headRepository.nameWithOwner // ""')
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_oid=$head_oid" >> "$GITHUB_OUTPUT"
          echo "author=$author" >> "$GITHUB_OUTPUT"
          echo "head_repo=$head_repo" >> "$GITHUB_OUTPUT"

      - name: Checkout repository (PR head)
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ github.token }}
          ref: ${{ github.event.pull_request.head.ref || steps.pr-info.outputs.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clear runtime decision
        run: rm -f /tmp/random-factory-decision.json

      - name: Run opencode reviewer
        timeout-minutes: 25
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/mimo-v2.5-free
          use_github_token: true
          prompt: |
            You are the Reviewer of the Random factory, triggered by "/oc review" on the open PR in this checkout.

            READ FIRST: `.github/agents/reviewer.md` - that file IS your complete system prompt; every rule there is binding (checklist, file:line findings with corrected code, human-vs-bot guidance, rebuttal etiquette, decision-file respect, clean-tree-before-commenting).

            SAFETY NET (always binding): you NEVER write code, commit, push, rebase, merge, or create branches/branches/PRs; you are strictly read-only; you may run tests for verification only, and you MUST clean the working tree (`git checkout -- .`, `git clean -fd`, confirm `git status --porcelain` empty) before posting.
            Before ending the run, you MUST write the machine handoff decision to `/tmp/random-factory-decision.json`: `{"action":"test"}` for approval or `{"action":"fix"}` when changes are required. The hardcoded workflow step reads this file; it never parses your prose comment.
            You post ONE plain text decision comment per run containing your full review, findings, or approval. End every decision comment with your sign-off: `- the Reviewer`. If reviewer.md is missing from the tree, fall back to the safety net and AGENTS.md rules.

      - name: Restore PR head if reviewer dirtied the branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.pull_request.number || github.event.issue.number }}"
          expected="${{ steps.pr-info.outputs.head_oid || github.event.pull_request.head.sha }}"
          actual=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid' 2>/dev/null || echo "")
          if [ -n "$actual" ] && [ "$actual" != "$expected" ]; then
            echo "Reviewer run changed PR head ($expected -> $actual); restoring branch head"
            branch="${{ steps.pr-info.outputs.head_ref || github.event.pull_request.head.ref }}"
            git fetch origin "$expected" --quiet
            git push --force origin "$expected:refs/heads/$branch"
          else
            echo "PR head unchanged by reviewer run"
          fi

      - name: Forward reviewer decision
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.pull_request.number || github.event.issue.number }}"
          if [ ! -f /tmp/random-factory-decision.json ]; then
            echo "No decision file found. Assuming no actionable decision."
            exit 0
          fi
          
          action=$(jq -r '.action' /tmp/random-factory-decision.json 2>/dev/null || echo "")
          
          if [ "$action" = "test" ]; then
            echo "Review approved! Posting /oc test to hand over to Tester"
            gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc test"
          elif [ "$action" = "fix" ]; then
            echo "Reviewer requested fixes. Posting /oc fix to trigger Fixer"
            gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc fix"
          else
            echo "No actionable reviewer decision found (action: $action)"
          fi