name: opencode-review

on:
  issue_comment:
    types: [created]

concurrency:
  group: opencode-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    if: startsWith(github.event.comment.body, '/oc review')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Get PR info
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.issue.number }}"
          is_pr="${{ github.event.issue.pull_request != null }}"
          if [ "$is_pr" = "true" ]; then
            head_ref=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')
            head_oid=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')
            echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
            echo "head_oid=$head_oid" >> "$GITHUB_OUTPUT"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
          else
            issue="${{ github.event.issue.number }}"
            linked_pr=$(gh pr list --repo "${{ github.repository }}" --state open --json number,headRefName,createdAt \
              --jq '[.[] | select(.headRefName | startswith("opencode/issue'"${issue}"'-"))] | sort_by(.createdAt) | last | .number' 2>/dev/null || echo "")
            if [ -n "$linked_pr" ]; then
              head_ref=$(gh pr view "$linked_pr" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')
              head_oid=$(gh pr view "$linked_pr" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')
              echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
              echo "head_oid=$head_oid" >> "$GITHUB_OUTPUT"
              echo "is_pr=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_pr=false" >> "$GITHUB_OUTPUT"
              echo "No linked PR found for issue #$issue"
            fi
          fi

      # Checkout runs unconditionally so the shared actor-write gate below
      # always has its script: on a non-PR issue it falls back to the default
      # branch (issue #428). The gate must precede the notice step below so a
      # denied trigger produces no comment at all.
      - name: Checkout repository (PR head)
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ github.token }}
          ref: ${{ steps.pr-info.outputs.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Actor write gate (issue #428)
        id: actor_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_ACTOR: ${{ github.actor }}
          GATE_LABEL: review
        run: bash .github/scripts/actor-write-gate.sh

      - name: Skip review for non-PR issue
        if: steps.actor_gate.outputs.run == 'true' && steps.pr-info.outputs.is_pr != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "/oc review was requested on this issue, but no linked pull request was found. Review only runs on PR branches. If this issue has an open PR, ensure the branch follows the naming convention \`opencode/issue<N>-<slug>\`." || true

      - name: Record checked-out PR head
        id: checkout-head
        if: steps.pr-info.outputs.is_pr == 'true'
        run: |
          oid=$(git rev-parse --verify HEAD 2>/dev/null || echo "")
          echo "oid=$oid" >> "$GITHUB_OUTPUT"
          echo "Checked-out PR head: ${oid:-<none>}"

      - name: Arm workspace push detector
        if: steps.pr-info.outputs.is_pr == 'true'
        run: |
          # PR #412 head-rewind follow-up: the local branch ref is only a PROXY
          # for "this workspace pushed" - `git pull --ff-only` and `git reset
          # --hard origin/<branch>` fast-forward it onto someone else's commit
          # without ever pushing. A pre-push hook records the real event, so the
          # restore gate below needs the push itself, not a proxy that a plain
          # fetch/pull can fake. The hook appends one line per pushed ref in
          # git's own stdin format (<local ref> <local sha> <remote ref>
          # <remote sha>), so the marker records WHICH commit this workspace
          # pushed, not merely THAT it pushed once - an existence-only marker
          # survives a later external push and would still rewind it. The
          # marker lives in RUNNER_TEMP because the reviewer's clean-tree step
          # would delete anything inside the checkout. The hook fires before
          # the remote accepts, so a push rejected later still leaves a line
          # whose local sha never landed; the chain check below then fails and
          # the run skips cleanup - safe direction (rogue garbage stays,
          # nobody's work is destroyed).
          hooks="$(git rev-parse --git-path hooks)"
          mkdir -p "$hooks"
          printf '#!/bin/sh\ncat >> "${RUNNER_TEMP:-/tmp}/review-workspace-pushed"\nexit 0\n' > "$hooks/pre-push"
          chmod +x "$hooks/pre-push"
          echo "pre-push detector armed at $hooks/pre-push"

      - name: Configure git identity
        if: steps.pr-info.outputs.is_pr == 'true'
        run: |
          git config --global user.name "The Reviewer"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clear runtime decision
        if: steps.pr-info.outputs.is_pr == 'true'
        run: rm -f /tmp/random-lab-decision.json

      - name: Restore the vendored runner when the checked-out head predates it
        if: steps.pr-info.outputs.is_pr == 'true'
        run: |
          set -o pipefail
          # Local `uses: ./.github/actions/opencode-run` resolves against this
          # workspace (the PR head), never against the ref this workflow file was
          # loaded from, so a branch forked before the runner was vendored dies
          # before the agent starts with "Can't find 'action.yml' ... under
          # .../opencode-run" - and the crash-parity verify step misreads that
          # pre-start failure as a mid-stream agent crash, burning the whole
          # auto-retry budget on a gate that never ran (issue #430). Restore the
          # runner from this run's own workflow commit instead.
          if [ -f .github/actions/opencode-run/action.yml ]; then
            echo "Vendored runner present on the checked-out head; nothing to restore."
            exit 0
          fi
          if ! git cat-file -e "${GITHUB_SHA}:.github/actions/opencode-run/action.yml" 2>/dev/null; then
            git fetch --quiet --depth=1 origin "${GITHUB_SHA}" 2>/dev/null || true
          fi
          if ! git cat-file -e "${GITHUB_SHA}:.github/actions/opencode-run/action.yml" 2>/dev/null; then
            echo "::error::Vendored runner absent from the checked-out head and from workflow commit ${GITHUB_SHA}; the agent gate cannot run (fail closed)."
            exit 1
          fi
          rm -rf .github/actions/opencode-run
          git archive "${GITHUB_SHA}" -- .github/actions/opencode-run | tar -x
          printf '%s\n' ".github/actions/opencode-run/" >> "$(git rev-parse --git-path info/exclude)"
          if [ ! -f .github/actions/opencode-run/action.yml ]; then
            echo "::error::Runner restore from ${GITHUB_SHA} did not yield action.yml (fail closed)."
            exit 1
          fi
          echo "Restored .github/actions/opencode-run from workflow commit ${GITHUB_SHA}; the checked-out head predates the vendored runner."

      - name: Run opencode reviewer
        id: review
        if: steps.actor_gate.outputs.run == 'true' && steps.pr-info.outputs.is_pr == 'true'
        continue-on-error: true
        timeout-minutes: 90
        uses: ./.github/actions/opencode-run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/mimo-v2.6-flash-free
          use_github_token: true
          prompt: |
            You are the Reviewer of the Random lab, triggered by "/oc review" on the open PR in this checkout.

            READ FIRST: `.github/agents/reviewer.md` - that file IS your complete system prompt; every rule there is binding (checklist, file:line findings with corrected code, human-vs-bot guidance, rebuttal etiquette, decision-file respect, clean-tree-before-commenting).

            SAFETY NET (always binding): you NEVER write code, commit, push, rebase, merge, or create branches/branches/PRs; you are strictly read-only; you may run tests for verification only, and you MUST clean the working tree (`git checkout -- .`, `git clean -fd`, confirm `git status --porcelain` empty) before posting.
            Before ending the run, you MUST write the machine handoff decision to `/tmp/random-lab-decision.json`: `{"action":"test"}` for approval, `{"action":"fix"}` when project code changes are required, `{"action":"continue"}` when project work is incomplete, `{"action":"lab"}` when infrastructure/workflow changes are required, or `{"action":"maintainer"}` to escalate intractable issues. The hardcoded workflow step reads this file; it never parses your prose comment.
            You post ONE plain text decision comment per run containing your full review, findings, or approval. End every decision comment with your sign-off: `- the Reviewer`. If reviewer.md is missing from the tree, fall back to the safety net and AGENTS.md rules.

      - name: Verify review decided, else auto-retry
        id: verify-review
        if: steps.pr-info.outputs.is_pr == 'true' && always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          AGENT_GATE: ${{ steps.actor_gate.outputs.run }}
        run: |
          # Terminal third outcome for a gate skip (issue #428): the reviewer
          # step never started, so "failed + no decision file" is a DENIAL, not
          # a crash. A denial must not post an owner auto-retry (that would
          # launder the unprivileged trigger under an admin identity) and must
          # not escalate; the bounded retry below only runs for a privileged
          # trigger whose reviewer actually started and then crashed.
          if [ "${AGENT_GATE:-}" != "true" ]; then
            echo "::notice::Actor write gate skipped the reviewer agent (issue #428): denial is not a crash - no auto-retry, no escalation."
            echo "outcome=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr="${{ github.event.issue.number }}"
          outcome="${{ steps.review.outcome }}"

          # Crash-parity with build/fix mode (issue #132): a healthy reviewer
          # ALWAYS writes the decision file as its final act, so "no decision
          # file + failed agent step" is exactly the mid-stream crash signature
          # (e.g. 'Provider finish_reason: network_error'). The in-flight job's
          # log cannot be grepped via API until it completes, so this outcome
          # pair IS the signature; the hard cap below bounds any other class.
          if [ -f /tmp/random-lab-decision.json ]; then
            echo "Review decision file present; gate produced a verdict."
            exit 0
          fi

          if [ "$outcome" != "success" ]; then
            echo "::error::Reviewer step finished with outcome '$outcome' and no decision file (crashed mid-run, e.g. Provider finish_reason: network_error / APIError)."
            # Robust retry counter: never fall back to 0 on an API/rate-limit
            # failure, which would make the cap never trip and loop forever.
            # Only count retries the API actually returned; on enumeration
            # failure, stop retrying - mirrors opencode.yml build/fix parity.
            retries=$(gh api "repos/${{ github.repository }}/issues/$pr/comments" \
              --jq '[.[] | select(.user.login == "${{ github.repository_owner }}" and (.body | startswith("/oc review (auto-retry")))] | length' 2>/dev/null || true)
            if [ -z "$retries" ] || ! [ "$retries" -eq "$retries" ] 2>/dev/null; then
              echo "::error::Could not enumerate prior auto-retries on #$pr (API/rate-limit failure). Refusing to auto-retry to avoid a runaway loop."
              exit 1
            fi
            if [ "$retries" -lt 3 ]; then
              n=$((retries + 1))
              echo "Posting auto-retry $n"
              gh api "repos/${{ github.repository }}/issues/$pr/comments" -f body="/oc review (auto-retry $n)"
              exit 0
            fi
            echo "::error::Review gate still dead after 4 attempts (1 initial + 3 auto-retries). Manual intervention required."
            exit 1
          fi

          echo "::error::Reviewer step reported success but wrote no decision file (silent no-op); failing loudly instead of exiting green."
          exit 1

      - name: Restore PR head only when this run's own agent moved it
        if: steps.pr-info.outputs.is_pr == 'true' && always() && steps.actor_gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          PR: ${{ github.event.issue.number }}
          BRANCH: ${{ steps.pr-info.outputs.head_ref }}
          RECORDED: ${{ steps.pr-info.outputs.head_oid }}
          CHECKOUT_OID: ${{ steps.checkout-head.outputs.oid }}
          REPO: ${{ github.repository }}
        run: |
          # Every value is read from env, never via an expression macro inside
          # the script: macros are expanded into the shell text before bash
          # starts, so a contributor-controlled branch name containing $(...)
          # would execute here with the PAT in scope (GitHub "script
          # injections"). env: passes the same values as data.
          pr="$PR"
          branch="$BRANCH"
          recorded="$RECORDED"
          checkout_oid="$CHECKOUT_OID"

          if [ -z "$branch" ] || [ -z "$checkout_oid" ]; then
            echo "Branch or checked-out OID unknown; skipping restore."
            exit 0
          fi

          actual=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq '.headRefOid' 2>/dev/null || echo "")
          if [ -z "$actual" ]; then
            echo "::warning::Could not read the live head of PR #$pr; refusing to push blind."
            exit 0
          fi

          if [ "$actual" = "$checkout_oid" ]; then
            echo "PR head unchanged ($checkout_oid); nothing to restore."
            exit 0
          fi

          # Ownership gate (PR #412 head rewind). The previous version compared
          # the live head against a snapshot captured when this run STARTED and
          # force-pushed that snapshot back, so every push that landed while a
          # review was still running (Fixer, Builder, owner) was silently
          # reverted at run end. The Reviewer is contractually read-only, so the
          # only head movement this step may undo is one made from THIS
          # workspace. Four independent signals are required, all of them:
          #   1. this workspace pushed at all (the pre-push marker exists), and
          #   2. the live head IS that push: the marker records the pushed
          #      commit, so the last pushed SHA must still equal the live head
          #      (a marker that only proved "a push happened" would survive a
          #      later external push and rewind it), and
          #   3. the local ref agrees (it advanced past the checked-out OID up
          #      to the live head), and
          #   4. the pushes form an unbroken chain from the checked-out head to
          #      the live head (no external commit in between).
          # The local ref alone is a false-positive proxy: a plain `git pull
          # --ff-only` or `git reset --hard origin/<branch>` advances it onto
          # someone else's commit without pushing, and rewinding on that basis
          # would delete exactly the external work this gate exists to protect.
          marker="${RUNNER_TEMP:-/tmp}/review-workspace-pushed"
          marker_sha=""
          chain_ok="no"
          if [ -f "$marker" ]; then
            # Walk every push this workspace made to this branch, in order, and
            # require an unbroken chain: the first push's remote side must be
            # the checked-out head, each push must start where the previous one
            # ended, and the last pushed commit must be the live head. That
            # proves every commit in checkout..actual was pushed from this
            # workspace, so restoring to checkout_oid can only drop our own
            # commits - never an external one that landed in between. Without
            # the chain, an external push that this workspace pulled and then
            # pushed on top of is indistinguishable from a pure rogue push.
            chain_ok=$(awk -v r="refs/heads/$branch" -v want="$checkout_oid" -v live="$actual" '
              $3 == r {
                if (n == 0) { if ($4 != want) bad = 1 }
                else if ($4 != prev) { bad = 1 }
                prev = $2; n++; last = $2
              }
              END {
                if (n > 0 && !bad && last == live) print "yes"; else print "no"
              }' "$marker" 2>/dev/null || echo "no")
            marker_sha=$(awk -v r="refs/heads/$branch" '$3 == r { h = $2 } END { print h }' "$marker" 2>/dev/null || echo "")
          fi
          local_head=$(git rev-parse --verify "refs/heads/$branch" 2>/dev/null || git rev-parse HEAD 2>/dev/null || echo "")

          if [ -z "$marker_sha" ]; then
            echo "::notice::PR #$pr head moved outside this run (no push from this workspace; start snapshot ${recorded:-?}, checkout $checkout_oid, live $actual, local ${local_head:-?}); leaving the head untouched."
            exit 0
          fi

          if [ "$marker_sha" != "$actual" ] || [ "$chain_ok" != "yes" ]; then
            echo "::notice::PR #$pr head not provably this workspace's own push (marker ${marker_sha:-?}, chain ${chain_ok}, start snapshot ${recorded:-?}, checkout $checkout_oid, live $actual, local ${local_head:-?}); leaving the head untouched."
            exit 0
          fi

          if [ "$local_head" != "$actual" ] || [ "$local_head" = "$checkout_oid" ]; then
            echo "::notice::PR #$pr head no longer matches this workspace's own push (start snapshot ${recorded:-?}, checkout $checkout_oid, live $actual, local ${local_head:-?}); leaving the head untouched."
            exit 0
          fi

          echo "This run's agent moved $branch ($checkout_oid -> $actual); restoring to $checkout_oid"
          if git push --force-with-lease="refs/heads/$branch:$actual" origin "$checkout_oid:refs/heads/$branch"; then
            git reset --hard "$checkout_oid" --quiet 2>/dev/null || true
            echo "PR head restored to $checkout_oid"
          else
            echo "::warning::Restore rejected: $branch moved again after $actual; keeping the newer head."
          fi

      - name: Force lab routing for infrastructure PRs
        if: steps.pr-info.outputs.is_pr == 'true' && always() && steps.actor_gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          set +e
          decision="/tmp/random-lab-decision.json"
          if [ ! -f "$decision" ]; then
            echo "No decision file; nothing to enforce."
            exit 0
          fi
          action=$(jq -r '.action // empty' "$decision" 2>/dev/null || echo "")
          # Only fix/continue can be a misroute onto infrastructure files.
          if [ "$action" != "fix" ] && [ "$action" != "continue" ]; then
            echo "Decision '$action' is not fix/continue; no infra override needed."
            exit 0
          fi
          base=$(gh pr view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --json baseRefName --jq '.baseRefName' 2>/dev/null || echo "main")
          git fetch origin "$base" --quiet 2>/dev/null || true
          touched=$(git diff --name-only "origin/$base"...HEAD 2>/dev/null | grep -E '^\.github/(workflows/|agents/)|(^|/)(AGENTS|LAB)\.md$' || true)
          if [ -n "$touched" ]; then
            echo "Infrastructure files touched by this PR; overriding reviewer decision '$action' -> lab:"
            echo "$touched"
            echo '{"action":"lab"}' > "$decision"
          else
            echo "No infrastructure files touched; leaving decision '$action' as-is."
          fi

      - name: Forward reviewer decision
        if: steps.pr-info.outputs.is_pr == 'true' && always() && steps.actor_gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.issue.number }}"
          if [ ! -f /tmp/random-lab-decision.json ]; then
            echo "::error::No decision file found; verify step above already failed the job closed."
            exit 1
          fi
          
          action=$(jq -r '.action' /tmp/random-lab-decision.json 2>/dev/null || echo "")
          
          if [ "$action" = "test" ]; then
            echo "Review approved! Posting /oc test to hand over to Tester"
            gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc test"
          elif [ "$action" = "fix" ]; then
            echo "Reviewer requested fixes. Posting /oc fix to trigger Fixer"
            gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc fix"
          elif [ "$action" = "continue" ]; then
            echo "Reviewer detected incomplete work. Posting /oc continue to hand back to Builder"
            gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc continue"
          elif [ "$action" = "lab" ]; then
            echo "Reviewer detected infrastructure issues. Posting /oc lab"
            gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc lab"
          elif [ "$action" = "maintainer" ]; then
            echo "Reviewer escalating. Posting /oc maintainer to trigger Maintainer"
            gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc maintainer"
          fi