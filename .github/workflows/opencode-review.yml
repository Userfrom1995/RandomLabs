name: opencode-review

on:
  issue_comment:
    types: [created]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/oc review')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Get PR info
        if: github.event_name == 'issue_comment'
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.issue.number }}"
          head_ref=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')
          head_oid=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')
          author=$(gh pr view "$pr" --repo "${{ github.repository }}" --json author --jq '.author.login')
          head_repo=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRepository --jq '.headRepository.nameWithOwner // ""')
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_oid=$head_oid" >> "$GITHUB_OUTPUT"
          echo "author=$author" >> "$GITHUB_OUTPUT"
          echo "head_repo=$head_repo" >> "$GITHUB_OUTPUT"

      - name: Checkout repository (PR head)
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ github.token }}
          ref: ${{ github.event.pull_request.head.ref || steps.pr-info.outputs.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode reviewer
        timeout-minutes: 25
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/nemotron-3-ultra-free
          use_github_token: true
          prompt: |
            You are the Reviewer of the Random factory, triggered by "/oc review" on the open PR in this checkout.

            READ FIRST: `.github/agents/reviewer.md` — that file IS your complete system prompt; every rule there is binding (checklist, file:line findings with corrected code, human-vs-bot guidance, rebuttal etiquette, decision-file respect, clean-tree-before-commenting).

            SAFETY NET (always binding): you NEVER write code, commit, push, rebase, merge, or create branches/branches/PRs; you are strictly read-only; you may run tests for verification only, and you MUST clean the working tree (`git checkout -- .`, `git clean -fd`, confirm `git status --porcelain` empty) before posting; you post ONE decision comment per run — "/oc approve" when every check passes, or "/oc fix: ..." (exact file:line + corrected code) otherwise; human PRs get guidance in the same comment (a human fixes it themselves); if the PR is behind or conflicted, ask for a rebase in the comment. End every decision comment with your sign-off: `— the Reviewer`. Never post more than one decision comment. If reviewer.md is missing from the tree, fall back to the safety net and AGENTS.md rules.

      - name: Restore PR head if reviewer dirtied the branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.pull_request.number || github.event.issue.number }}"
          expected="${{ steps.pr-info.outputs.head_oid || github.event.pull_request.head.sha }}"
          actual=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid' 2>/dev/null || echo "")
          if [ -n "$actual" ] && [ "$actual" != "$expected" ]; then
            echo "Reviewer run changed PR head ($expected -> $actual); restoring branch head"
            branch="${{ steps.pr-info.outputs.head_ref || github.event.pull_request.head.ref }}"
            git fetch origin "$expected" --quiet
            git push --force origin "$expected:refs/heads/$branch"
          else
            echo "PR head unchanged by reviewer run"
          fi

      - name: Post /oc fix trigger as owner (bot PRs only)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.pull_request.number || github.event.issue.number }}"
          author="${{ steps.pr-info.outputs.author }}"
          head_repo="${{ steps.pr-info.outputs.head_repo }}"
          if [ "$author" != "github-actions[bot]" ] || [ "$head_repo" != "${{ github.repository }}" ]; then
            echo "PR #$pr is not a same-repo bot PR (author=$author repo=$head_repo); findings are guidance only — no /oc fix trigger"
            exit 0
          fi
          bot_time=$(gh api "repos/${{ github.repository }}/issues/${pr}/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("/oc")) and ((.body | startswith("/oc review")) | not) and ((.body | startswith("/oc approve")) | not))] | last | .created_at' 2>/dev/null || true)
          if [ -z "$bot_time" ]; then
            echo "No /oc fix comment found from github-actions[bot]"
            exit 0
          fi
          user_time=$(gh api "repos/${{ github.repository }}/issues/${pr}/comments" \
            --jq '[.[] | select(.user.login != "github-actions[bot]" and .body == "/oc fix")] | last | .created_at' 2>/dev/null || true)
          if [ -n "$user_time" ] && [ "$user_time" \> "$bot_time" ]; then
            echo "User /oc fix already posted for this review round, skipping"
            exit 0
          fi
          echo "Posting short /oc fix trigger as owner"
          gh api "repos/${{ github.repository }}/issues/${pr}/comments" -f body="/oc fix"

      - name: Hand over approved PR to the Maintainer
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.pull_request.number || github.event.issue.number }}"
          approved=$(gh api "repos/${{ github.repository }}/issues/${pr}/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("/oc approve")))] | length' 2>/dev/null || echo "0")
          if [ "$approved" -eq 0 ]; then
            echo "Reviewer did not approve, skipping handover"
            exit 0
          fi
          approve_msg=$(gh api "repos/${{ github.repository }}/issues/${pr}/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("/oc approve")))] | last | .body' 2>/dev/null || echo "/oc approve")
          printf '%s\n' "$approve_msg" > /tmp/approve.txt
          if gh workflow view maintainer.yml --repo "${{ github.repository }}" --json id --jq '.id' >/dev/null 2>&1; then
            echo "Dispatching the Maintainer to merge PR #$pr"
            gh workflow run maintainer.yml --repo "${{ github.repository }}" \
              -f pr_number="$pr" -F reason="@/tmp/approve.txt" 2>&1 | tail -2 || true
          else
            echo "maintainer.yml unavailable; fallback: merging as bot"
            gh pr merge "$pr" --repo "${{ github.repository }}" --rebase --delete-branch 2>&1 | tail -5
            closed=$(gh pr view "$pr" --repo "${{ github.repository }}" --json body --jq '.body' 2>/dev/null | grep -oE '(Closes|Fixes|Resolves) #[0-9]+' | grep -oE '[0-9]+' || true)
            for n in $closed; do
              state=$(gh issue view "$n" --repo "${{ github.repository }}" --json state --jq '.state' 2>/dev/null || echo "")
              if [ "$state" = "OPEN" ]; then
                echo "Closing issue #$n (linked by #$pr)"
                gh issue close "$n" --repo "${{ github.repository }}" --comment "Auto-closed: #$pr merged." 2>&1 | tail -1 || true
              fi
            done
          fi