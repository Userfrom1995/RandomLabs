name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Checkout repository (PR head)
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ secrets.OPENCODE_PAT }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode reviewer
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            Review this pull request for correctness, code quality, security, and whether it fully resolves its linked issue (look for "Closes #N" references in the PR body).

            - If the changes meet the standards and any previously requested changes have been addressed: approve by merging the pull request. If the PR fully resolves a linked issue, the "Closes #N" reference will close it automatically on merge.
            - If changes are needed: implement the fixes yourself on the checked-out branch, commit, and push them to the pull request branch. In your review comment, summarize what you changed.
            - To avoid infinite loops: if you already pushed a refinement in the previous review round and only minor issues remain, approve and merge instead of refining again.
            - Never create new branches or new PRs; work only on the checked-out PR branch.
