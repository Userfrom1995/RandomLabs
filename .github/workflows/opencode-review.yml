name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: opencode-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/oc review'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Get PR info
        if: github.event_name == 'issue_comment'
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.issue.number }}"
          head_ref=$(gh pr view "$pr" --json headRefName --jq '.headRefName')
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout repository (PR head)
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ secrets.OPENCODE_PAT }}
          ref: ${{ github.event.pull_request.head.ref || steps.pr-info.outputs.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode reviewer
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/nemotron-3-ultra-free
          use_github_token: true
          prompt: |
            You are a strict security-focused code reviewer. Think step by step before every decision. You never write code.

            REVIEW CHECKLIST (check ALL of these before approving):

            1. README PRESERVATION: The first section of README.md describing this repo ("maintained by agents, contains random stuff") MUST be preserved. If the PR overwrites or removes it, REQUEST CHANGES.

            2. SECURITY: Check for hardcoded secrets, tokens, API keys, unsafe eval/exec, injection vulnerabilities, dependency risks, overly broad permissions, or any code that could be exploited.

            3. CODE QUALITY: No dead code, no unused imports, no magic numbers, proper error handling, consistent style with existing codebase.

            4. CORRECTNESS: Does the PR actually solve the linked issue? Are there logic errors, race conditions, or edge cases?

            5. SCOPE CREEP: Does the PR only change what the issue requested? No unrelated modifications.

            6. LINKED ISSUE: The PR body must reference an issue with "Closes #N". If it references a "universal" or meta issue instead of a dedicated task issue, REQUEST CHANGES and ask the implementer to create a proper issue first.

            DECISION:

            - If ALL checks pass and previous review findings are addressed: approve by rebasing onto main using `gh pr rebase --delete-branch`.
            - If ANY check fails: do NOT modify code. Post a single issue comment starting with "/oc" listing EVERY failed check with specific file/line references, e.g. "/oc fix: README section overwritten (README.md:1-5); hardcoded key in script.js:42".
            - To avoid infinite loops: if only trivial/style issues remain after 2+ rounds, rebase instead of requesting another round.
            - Never create new branches or new pull requests.

      - name: Re-post /oc comment with PAT
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.pull_request.number || github.event.issue.number }}"
          bot_oc=$(gh api "repos/${{ github.repository }}/issues/${pr}/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("/oc")))] | last | .body' 2>/dev/null || true)
          if [ -z "$bot_oc" ]; then
            echo "No /oc comment found from github-actions[bot]"
            exit 0
          fi
          existing=$(gh api "repos/${{ github.repository }}/issues/${pr}/comments" \
            --jq '[.[] | select(.user.login != "github-actions[bot]" and (.body | startswith("/oc")))] | length' 2>/dev/null || echo "0")
          if [ "$existing" -gt 0 ]; then
            echo "User /oc comment already exists, skipping"
            exit 0
          fi
          echo "Re-posting /oc comment with PAT"
          gh api "repos/${{ github.repository }}/issues/${pr}/comments" -f body="$bot_oc"
