name: auditor

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch:
    inputs:
      selfheal_retry:
        description: "Bounded schedule/dispatch self-heal attempt counter (written by .github/scripts/schedule-selfheal.sh; empty on the original run)"
        required: false
        default: ""
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

concurrency:
  # Issue #601: every comment anywhere spawns an auditor run; non-"/oc auditor"
  # comments skip at the job gate but still share this repo-wide group with
  # schedule/dispatch/self-heal runs. queue: max keeps a pending real run from
  # being displaced by a skip-only one.
  group: auditor
  queue: max
  cancel-in-progress: false

jobs:
  audit:
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/oc auditor'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ github.token }}

      - name: Resolve trusted default-branch commit (issue #848)
        id: trusted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_REF: ${{ github.event.repository.default_branch }}
        run: |
          # Issue #848 review round 4 R1: GITHUB_SHA is the dispatched ref's
          # tip (workflow_dispatch accepts any branch or tag), so it is not a
          # trust anchor. Resolve the repository default branch explicitly
          # before the agent starts and publish its commit; every post-agent
          # token-bearing step reads scripts and helpers from this commit.
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TRUSTED_REF}" --jq .sha 2>/dev/null) || sha=""
          if [ -z "$sha" ]; then
            echo "::error::Could not resolve the default-branch commit ${TRUSTED_REF}; refusing to run the trusted reads blind (issue #848, fail closed)."
            exit 1
          fi
          echo "trusted_sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Actor write gate (issue #428)
        id: actor_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_ACTOR: ${{ github.actor }}
          GATE_LABEL: auditor
        run: bash .github/scripts/actor-write-gate.sh

      - name: Configure git identity
        run: |
          git config --global user.name "The Auditor"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clear runtime decision
        run: rm -f /tmp/random-lab-decision.json

      - name: Silent-stall regression audit (R1-R37)
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEALTH_BOARD_LIVE_CHECK: "1"
        run: |
          chmod +x .github/scripts/silent-stall-audit.sh .github/scripts/schedule-selfheal.sh .github/scripts/health-board.sh
          health_issue=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            health_issue=$(bash .github/scripts/health-board.sh || true)
          fi
          .github/scripts/silent-stall-audit.sh ".github/workflows/opencode.yml" "${health_issue}"

      - name: Run auditor agent
        id: auditor
        if: steps.actor_gate.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 60
        uses: ./.github/actions/opencode-run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          # Issue #831: never auto-load project config/instructions from the
          # checked-out tree (a PR-triggered run operates on the PR head);
          # the vendored runner also removes the project plugin directories
          # before the CLI starts. The grant keeps this session's /tmp
          # contract files reachable when the opt-out disables the repo
          # permission.
          OPENCODE_DISABLE_PROJECT_CONFIG: "true"
          OPENCODE_PERMISSION: '{"external_directory":{"*":"allow"}}'
        with:
          variant: max
          model: opencode/deepseek-v4.1-flash-free
          use_github_token: true
          prompt: |
            You are the Auditor of the Random lab, invoked by the daily schedule, a manual dispatch, or an on-demand `/oc auditor` comment on any issue or PR.

            READ FIRST: `.github/agents/auditor.md` - that file IS your complete system prompt; every rule there is binding (read logs/PRs/issues; post to `Lab Health & Audit Logs` issue; if anomaly found, open a NEW issue, link it in the universal health log, and write machine decision to `/tmp/random-lab-decision.json`; sign-off as `- the Auditor`). If the file is missing from the tree, rely on this safety net.

            SAFETY NET (always binding):
            - You NEVER commit code, push, or modify the repository.
            - You NEVER post `/oc fix`, `/oc build this`, or `/oc architect`.
            - Before ending the run, you MUST write your structured machine handoff decision to `/tmp/random-lab-decision.json`: `[{"action": "maintainer", "issue": <new_issue_number>}]` for each opened bug issue, or `[{"action": "maintainer"}]` to notify on the health board. The hardcoded workflow step reads this file and posts `/oc maintainer` with owner PAT.
            - You must always leave a daily report on the universal "Lab Health & Audit Logs" issue. Resolve it with `.github/scripts/health-board.sh` (title first, then the oldest open non-PR issue labeled `lab-health`) and create it with label `lab-health` only if missing. Never add `lab-health` to a transient `[Audit]` issue: only the universal board may carry the label.

      - name: Verify auditor decided, else self-heal on schedule/dispatch
        id: verify-decision
        if: always()
        shell: '/bin/bash --noprofile --norc -e -o pipefail -p {0}'
        env:
          # Issue #848 review round 2 B1: this step holds the owner PAT after
          # the untrusted agent, so the shell environment is pinned too. The
          # runner applies $GITHUB_ENV/$GITHUB_PATH after the job env, so an
          # agent-written BASH_ENV, a prepended PATH shim, or a planted gh
          # config can otherwise hijack the trusted read.
          BASH_ENV: /dev/null
          ENV: /dev/null
          GH_PAGER: /bin/cat
          PAGER: /bin/cat
          GH_FORCE_TTY: ""
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          GH_CONFIG_DIR: /proc
          GIT_ALTERNATE_OBJECT_DIRECTORIES: ""
          GIT_ASKPASS: /usr/bin/false
          GIT_COMMON_DIR: ${{ github.workspace }}/.git
          GIT_CONFIG: /dev/null
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_PARAMETERS: ""
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_DIR: ${{ github.workspace }}/.git
          GIT_EDITOR: /usr/bin/false
          GIT_EXEC_PATH: /usr/lib/git-core
          GIT_EXTERNAL_DIFF: ""
          GIT_INDEX_FILE: ${{ github.workspace }}/.git/index
          GIT_NAMESPACE: ""
          GIT_OBJECT_DIRECTORY: ${{ github.workspace }}/.git/objects
          GIT_PAGER: /bin/cat
          GIT_SEQUENCE_EDITOR: /usr/bin/false
          GIT_SSH_COMMAND: ssh
          GIT_TEMPLATE_DIR: /dev/null
          GIT_TERMINAL_PROMPT: "0"
          GIT_WORK_TREE: ${{ github.workspace }}
          DYLD_FRAMEWORK_PATH: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          GH_HOST: github.com
          GH_REPO: ""
          TRUSTED_SHA: ${{ steps.trusted.outputs.trusted_sha }}
          ALL_PROXY: ""
          CURL_CA_BUNDLE: ""
          GIT_PROXY_COMMAND: ""
          GIT_SSL_CAINFO: ""
          GIT_SSL_CAPATH: ""
          GIT_SSL_NO_VERIFY: ""
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          NO_PROXY: ""
          SSL_CERT_DIR: ""
          SSL_CERT_FILE: ""
          TMPDIR: /tmp

          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          PATH: /usr/bin:/bin
          PYTHONPATH: ""
          PS4: "+ "
          SHELLOPTS: ""

          # Env indirection (issue #422 residual, audit R10): never expand
          # ${{ inputs.selfheal_retry }} inside the run block below - inline
          # expansion is SHELL against this step's owner PAT env. The env
          # mapping is inert data even when the value carries shell metachars.
          SELFHEAL_RETRY: ${{ inputs.selfheal_retry }}
          AGENT_GATE: ${{ steps.actor_gate.outputs.run }}
        run: |
          # Issue #742: clear functions imported from the agent-exported environment.
          while IFS= read -r __lab_pat_fn; do builtin unset -f "$__lab_pat_fn"; done < <(builtin compgen -A function)
          PATH=/usr/bin:/bin; export PATH
          # Issue #848 review round 2 B1: a fresh private GH_CONFIG_DIR keeps
          # an agent-planted config.yml (for example an http_unix_socket) away
          # from the owner PAT; GH_HOST is pinned in the env map and the
          # lowercase proxy spellings are removed here.
          gh_cfg="$(mktemp -d 2>/dev/null)" || gh_cfg=""
          if [ -z "$gh_cfg" ] || [ ! -d "$gh_cfg" ]; then
            echo "::error::Could not create a fresh gh config directory for the owner-PAT step; refusing to run with agent-writable gh state (issue #848, fail closed)."
            exit 1
          fi
          if ! chmod 700 "$gh_cfg"; then
            echo "::error::Could not secure the fresh gh config directory; refusing to run with agent-writable gh state (issue #848, fail closed)."
            exit 1
          fi
          export GH_CONFIG_DIR="$gh_cfg"
          trap 'rm -rf "$gh_cfg"' EXIT
          unset all_proxy http_proxy https_proxy no_proxy 2>/dev/null || true

          # Terminal third outcome for a gate skip (issue #428): the auditor
          # step never started, so "failed + no decision file" is a DENIAL,
          # not a crash. No fail-closed red, no self-heal re-dispatch, no
          # escalation - a denial is not a crash. Schedule/dispatch arms always
          # pass the gate, so their self-heal parity below is intact.
          if [ "${AGENT_GATE:-}" != "true" ]; then
            echo "::notice::Actor write gate skipped the auditor agent (issue #428): denial is not a crash - no auto-retry, no escalation."
            echo "outcome=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          outcome="${{ steps.auditor.outcome }}"
          event_name="${{ github.event_name }}"

          # Crash-parity with the curator/review gates: a healthy auditor
          # ALWAYS writes the decision file as its final act, so "no decision
          # file + failed agent step" is exactly the pre-agent or mid-stream
          # crash signature (issue #422: the upstream version-fetch step
          # aborting on an anonymous rate limit before the agent ever starts).
          if [ -f /tmp/random-lab-decision.json ]; then
            echo "Auditor decision file present; run completed and decided."
            exit 0
          fi

          if [ "$outcome" = "success" ]; then
            echo "::error::Auditor step reported success but wrote no decision file (silent no-op); failing loudly instead of exiting green."
            exit 1
          fi

          echo "::error::Auditor step finished with outcome '$outcome' and no decision file (crashed before or during the agent run)."

          # Schedule/dispatch arms: bounded self-heal, never a silently burned
          # 24-hour cron cycle. Regression-guarded by audit rule R9.
          if [ "$event_name" = "schedule" ] || [ "$event_name" = "workflow_dispatch" ]; then
            # Issue #848 review round 2 B2 and round 4 R1: the agent shares
            # this workspace and can rewrite the self-heal script before this
            # owner-PAT step runs, and GITHUB_SHA is the dispatched ref's tip.
            # Read the script from the freshly resolved default-branch commit
            # through the contents API, execute it from memory, and bind its
            # board helper read to that same commit.
            if [ -z "${TRUSTED_SHA:-}" ]; then
              echo "::error::trusted default-branch commit is empty; refusing to execute the self-heal script (issue #848, fail closed)."
              exit 1
            fi
            selfheal=$(gh api --hostname github.com -H "Accept: application/vnd.github.raw" \
              "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/schedule-selfheal.sh?ref=${TRUSTED_SHA}" 2>/dev/null) || selfheal=""
            if [ -z "$selfheal" ]; then
              echo "::error::schedule-selfheal.sh is absent from trusted commit ${TRUSTED_SHA}; failing closed instead of executing a mutable helper."
              exit 1
            fi
            if printf '%s' "$selfheal" | HEALTH_BOARD_REF="${TRUSTED_SHA}" /bin/bash -p -s -- auditor.yml "${SELFHEAL_RETRY}"; then
              echo "Self-heal re-dispatch queued; run concludes green (the retry run carries the work)."
              exit 0
            fi
            exit 1
          fi

          # issue_comment arm: fail closed so the workflow_run failure
          # trigger summons the Maintainer.
          exit 1

      - name: Forward auditor decision
        if: always() && steps.actor_gate.outputs.run == 'true'
        shell: '/bin/bash --noprofile --norc -e -o pipefail -p {0}'
        env:
          # Issue #848 review round 2 B1: pin the shell environment of this
          # post-agent owner-PAT step, not only its PATH, so an agent-written
          # BASH_ENV, GITHUB_PATH shim, or gh config cannot intercept the read.
          BASH_ENV: /dev/null
          ENV: /dev/null
          GH_PAGER: /bin/cat
          PAGER: /bin/cat
          GH_FORCE_TTY: ""
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          GH_CONFIG_DIR: /proc
          GIT_ALTERNATE_OBJECT_DIRECTORIES: ""
          GIT_ASKPASS: /usr/bin/false
          GIT_COMMON_DIR: ${{ github.workspace }}/.git
          GIT_CONFIG: /dev/null
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_PARAMETERS: ""
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_DIR: ${{ github.workspace }}/.git
          GIT_EDITOR: /usr/bin/false
          GIT_EXEC_PATH: /usr/lib/git-core
          GIT_EXTERNAL_DIFF: ""
          GIT_INDEX_FILE: ${{ github.workspace }}/.git/index
          GIT_NAMESPACE: ""
          GIT_OBJECT_DIRECTORY: ${{ github.workspace }}/.git/objects
          GIT_PAGER: /bin/cat
          GIT_SEQUENCE_EDITOR: /usr/bin/false
          GIT_SSH_COMMAND: ssh
          GIT_TEMPLATE_DIR: /dev/null
          GIT_TERMINAL_PROMPT: "0"
          GIT_WORK_TREE: ${{ github.workspace }}
          DYLD_FRAMEWORK_PATH: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          GH_HOST: github.com
          GH_REPO: ""
          TRUSTED_SHA: ${{ steps.trusted.outputs.trusted_sha }}
          ALL_PROXY: ""
          CURL_CA_BUNDLE: ""
          GIT_PROXY_COMMAND: ""
          GIT_SSL_CAINFO: ""
          GIT_SSL_CAPATH: ""
          GIT_SSL_NO_VERIFY: ""
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          NO_PROXY: ""
          SSL_CERT_DIR: ""
          SSL_CERT_FILE: ""
          TMPDIR: /tmp

          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          PATH: /usr/bin:/bin
          PYTHONPATH: ""
          PS4: "+ "
          SHELLOPTS: ""
        run: |
          # Issue #742: clear functions imported from the agent-exported environment.
          while IFS= read -r __lab_pat_fn; do builtin unset -f "$__lab_pat_fn"; done < <(builtin compgen -A function)
          PATH=/usr/bin:/bin; export PATH
          gh_cfg="$(mktemp -d 2>/dev/null)" || gh_cfg=""
          if [ -z "$gh_cfg" ] || [ ! -d "$gh_cfg" ]; then
            echo "::error::Could not create a fresh gh config directory for the owner-PAT step; refusing to run with agent-writable gh state (issue #848, fail closed)."
            exit 1
          fi
          if ! chmod 700 "$gh_cfg"; then
            echo "::error::Could not secure the fresh gh config directory; refusing to run with agent-writable gh state (issue #848, fail closed)."
            exit 1
          fi
          export GH_CONFIG_DIR="$gh_cfg"
          trap 'rm -rf "$gh_cfg"' EXIT
          unset all_proxy http_proxy https_proxy no_proxy 2>/dev/null || true

          if [ ! -f /tmp/random-lab-decision.json ]; then
            echo "No decision file found (/tmp/random-lab-decision.json)."
            exit 0
          fi

          echo "Decision file found. Contents:"
          cat /tmp/random-lab-decision.json

          # Process both JSON array or single object
          jq -c '.[]? // .' /tmp/random-lab-decision.json | while read -r item; do
            action=$(echo "$item" | jq -r '.action // ""')
            target=$(echo "$item" | jq -r '.issue // .target // ""')

            if [ "$action" = "maintainer" ]; then
              if [ -n "$target" ] && [ "$target" != "null" ]; then
                echo "Forwarding to Maintainer on issue #$target (/oc maintainer)"
                gh issue comment "$target" --repo "${{ github.repository }}" --body "/oc maintainer" || echo "Failed to post comment on issue #$target"
              else
                # Issue #848 review F1 and round 4 R1: the agent shares this
                # workspace and a PR-triggered run checks out the PR head
                # mid-run, so a post-agent workspace helper would be
                # PR-controlled code under the owner PAT, and GITHUB_SHA is
                # the dispatched ref's tip. Read the helper from the freshly
                # resolved default-branch commit through the contents API and
                # execute it from memory (the review publisher pattern, issue
                # #798).
                if [ -z "${TRUSTED_SHA:-}" ]; then
                  echo "::warning::trusted default-branch commit is empty; cannot resolve the health board (fail closed)."
                  health_issue=""
                else
                  helper=$(gh api --hostname github.com -H "Accept: application/vnd.github.raw" \
                    "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/health-board.sh?ref=${TRUSTED_SHA}" 2>/dev/null) || helper=""
                  if [ -z "$helper" ]; then
                    echo "::warning::health-board helper absent from trusted commit ${TRUSTED_SHA}; cannot resolve the health board (fail closed)."
                    health_issue=""
                  else
                    health_issue=$(printf '%s' "$helper" | /bin/bash -p -s || true)
                  fi
                fi
                if [ -n "$health_issue" ] && [ "$health_issue" != "null" ]; then
                  echo "Forwarding to Maintainer on health board #$health_issue (/oc maintainer)"
                  gh issue comment "$health_issue" --repo "${{ github.repository }}" --body "/oc maintainer" || echo "Failed to post comment on health board #$health_issue"
                else
                  echo "No target issue or health board found to notify"
                fi
              fi
            else
              echo "Ignoring unsupported auditor action: $action"
            fi
          done
