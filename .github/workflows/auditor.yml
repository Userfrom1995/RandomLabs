name: auditor

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch:
    inputs:
      selfheal_retry:
        description: "Bounded schedule/dispatch self-heal attempt counter (written by .github/scripts/schedule-selfheal.sh; empty on the original run)"
        required: false
        default: ""
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

concurrency:
  group: auditor
  cancel-in-progress: false

jobs:
  audit:
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/oc auditor'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ github.token }}

      - name: Actor write gate (issue #428)
        id: actor_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_ACTOR: ${{ github.actor }}
          GATE_LABEL: auditor
        run: bash .github/scripts/actor-write-gate.sh

      - name: Configure git identity
        run: |
          git config --global user.name "The Auditor"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clear runtime decision
        run: rm -f /tmp/random-lab-decision.json

      - name: Silent-stall regression audit (R1-R11)
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x .github/scripts/silent-stall-audit.sh .github/scripts/schedule-selfheal.sh
          health_issue=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            health_issue=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=lab-health" --jq '.[0].number' 2>/dev/null || echo "")
          fi
          .github/scripts/silent-stall-audit.sh ".github/workflows/opencode.yml" "${health_issue}"

      - name: Run auditor agent
        id: auditor
        if: steps.actor_gate.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 60
        uses: ./.github/actions/opencode-run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/mimo-v2.6-flash-free
          use_github_token: true
          prompt: |
            You are the Auditor of the Random lab, in a scheduled or dispatch-only run.

            READ FIRST: `.github/agents/auditor.md` - that file IS your complete system prompt; every rule there is binding (read logs/PRs/issues; post to `Lab Health & Audit Logs` issue; if anomaly found, open a NEW issue, link it in the universal health log, and write machine decision to `/tmp/random-lab-decision.json`; sign-off as `- the Auditor`). If the file is missing from the tree, rely on this safety net.

            SAFETY NET (always binding):
            - You NEVER commit code, push, or modify the repository.
            - You NEVER post `/oc fix`, `/oc build this`, or `/oc architect`.
            - Before ending the run, you MUST write your structured machine handoff decision to `/tmp/random-lab-decision.json`: `[{"action": "maintainer", "issue": <new_issue_number>}]` for each opened bug issue, or `[{"action": "maintainer"}]` to notify on the health board. The hardcoded workflow step reads this file and posts `/oc maintainer` with owner PAT.
            - You must always leave a daily report on the universal "Lab Health & Audit Logs" issue (create it with label `lab-health` if missing).

      - name: Verify auditor decided, else self-heal on schedule/dispatch
        id: verify-decision
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          # Env indirection (issue #422 residual, audit R10): never expand
          # ${{ inputs.selfheal_retry }} inside the run block below - inline
          # expansion is SHELL against this step's owner PAT env. The env
          # mapping is inert data even when the value carries shell metachars.
          SELFHEAL_RETRY: ${{ inputs.selfheal_retry }}
          AGENT_GATE: ${{ steps.actor_gate.outputs.run }}
        run: |
          # Terminal third outcome for a gate skip (issue #428): the auditor
          # step never started, so "failed + no decision file" is a DENIAL,
          # not a crash. No fail-closed red, no self-heal re-dispatch, no
          # escalation - a denial is not a crash. Schedule/dispatch arms always
          # pass the gate, so their self-heal parity below is intact.
          if [ "${AGENT_GATE:-}" != "true" ]; then
            echo "::notice::Actor write gate skipped the auditor agent (issue #428): denial is not a crash - no auto-retry, no escalation."
            echo "outcome=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          outcome="${{ steps.auditor.outcome }}"
          event_name="${{ github.event_name }}"

          # Crash-parity with the curator/review gates: a healthy auditor
          # ALWAYS writes the decision file as its final act, so "no decision
          # file + failed agent step" is exactly the pre-agent or mid-stream
          # crash signature (issue #422: the upstream version-fetch step
          # aborting on an anonymous rate limit before the agent ever starts).
          if [ -f /tmp/random-lab-decision.json ]; then
            echo "Auditor decision file present; run completed and decided."
            exit 0
          fi

          if [ "$outcome" = "success" ]; then
            echo "::error::Auditor step reported success but wrote no decision file (silent no-op); failing loudly instead of exiting green."
            exit 1
          fi

          echo "::error::Auditor step finished with outcome '$outcome' and no decision file (crashed before or during the agent run)."

          # Schedule/dispatch arms: bounded self-heal, never a silently burned
          # 24-hour cron cycle. Regression-guarded by audit rule R9.
          if [ "$event_name" = "schedule" ] || [ "$event_name" = "workflow_dispatch" ]; then
            if bash .github/scripts/schedule-selfheal.sh auditor.yml "${SELFHEAL_RETRY}"; then
              echo "Self-heal re-dispatch queued; run concludes green (the retry run carries the work)."
              exit 0
            fi
            exit 1
          fi

          # issue_comment arm: fail closed so the workflow_run failure
          # trigger summons the Maintainer.
          exit 1

      - name: Forward auditor decision
        if: always() && steps.actor_gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          if [ ! -f /tmp/random-lab-decision.json ]; then
            echo "No decision file found (/tmp/random-lab-decision.json)."
            exit 0
          fi

          echo "Decision file found. Contents:"
          cat /tmp/random-lab-decision.json

          # Process both JSON array or single object
          jq -c '.[]? // .' /tmp/random-lab-decision.json | while read -r item; do
            action=$(echo "$item" | jq -r '.action // ""')
            target=$(echo "$item" | jq -r '.issue // .target // ""')

            if [ "$action" = "maintainer" ]; then
              if [ -n "$target" ] && [ "$target" != "null" ]; then
                echo "Forwarding to Maintainer on issue #$target (/oc maintainer)"
                gh issue comment "$target" --repo "${{ github.repository }}" --body "/oc maintainer" || echo "Failed to post comment on issue #$target"
              else
                health_issue=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=lab-health" --jq '.[0].number' 2>/dev/null || echo "")
                if [ -n "$health_issue" ] && [ "$health_issue" != "null" ]; then
                  echo "Forwarding to Maintainer on health board #$health_issue (/oc maintainer)"
                  gh issue comment "$health_issue" --repo "${{ github.repository }}" --body "/oc maintainer" || echo "Failed to post comment on health board #$health_issue"
                else
                  echo "No target issue or health board found to notify"
                fi
              fi
            else
              echo "Ignoring unsupported auditor action: $action"
            fi
          done
