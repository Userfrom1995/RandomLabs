name: ideate

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      selfheal_retry:
        description: "Bounded schedule/dispatch self-heal attempt counter (written by .github/scripts/schedule-selfheal.sh; empty on the original run)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

concurrency:
  group: ideate
  # Queued execution, lab-wide (S2): a self-heal re-dispatch must QUEUE behind
  # this run, never cancel it mid-verify (issue #422 B).
  cancel-in-progress: false

jobs:
  ideate:
    if: (github.event_name == 'issue_comment' && (startsWith(github.event.comment.body, '/oc ideate') || startsWith(github.event.comment.body, '/opencode ideate'))) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ github.token }}

      - name: Configure git identity
        run: |
          git config --global user.name "The Ideator"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run ideator agent
        id: ideate
        continue-on-error: true
        timeout-minutes: 60
        uses: ./.github/actions/opencode-run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/mimo-v2.6-flash-free
          use_github_token: true
          prompt: |
            You are the Ideator of the Random lab, running in an on-demand session (triggered by /oc ideate or workflow_dispatch).

            READ FIRST: `.github/agents/ideator.md` - that file IS your complete system prompt; every rule there is binding (read ideas/ + open issues/PRs first; 2-3 candidates in the exact template on the Brainstorm Board issue labeled `brainstorm`; diversity rules; no repeats unless marked "Improves on:"; bot-authored comments; sign-off). If the file is missing from the tree, rely on this safety net.

            SAFETY NET (always binding):
            - You NEVER create project issues yourself - candidates are comments on the Brainstorm Board only (create + label + pin the board issue as `github-actions[bot]` with the default token if it does not exist).
            - You NEVER post "/oc" comments; you never run the implementer. The Maintainer or Owner picks from your candidates on demand.
            - Comment as `github-actions[bot]` only (default GITHUB_TOKEN - never a PAT); never expose secrets; never modify repo files.
            - Keep candidates ambitious and diverse (§14 of LAB.md): fresh languages welcome, no category/language twice in the last 3 picks.
            - Once candidates are posted, your work is complete. Ideation immediately pauses.

      - name: Verify ideator ran, else self-heal on schedule/dispatch
        id: verify-decision
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          # Env indirection (issue #422 residual, audit R10): never expand
          # ${{ inputs.selfheal_retry }} inside the run block below - inline
          # expansion is SHELL against this step's owner PAT env. The env
          # mapping is inert data even when the value carries shell metachars.
          SELFHEAL_RETRY: ${{ inputs.selfheal_retry }}
        run: |
          outcome="${{ steps.ideate.outcome }}"
          event_name="${{ github.event_name }}"

          # The Ideator has no decision-file contract (its success path is the
          # Brainstorm Board comment verified below), so the crash signature
          # here is the agent step itself failing - e.g. the upstream
          # version-fetch step aborting before the agent ever starts (issue #422).
          if [ "$outcome" = "success" ]; then
            echo "Ideator step succeeded; the board verifier below owns the success-path check."
            exit 0
          fi

          echo "::error::Ideator step finished with outcome '$outcome' (crashed before or during the agent run)."

          # Dispatch/schedule arms: bounded self-heal instead of a silently
          # lost dispatch. Regression-guarded by audit rule R9.
          if [ "$event_name" = "schedule" ] || [ "$event_name" = "workflow_dispatch" ]; then
            if bash .github/scripts/schedule-selfheal.sh ideate.yml "${SELFHEAL_RETRY}"; then
              echo "Self-heal re-dispatch queued; run concludes green (the retry run carries the work)."
              exit 0
            fi
            exit 1
          fi

          # issue_comment arm: fail closed so the workflow_run failure trigger
          # summons the Maintainer.
          exit 1

      - name: Notify the Maintainer (candidates posted)
        # Gate on the AGENT step, not on verify-decision: a green self-heal
        # run also ends verify-decision with outcome=success (it just queued
        # the retry), and that run must not announce candidates that were
        # never posted. Only a genuinely completed ideator notifies.
        if: always() && steps.ideate.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          board=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=brainstorm" --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$board" ] && [ "$board" != "null" ]; then
            gh issue comment "$board" --repo "${{ github.repository }}" --body "/oc maintainer" || echo "maintainer notification failed"
          else
            echo "no Brainstorm Board issue found to notify"
          fi

      - name: Verify board comment was posted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          board=$(gh api "repos/${{ github.repository }}/issues?state=open&labels=brainstorm" --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$board" ] || [ "$board" = "null" ]; then
            echo "warning: no Brainstorm Board issue found - the ideator was asked to create it"
            exit 0
          fi
          recent=$(gh api "repos/${{ github.repository }}/issues/$board/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("### Candidate:")))] | last | .created_at' 2>/dev/null || echo "")
          if [ -z "$recent" ]; then
            echo "warning: no candidate comment found on the board - the ideator may have failed"
            exit 0
          fi
          echo "board #$board has candidates (latest: $recent)"