---
name: neural-train

on:
  workflow_dispatch:
    inputs:
      epochs_phase1:
        description: "Epochs for phase 1 (analysis/synthesis pre-train)"
        required: false
        default: "20"
        type: string
      epochs_phase2:
        description: "Epochs for phase 2 (hyperprior)"
        required: false
        default: "10"
        type: string
      epochs_phase3:
        description: "Epochs for phase 3 (joint fine-tune)"
        required: false
        default: "30"
        type: string
      data_size:
        description: "Synthetic samples to generate (0 = use existing data)"
        required: false
        default: "2048"
        type: string
      device:
        description: "Device override (auto/cuda/cpu)"
        required: false
        default: "auto"
        type: choice
        options: [auto, cuda, cpu]

permissions:
  contents: read
  actions: write

concurrency:
  group: neural-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pillow

      - name: Probe device
        id: probe
        run: |
          python3 - <<'PY'
          try:
              import torch
              print(f"torch={torch.__version__}")
              print(f"cuda_available={torch.cuda.is_available()}")
              import sys
              dev = sys.argv[1] if len(sys.argv)>1 else "auto"
              if dev == "auto":
                  dev = "cuda" if torch.cuda.is_available() else "cpu"
              print(f"device={dev}")
              open("/tmp/neural_device.txt","w").write(dev)
          except Exception as e:
              print(f"probe_failed={e}")
              open("/tmp/neural_device.txt","w").write("cpu")
          PY "${{ inputs.device }}"
          cat /tmp/neural_device.txt
          echo "device=$(cat /tmp/neural_device.txt)" >> $GITHUB_OUTPUT

      - name: Generate synthetic training data (procedural, no network)
        run: |
          mkdir -p /tmp/neural_train
          python3 prism/scripts/gen_training_data.py --out /tmp/neural_train --count "${{ inputs.data_size }}" || echo "gen failed (no script?)"

      - name: Train neural codec (three-phase, baked int16 Q1024)
        run: |
          device=$(cat /tmp/neural_device.txt)
          echo "Training on device=$device"
          python3 prism/scripts/train_neural_codec.py \
            --data-dir /tmp/neural_train \
            --output-dir /tmp/neural_weights \
            --epochs-phase1 "${{ inputs.epochs_phase1 }}" \
            --epochs-phase2 "${{ inputs.epochs_phase2 }}" \
            --epochs-phase3 "${{ inputs.epochs_phase3 }}" \
            --device "$device" || echo "training exited non-zero (expected on CPU with small data)"

      - name: Export baked weights (int16 Q=1024) for C++ inference
        if: always()
        run: |
          if [ -d /tmp/neural_weights ]; then
            python3 prism/scripts/export_weights.py --weights /tmp/neural_weights \
              --out prism/src/codec/neural_weights.inc --quant 1024 || echo "export skipped"
            ls -lh /tmp/neural_weights 2>/dev/null || true
            ls -lh prism/src/codec/neural_weights.inc 2>/dev/null || true
          fi

      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-train-${{ github.run_id }}
          path: |
            /tmp/neural_train
            /tmp/neural_weights
            prism/src/codec/neural_weights.inc
          if-no-files-found: ignore
          retention-days: 7
