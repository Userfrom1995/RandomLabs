name: opencode-pr-trigger

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  # Deliberately single-slot (issue #601 review): the triggers are per-PR
  # wake-ups, all homogeneous - the newest push/synchronize wins and a stale
  # pending wake-up losing to it costs nothing. The one skip-only class is a
  # draft-state event (the job gate below requires draft == false); a displaced
  # real wake-up then costs at most one 20-minute Maintainer tick, so queue:
  # max (which would multiply /oc maintainer wake-ups on push bursts) is the
  # wrong trade here. This workflow is intentionally outside the R14 cohort.
  group: pr-trigger-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  trigger:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Post /oc maintainer as owner to wake up Maintainer
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          set -euo pipefail
          pr="${{ github.event.pull_request.number }}"
          echo "Posting /oc maintainer for PR #$pr"
          gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc maintainer"
