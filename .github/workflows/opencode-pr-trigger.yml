name: opencode-pr-trigger

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  # Deliberately single-slot (issue #601 review): the triggers are per-PR
  # wake-ups, all homogeneous - the newest push/synchronize wins and a stale
  # pending wake-up losing to it costs nothing. The one skip-only class is a
  # draft-state event (the job gate below requires draft == false); a displaced
  # real wake-up then costs at most one 20-minute Maintainer tick, so queue:
  # max (which would multiply /oc maintainer wake-ups on push bursts) is the
  # wrong trade here. This workflow is intentionally outside the R14 cohort.
  group: pr-trigger-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  trigger:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Post /oc maintainer as owner to wake up Maintainer
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          SHELLOPTS: ""
          PS4: "+ "
          GIT_CONFIG: /dev/null
          GIT_CONFIG_PARAMETERS: ""
          PYTHONPATH: ""
          GH_CONFIG_DIR: /proc
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          GIT_ALTERNATE_OBJECT_DIRECTORIES: ""
          GIT_ASKPASS: /bin/false
          GIT_COMMON_DIR: ${{ github.workspace }}/.git
          GIT_CONFIG_COUNT: "0"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_DIR: ${{ github.workspace }}/.git
          GIT_EDITOR: /bin/false
          GIT_EXEC_PATH: /usr/lib/git-core
          GIT_EXTERNAL_DIFF: ""
          GIT_INDEX_FILE: ${{ github.workspace }}/.git/index
          GIT_NAMESPACE: ""
          GIT_OBJECT_DIRECTORY: ${{ github.workspace }}/.git/objects
          GIT_PAGER: /bin/cat
          GIT_SEQUENCE_EDITOR: /bin/false
          GIT_SSH_COMMAND: ssh
          GIT_TERMINAL_PROMPT: "0"
          GIT_TEMPLATE_DIR: /dev/null
          GIT_WORK_TREE: ${{ github.workspace }}
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          PATH: /usr/bin:/bin
        shell: bash --noprofile --norc -p -e -o pipefail {0}
        run: |
          # Issue #742: clear command functions imported from an agent-written BASH_FUNC_* entry before any external command (builtins only).
          while IFS= read -r __lab_pat_fn; do builtin unset -f "$__lab_pat_fn"; done < <(builtin compgen -A function)
          set -euo pipefail
          pr="${{ github.event.pull_request.number }}"
          echo "Posting /oc maintainer for PR #$pr"
          gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc maintainer"
