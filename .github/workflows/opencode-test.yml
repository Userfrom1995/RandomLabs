name: opencode-test

on:
  issue_comment:
    types: [created]

concurrency:
  group: opencode-test-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event.issue.pull_request != null && (startsWith(github.event.comment.body, '/oc test') || startsWith(github.event.comment.body, '/opencode test')) && !startsWith(github.event.comment.body, '/oc test-linux') && !startsWith(github.event.comment.body, '/opencode test-linux') && !startsWith(github.event.comment.body, '/oc test-macos') && !startsWith(github.event.comment.body, '/opencode test-macos') && !startsWith(github.event.comment.body, '/oc test-windows') && !startsWith(github.event.comment.body, '/opencode test-windows')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Get PR info
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.issue.number }}"
          head_ref=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout repository (PR head)
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ github.token }}
          ref: ${{ steps.pr-info.outputs.head_ref }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "The Tester"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clear runtime decision
        run: rm -f /tmp/random-lab-decision.json /tmp/live-run-evidence.json

      - name: Restore the vendored runner when the checked-out head predates it
        run: |
          set -o pipefail
          # Local `uses: ./.github/actions/opencode-run` resolves against this
          # workspace (the PR head), never against the ref this workflow file was
          # loaded from, so a branch forked before the runner was vendored dies
          # before the agent starts with "Can't find 'action.yml' ... under
          # .../opencode-run" - and the fail-closed verify step misreads that
          # pre-start failure as an agent crash (issue #430). Restore the runner
          # from this run's own workflow commit instead.
          if [ -f .github/actions/opencode-run/action.yml ]; then
            echo "Vendored runner present on the checked-out head; nothing to restore."
            exit 0
          fi
          if ! git cat-file -e "${GITHUB_SHA}:.github/actions/opencode-run/action.yml" 2>/dev/null; then
            git fetch --quiet --depth=1 origin "${GITHUB_SHA}" 2>/dev/null || true
          fi
          if ! git cat-file -e "${GITHUB_SHA}:.github/actions/opencode-run/action.yml" 2>/dev/null; then
            echo "::error::Vendored runner absent from the checked-out head and from workflow commit ${GITHUB_SHA}; the agent gate cannot run (fail closed)."
            exit 1
          fi
          rm -rf .github/actions/opencode-run
          git archive "${GITHUB_SHA}" -- .github/actions/opencode-run | tar -x
          printf '%s\n' ".github/actions/opencode-run/" >> "$(git rev-parse --git-path info/exclude)"
          if [ ! -f .github/actions/opencode-run/action.yml ]; then
            echo "::error::Runner restore from ${GITHUB_SHA} did not yield action.yml (fail closed)."
            exit 1
          fi
          echo "Restored .github/actions/opencode-run from workflow commit ${GITHUB_SHA}; the checked-out head predates the vendored runner."

      - name: Run opencode tester
        id: test
        continue-on-error: true
        timeout-minutes: 90
        uses: ./.github/actions/opencode-run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
          use_github_token: true
          prompt: |
            You are the Tester of the Random lab, triggered by "/oc test" on the open PR in this checkout.

            READ FIRST: `.github/agents/tester.md` - that file IS your complete system prompt; every rule there is binding.

            SAFETY NET (always binding): you NEVER write code to fix the app yourself; you only author test files and test suites in test directories. On standard project PRs, you ARE authorized to commit and push your new test suites using git identity "The Tester" and commit message prefix "tester: ...". On infrastructure PRs (diff touches .github/workflows/, .github/agents/, AGENTS.md, or LAB.md), you are strictly read-only and must NEVER commit or push. If tests fail on standard PRs, commit your failing test case so it is reproducible, push it, and output {"action":"fix"}. On infrastructure PRs, if checks fail, output {"action":"lab"}. If all pass, commit and push your test suites (on standard PRs), and output {"action":"maintainer"}. LIVE-EXECUTION PROOF (hard gate): before any {"action":"maintainer"} verdict you MUST write /tmp/live-run-evidence.json per tester.md "The Live-Execution Proof" - go test/vet/build and other bare test-runner commands do NOT count as running the product; execute the shipped entrypoint with its runtime dependencies installed. The workflow blocks your approval (red run) if this file is missing or holds only test/compile commands.
            Before ending the run, you MUST write the machine handoff decision to `/tmp/random-lab-decision.json`: `{"action":"maintainer"}` for approval/escalation, `{"action":"fix"}` when app fixes are required, or `{"action":"lab"}` when infrastructure fixes are required. The hardcoded workflow step reads this file; it never parses your prose comment.
            You post ONE plain text decision comment per run containing your findings. End every decision comment with your sign-off: `- the Tester`.

      - name: Verify test decided, else fail closed
        id: verify-test
        if: always()
        run: |
          outcome="${{ steps.test.outcome }}"

          # Fail-closed silent-stall guard (issue #297): the agent step above
          # runs with continue-on-error, so a step timeout ("The action has
          # timed out.", e.g. run 34386818174 on PR #295) would otherwise
          # finish the job green with no decision file and silently stall the
          # pipeline. Any missing decision file is a hard failure.
          if [ -f /tmp/random-lab-decision.json ]; then
            echo "Tester decision file present; gate produced a verdict (step outcome: $outcome)."
            exit 0
          fi

          echo "::error::Tester step finished with outcome '$outcome' and no decision file (timed out or crashed mid-run). Failing closed instead of exiting green."
          exit 1

      - name: Enforce live-execution evidence gate
        id: evidence-gate
        if: always()
        run: |
          # Hard gate (issue-style fix for green-but-never-ran approvals): a
          # {"action":"maintainer"} verdict on a standard PR requires proof that
          # the SHIPPED artifact was really executed. Missing file, or evidence
          # containing only test/compile invocations, fails the gate red. The
          # job failure then reaches the Maintainer's workflow_run trigger for
          # a fresh /oc test dispatch (crash-parity pattern).
          if [ ! -f /tmp/random-lab-decision.json ]; then
            echo "No decision file; verify step above already failed the job closed."
            exit 0
          fi
          action=$(jq -r '.action // empty' /tmp/random-lab-decision.json 2>/dev/null || echo "")
          if [ "$action" != "maintainer" ]; then
            echo "Gate applies to approvals only (action='$action'); nothing to enforce."
            exit 0
          fi
          ev=/tmp/live-run-evidence.json
          if [ ! -f "$ev" ]; then
            echo "::error::Tester wrote an approval without /tmp/live-run-evidence.json. Live-execution proof is mandatory (see tester.md 'The Live-Execution Proof'). Approval blocked."
            exit 1
          fi
          # Documented escapes: infra PRs (validation commands, no app to run)
          # and genuinely unrunnable environments must declare scope + reason.
          if jq -e '.scope == "unrunnable" and ((.reason // "") | length > 20)' "$ev" >/dev/null 2>&1; then
            echo "Evidence declares scope=unrunnable with a substantive reason; routing as escalation."
            exit 0
          fi
          if jq -e '.scope == "infra" and ((.checks // []) | length > 0)' "$ev" >/dev/null 2>&1; then
            echo "Evidence declares scope=infra with validation checks recorded."
            exit 0
          fi
          # Standard PR: at least one evidence command must target the shipped
          # entrypoint, not a bare test-runner or compile invocation.
          good=$(jq '[.commands[]? | select(((.cmd // "") | length) > 0) | select((.cmd | test("^((go (test|vet|build|run|install))|(make (test|build|vet|check|install))|(npm (test|run build))|(yarn (test|build))|(pnpm (test|build))|pytest|python[0-9.]* -m pytest|(cargo (test|build|check))|vitest|jest|dotnet test|mvn (test|compile)|gradle (test|build)|rspec|bundle exec (test|rspec))( |$)")) | not)] | length' "$ev" 2>/dev/null || echo 0)
          if [ "${good:-0}" -lt 1 ]; then
            echo "::error::Live-execution evidence contains only test/compile commands (or is malformed). Running the unit suite is NOT executing the product. Approval blocked; see tester.md 'The Live-Execution Proof'."
            exit 1
          fi
          echo "Evidence gate passed: $good non-test command(s) recorded against the deliverable."

      - name: Forward tester decision
        if: always() && steps.evidence-gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          HEAD_REF: ${{ steps.pr-info.outputs.head_ref }}
        run: |
          pr="${{ github.event.issue.number }}"
          if [ ! -f /tmp/random-lab-decision.json ]; then
            echo "::error::No decision file found; verify step above already failed the job closed."
            exit 1
          fi
          
          action=$(jq -r '.action' /tmp/random-lab-decision.json 2>/dev/null || echo "")
          
          if [ "$action" = "maintainer" ]; then
            echo "Tests passed and approved! Posting /oc maintainer to hand over to Maintainer"
            gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc maintainer"
          elif [ "$action" = "lab" ]; then
            echo "Tester requested lab fixes on infrastructure PR. Posting /oc lab"
            gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc lab"
          elif [ "$action" = "fix" ]; then
            head_branch="$HEAD_REF"
            if echo "$head_branch" | grep -q "opencode/lab"; then
              echo "Tester requested fixes on lab PR. Posting /oc lab"
              gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc lab"
            else
              echo "Tester requested fixes. Posting /oc fix to trigger Fixer"
              gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc fix"
            fi
          fi
