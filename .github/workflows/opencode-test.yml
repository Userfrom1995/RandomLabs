name: opencode-test

on:
  issue_comment:
    types: [created]

concurrency:
  # Issue #601: every comment on the PR spawns a run; non-"/oc test" comments
  # skip at the job gate but still share this group, and the default single
  # pending slot lets a skip-only run displace a still-pending real /oc test.
  # queue: max keeps up to 100 pending runs FIFO, so a queued test run is
  # never lost; duplicate tests queue instead of superseding.
  group: opencode-test-${{ github.event.issue.number }}
  queue: max
  cancel-in-progress: false

jobs:
  test:
    if: github.event.issue.pull_request != null && (startsWith(github.event.comment.body, '/oc test') || startsWith(github.event.comment.body, '/opencode test')) && !startsWith(github.event.comment.body, '/oc test-linux') && !startsWith(github.event.comment.body, '/opencode test-linux') && !startsWith(github.event.comment.body, '/oc test-macos') && !startsWith(github.event.comment.body, '/opencode test-macos') && !startsWith(github.event.comment.body, '/oc test-windows') && !startsWith(github.event.comment.body, '/opencode test-windows')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: read
      issues: read
    steps:
      - name: Get PR info
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          pr="${{ github.event.issue.number }}"
          head_ref=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout repository (PR head)
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ github.token }}
          ref: ${{ steps.pr-info.outputs.head_ref }}
          fetch-depth: 0

      - name: Stage the tester system prompt from the workflow commit
        run: |
          set -o pipefail
          # Issue #713 review round 8: the tester prompt is equally PR-controlled
          # (the Tester approval is an eval prerequisite), so a PR editing
          # .github/agents/tester.md could rewrite the gate's instructions.
          # Stage the reviewed prompt from this run's own workflow commit into
          # RUNNER_TEMP and point the agent at the staged copy. The PR-head
          # edition is never read, and a missing workflow-commit copy fails
          # closed.
          prompt_dir="${RUNNER_TEMP:-/tmp}/lab-prompts"
          prompt_file="$prompt_dir/tester.md"
          mkdir -p "$prompt_dir"
          rm -f "$prompt_file"
          if ! git cat-file -e "${GITHUB_SHA}:.github/agents/tester.md" 2>/dev/null; then
            git fetch --quiet --depth=1 origin "${GITHUB_SHA}" 2>/dev/null || true
          fi
          if git cat-file -e "${GITHUB_SHA}:.github/agents/tester.md" 2>/dev/null; then
            git show "${GITHUB_SHA}:.github/agents/tester.md" > "$prompt_file" 2>/dev/null || rm -f "$prompt_file"
          fi
          if [ ! -s "$prompt_file" ]; then
            echo "::error::Tester system prompt absent from workflow commit ${GITHUB_SHA}; refusing to read the PR-head copy (issue #713 review round 8, fail closed)."
            exit 1
          fi
          echo "Staged .github/agents/tester.md from workflow commit ${GITHUB_SHA} at ${prompt_file}; the PR-head edition is never read."

      - name: "Actor write gate (issue #428)"
        id: actor_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_ACTOR: ${{ github.actor }}
          GATE_LABEL: test
        run: |
          set -o pipefail
          # Issue #713 review round 9: execute the gate from this run's own
          # workflow commit, never the checked-out PR head (the same
          # trust-boundary fix the eval arm already carries). The gate decides
          # whether the Tester may run, and it executes before any pinned step
          # can verify the checkout: a PR editing
          # .github/scripts/actor-write-gate.sh would otherwise run arbitrary
          # code in its own test run with issues: write. A missing
          # workflow-commit copy fails closed.
          gate_script="${RUNNER_TEMP:-/tmp}/lab-scripts/actor-write-gate.sh"
          mkdir -p "$(dirname "$gate_script")"
          rm -f "$gate_script"
          if ! git cat-file -e "${GITHUB_SHA}:.github/scripts/actor-write-gate.sh" 2>/dev/null; then
            git fetch --quiet --depth=1 origin "${GITHUB_SHA}" 2>/dev/null || true
          fi
          if git cat-file -e "${GITHUB_SHA}:.github/scripts/actor-write-gate.sh" 2>/dev/null; then
            git show "${GITHUB_SHA}:.github/scripts/actor-write-gate.sh" > "$gate_script" 2>/dev/null || rm -f "$gate_script"
          fi
          if [ ! -s "$gate_script" ]; then
            echo "::error::Actor write gate script absent from workflow commit ${GITHUB_SHA}; refusing to execute the PR-head copy (issue #713 review round 9, fail closed)."
            exit 1
          fi
          bash "$gate_script"

      - name: Configure git identity
        run: |
          git config --global user.name "The Tester"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clear runtime decision
        run: rm -f /tmp/random-lab-decision.json /tmp/live-run-evidence.json

      - name: Restore the vendored runner when the checked-out head predates it
        run: |
          set -o pipefail
          # Local `uses: ./.github/actions/opencode-run` resolves against this
          # workspace (the PR head), never against the ref this workflow file was
          # loaded from, so a branch forked before the runner was vendored dies
          # before the agent starts with "Can't find 'action.yml' ... under
          # .../opencode-run" (issue #430). Issue #713 review round 9: always
          # replace the checked-out copy with this run's workflow-commit copy.
          # The PR head's runner is untrusted code that would otherwise execute
          # with the job's token before any pinned step can verify the decision.
          # The old early exit that trusted a present head action.yml is gone.
          if ! git cat-file -e "${GITHUB_SHA}:.github/actions/opencode-run/action.yml" 2>/dev/null; then
            git fetch --quiet --depth=1 origin "${GITHUB_SHA}" 2>/dev/null || true
          fi
          if ! git cat-file -e "${GITHUB_SHA}:.github/actions/opencode-run/action.yml" 2>/dev/null; then
            echo "::error::Vendored runner absent from workflow commit ${GITHUB_SHA}; the agent gate cannot run (fail closed)."
            exit 1
          fi
          rm -rf .github/actions/opencode-run
          git archive "${GITHUB_SHA}" -- .github/actions/opencode-run | tar -x
          printf '%s\n' ".github/actions/opencode-run/" >> "$(git rev-parse --git-path info/exclude)"
          if [ ! -f .github/actions/opencode-run/action.yml ]; then
            echo "::error::Runner restore from ${GITHUB_SHA} did not yield action.yml (fail closed)."
            exit 1
          fi
          echo "Restored .github/actions/opencode-run from workflow commit ${GITHUB_SHA}; the checked-out edition is never executed."

      - name: Run opencode tester
        id: test
        if: steps.actor_gate.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 90
        uses: ./.github/actions/opencode-run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          # Review round 9: the checked-out PR head is untrusted, so opencode
          # must not auto-load its AGENTS.md/opencode.json project config. The
          # staged workflow-commit prompt above is the only instruction source.
          OPENCODE_DISABLE_PROJECT_CONFIG: "true"
        with:
          variant: max
          model: opencode/deepseek-v4.1-flash-free
          use_github_token: true
          prompt: |
            You are the Tester of the Random lab, triggered by "/oc test" on the open PR in this checkout.

            READ FIRST: the tester system prompt staged from this run's workflow commit at `${RUNNER_TEMP}/lab-prompts/tester.md` (RUNNER_TEMP is set in your environment) - that file IS your complete system prompt; every rule there is binding. Never read the PR-head `.github/agents/tester.md`; it is untrusted.

            SAFETY NET (always binding): you NEVER write code to fix the app yourself; you only author test files and test suites in test directories. On standard project PRs, you ARE authorized to commit and push your new test suites using git identity "The Tester" and commit message prefix "tester: ...". On infrastructure PRs (diff touches .github/workflows/, .github/agents/, AGENTS.md, or LAB.md), you are strictly read-only and must NEVER commit or push. If tests fail on standard PRs, commit your failing test case so it is reproducible, push it, and output {"action":"fix"}. On infrastructure PRs, if checks fail, output {"action":"lab"}. If all pass, commit and push your test suites (on standard PRs), and output {"action":"maintainer"}. LIVE-EXECUTION PROOF (hard gate): before any {"action":"maintainer"} verdict you MUST write /tmp/live-run-evidence.json per tester.md "The Live-Execution Proof" - go test/vet/build and other bare test-runner commands do NOT count as running the product; execute the shipped entrypoint with its runtime dependencies installed. The workflow blocks your approval (red run) if this file is missing or holds only test/compile commands.
            Before ending the run, you MUST write the machine handoff decision to `/tmp/random-lab-decision.json`: `{"action":"maintainer"}` for approval/escalation, `{"action":"fix"}` when app fixes are required, or `{"action":"lab"}` when infrastructure fixes are required. The hardcoded workflow step reads this file; it never parses prose.
            You MUST write ONE plain text decision report to `/tmp/random-lab-report.md` containing your findings, ending with your sign-off line `- the Tester` as the last non-blank line. Do NOT post comments yourself: your token is read-only for issues (issue #713), and a hardcoded workflow step publishes your report with the owner PAT after the gates pass. The report file is the publication contract; the workflow verifies it before anything is posted.

      - name: Verify test decided, else fail closed
        id: verify-test
        if: always()
        env:
          AGENT_GATE: ${{ steps.actor_gate.outputs.run }}
        run: |
          # Terminal third outcome for a gate skip (issue #428): the tester
          # step never started, so a missing decision file is a DENIAL, not a
          # crash - fail open as a clean skip instead of failing the job red
          # (which would summon the Maintainer for a denial that needs no
          # triage). No owner auto-retry, no escalation; privileged triggers
          # whose agent started keep the fail-closed guard below.
          if [ "${AGENT_GATE:-}" != "true" ]; then
            echo "::notice::Actor write gate skipped the tester agent (issue #428): denial is not a crash - no auto-retry, no escalation."
            echo "outcome=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          outcome="${{ steps.test.outcome }}"

          # Fail-closed silent-stall guard (issue #297): the agent step above
          # runs with continue-on-error, so a step timeout ("The action has
          # timed out.", e.g. run 34386818174 on PR #295) would otherwise
          # finish the job green with no decision file and silently stall the
          # pipeline. Any missing decision file is a hard failure.
          if [ -f /tmp/random-lab-decision.json ]; then
            echo "Tester decision file present; gate produced a verdict (step outcome: $outcome)."
            exit 0
          fi

          echo "::error::Tester step finished with outcome '$outcome' and no decision file (timed out or crashed mid-run). Failing closed instead of exiting green."
          exit 1

      - name: Enforce live-execution evidence gate
        id: evidence-gate
        if: always() && steps.actor_gate.outputs.run == 'true'
        run: |
          # Hard gate (issue-style fix for green-but-never-ran approvals): a
          # {"action":"maintainer"} verdict on a standard PR requires proof that
          # the SHIPPED artifact was really executed. Missing file, or evidence
          # containing only test/compile invocations, fails the gate red. The
          # job failure then reaches the Maintainer's workflow_run trigger for
          # a fresh /oc test dispatch (crash-parity pattern).
          if [ ! -f /tmp/random-lab-decision.json ]; then
            echo "No decision file; verify step above already failed the job closed."
            exit 0
          fi
          action=$(jq -r '.action // empty' /tmp/random-lab-decision.json 2>/dev/null || echo "")
          if [ "$action" != "maintainer" ]; then
            echo "Gate applies to approvals only (action='$action'); nothing to enforce."
            exit 0
          fi
          ev=/tmp/live-run-evidence.json
          if [ ! -f "$ev" ]; then
            echo "::error::Tester wrote an approval without /tmp/live-run-evidence.json. Live-execution proof is mandatory (see tester.md 'The Live-Execution Proof'). Approval blocked."
            exit 1
          fi
          # Documented escapes: infra PRs (validation commands, no app to run)
          # and genuinely unrunnable environments must declare scope + reason.
          if jq -e '.scope == "unrunnable" and ((.reason // "") | length > 20)' "$ev" >/dev/null 2>&1; then
            echo "Evidence declares scope=unrunnable with a substantive reason; routing as escalation."
            exit 0
          fi
          if jq -e '.scope == "infra" and ((.checks // []) | length > 0)' "$ev" >/dev/null 2>&1; then
            echo "Evidence declares scope=infra with validation checks recorded."
            exit 0
          fi
          # Standard PR: at least one evidence command must target the shipped
          # entrypoint, not a bare test-runner or compile invocation.
          good=$(jq '[.commands[]? | select(((.cmd // "") | length) > 0) | select((.cmd | test("^((go (test|vet|build|run|install))|(make (test|build|vet|check|install))|(npm (test|run build))|(yarn (test|build))|(pnpm (test|build))|pytest|python[0-9.]* -m pytest|(cargo (test|build|check))|vitest|jest|dotnet test|mvn (test|compile)|gradle (test|build)|rspec|bundle exec (test|rspec))( |$)")) | not)] | length' "$ev" 2>/dev/null || echo 0)
          if [ "${good:-0}" -lt 1 ]; then
            echo "::error::Live-execution evidence contains only test/compile commands (or is malformed). Running the unit suite is NOT executing the product. Approval blocked; see tester.md 'The Live-Execution Proof'."
            exit 1
          fi
          echo "Evidence gate passed: $good non-test command(s) recorded against the deliverable."

      - name: Publish tester decision report (owner PAT)
        id: publish-report
        if: always() && steps.actor_gate.outputs.run == 'true' && steps.evidence-gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          GIT_NO_REPLACE_OBJECTS: "1"
          PATH: /usr/local/bin:/usr/bin:/bin
          TARGET: ${{ github.event.issue.number }}
        run: |
          # Issue #713: the tester agent executes PR-controlled code, so its
          # job token is read-only for issues. The report is a file contract,
          # and this hardcoded owner-PAT step owns the comment post. The PAT
          # never reaches the agent step; a PR cannot forge a signed report
          # comment with the job token because it cannot write issues at all.
          if [ ! -f /tmp/random-lab-decision.json ]; then
            echo "No decision file; verify step above already failed the job closed."
            exit 0
          fi
          report=/tmp/random-lab-report.md
          if [ ! -s "$report" ]; then
            echo "::error::Tester decision file is present but /tmp/random-lab-report.md is missing or empty; refusing to forward an unpublished verdict (issue #713)."
            exit 1
          fi
          publisher=$(mktemp "${RUNNER_TEMP:-/tmp}/publish-agent-report.XXXXXX") || {
            echo "::error::Could not create a secure staging path for the report publisher (issue #713, fail closed)."
            exit 1
          }
          trap 'rm -f "$publisher"' EXIT
          if ! git cat-file -e "${GITHUB_SHA}:.github/scripts/publish-agent-report.sh" 2>/dev/null; then
            git fetch --quiet --depth=1 origin "${GITHUB_SHA}" 2>/dev/null || true
          fi
          if git cat-file -e "${GITHUB_SHA}:.github/scripts/publish-agent-report.sh" 2>/dev/null; then
            git show "${GITHUB_SHA}:.github/scripts/publish-agent-report.sh" > "$publisher" 2>/dev/null || rm -f "$publisher"
          fi
          if [ ! -s "$publisher" ]; then
            echo "::error::Report publisher absent from workflow commit ${GITHUB_SHA}; refusing to forward an unpublished verdict (issue #713, fail closed)."
            exit 1
          fi
          if ! bash "$publisher" "$TARGET" "$report" "- the Tester"; then
            echo "::error::Tester report publication failed; refusing to forward an unpublished verdict (issue #713)."
            exit 1
          fi

      - name: Verify tester decision published, else fail closed
        id: publish-gate
        if: always() && steps.actor_gate.outputs.run == 'true' && steps.evidence-gate.outcome == 'success' && steps.publish-report.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PATH: /usr/local/bin:/usr/bin:/bin
          # Env indirection (audit R10): the trigger timestamp reaches the
          # publication checker as data, never expanded into the shell text.
          SINCE: ${{ github.event.comment.created_at }}
        run: |
          # Issue #629/#713: a present decision file is only a real verdict
          # once the Tester's signed decision report is actually published on
          # the PR thread. The hardcoded owner-PAT step above posts it; this
          # checker independently re-verifies an owner-authored comment
          # created after this run's trigger carrying the `- the Tester`
          # sign-off. The script is read from this run's own workflow commit,
          # never the checked-out PR head, so a PR can never weaken the gate
          # that tests it. Exit 2 means verification itself failed: that is NOT
          # evidence of a crash, so it must neither proceed nor auto-retry a
          # possibly-published verdict.
          pr="${{ github.event.issue.number }}"
          if [ ! -f /tmp/random-lab-decision.json ]; then
            echo "No decision file; verify step above already failed the job closed."
            exit 0
          fi
          action=$(jq -r '.action // empty' /tmp/random-lab-decision.json 2>/dev/null || echo "")
          if [ "$action" != "maintainer" ]; then
            echo "Publication gate applies to maintainer decisions only (action='$action'); nothing to verify."
            exit 0
          fi
          evidence_script=$(mktemp "${RUNNER_TEMP:-/tmp}/test-comment-published.XXXXXX") || {
            echo "::error::Could not create a secure staging path for the publication-evidence checker (issue #713, fail closed)."
            exit 1
          }
          trap 'rm -f "$evidence_script"' EXIT
          if ! git cat-file -e "${GITHUB_SHA}:.github/scripts/test-comment-published.sh" 2>/dev/null; then
            git fetch --quiet --depth=1 origin "${GITHUB_SHA}" 2>/dev/null || true
          fi
          if git cat-file -e "${GITHUB_SHA}:.github/scripts/test-comment-published.sh" 2>/dev/null; then
            git show "${GITHUB_SHA}:.github/scripts/test-comment-published.sh" > "$evidence_script" 2>/dev/null || rm -f "$evidence_script"
          fi
          if [ ! -s "$evidence_script" ]; then
            rm -f /tmp/random-lab-decision.json
            echo "::error::Publication-evidence script absent from workflow commit ${GITHUB_SHA}; refusing to forward an unverified verdict (issue #629, fail closed)."
            exit 1
          fi
          pub_rc=0
          bash "$evidence_script" "$pr" "$SINCE" || pub_rc=$?
          case "$pub_rc" in
            0)
              echo "Tester decision comment published; the maintainer decision may proceed."
              ;;
            1)
              rm -f /tmp/random-lab-decision.json
              echo "::error::Tester wrote a decision file but no signed decision comment was published (issue #629); discarding the unpublished verdict, failing closed for a fresh /oc test dispatch."
              exit 1
              ;;
            *)
              rm -f /tmp/random-lab-decision.json
              echo "::error::Could not verify whether the Tester's decision comment was published (checker exit $pub_rc); refusing to forward an unverified verdict (issue #629). Manual triage required."
              exit 1
              ;;
          esac

      - name: Publish tester approval marker (owner-PAT-signed)
        id: marker
        if: always() && steps.actor_gate.outputs.run == 'true' && steps.publish-gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          GIT_NO_REPLACE_OBJECTS: "1"
          PATH: /usr/local/bin:/usr/bin:/bin
        run: |
          # Issue #629/#713: the merge sweep's first-line anchor (R21) is
          # satisfied by a workflow-published canonical marker instead of
          # agent prose compliance. This step runs only after the evidence gate
          # passed and the Tester's signed report is verified published, so it
          # publishes a genuine machine verdict, never a forged one. The agent
          # token cannot write issues, and the owner PAT used here never
          # reaches the agent step. The /oc maintainer handoff below keeps the
          # owner PAT because GITHUB_TOKEN-authored comments start no workflow
          # run.
          echo "ok=false" >> "$GITHUB_OUTPUT"
          if [ ! -f /tmp/random-lab-decision.json ]; then
            echo "No decision file; nothing to publish."
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          action=$(jq -r '.action // empty' /tmp/random-lab-decision.json 2>/dev/null || echo "")
          if [ "$action" != "maintainer" ]; then
            echo "Decision '$action' is not an approval; no marker to publish."
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ev=/tmp/live-run-evidence.json
          if [ -f "$ev" ] && jq -e '.scope == "unrunnable"' "$ev" >/dev/null 2>&1; then
            echo "Evidence declares scope=unrunnable; this is an escalation, not an approval; no approval marker published."
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scope=$(jq -r '.scope // "standard"' "$ev" 2>/dev/null || echo "standard")
          pr="${{ github.event.issue.number }}"
          publisher=$(mktemp "${RUNNER_TEMP:-/tmp}/publish-tester-marker.XXXXXX") || {
            echo "::error::Could not create a secure staging path for the marker publisher (issue #713, fail closed)."
            exit 1
          }
          trap 'rm -f "$publisher"' EXIT
          if ! git cat-file -e "${GITHUB_SHA}:.github/scripts/publish-tester-marker.sh" 2>/dev/null; then
            git fetch --quiet --depth=1 origin "${GITHUB_SHA}" 2>/dev/null || true
          fi
          if git cat-file -e "${GITHUB_SHA}:.github/scripts/publish-tester-marker.sh" 2>/dev/null; then
            git show "${GITHUB_SHA}:.github/scripts/publish-tester-marker.sh" > "$publisher" 2>/dev/null || rm -f "$publisher"
          fi
          if [ ! -s "$publisher" ]; then
            echo "::error::Marker publisher absent from workflow commit ${GITHUB_SHA}; refusing to hand an unpublished marker to the merge sweep (issue #629, fail closed)."
            exit 1
          fi
          if ! bash "$publisher" "$pr" "$scope"; then
            echo "::error::Tester approval marker publication failed; the merge sweep would never recognize this verdict (issue #629). Failing closed."
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Forward tester decision
        if: always() && steps.actor_gate.outputs.run == 'true' && steps.evidence-gate.outcome == 'success' && steps.publish-gate.outcome == 'success' && steps.marker.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          GIT_NO_REPLACE_OBJECTS: "1"
          PATH: /usr/local/bin:/usr/bin:/bin
          HEAD_REF: ${{ steps.pr-info.outputs.head_ref }}
        run: |
          pr="${{ github.event.issue.number }}"
          if [ ! -f /tmp/random-lab-decision.json ]; then
            echo "::error::No decision file found; verify step above already failed the job closed."
            exit 1
          fi
          
          action=$(jq -r '.action' /tmp/random-lab-decision.json 2>/dev/null || echo "")
          
          if [ "$action" = "maintainer" ]; then
            echo "Tests passed and approved! Posting /oc maintainer to hand over to Maintainer"
            gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc maintainer"
          elif [ "$action" = "lab" ]; then
            echo "Tester requested lab fixes on infrastructure PR. Posting /oc lab"
            gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc lab"
          elif [ "$action" = "fix" ]; then
            head_branch="$HEAD_REF"
            if echo "$head_branch" | grep -q "opencode/lab"; then
              echo "Tester requested fixes on lab PR. Posting /oc lab"
              gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc lab"
            else
              echo "Tester requested fixes. Posting /oc fix to trigger Fixer"
              gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc fix"
            fi
          fi
