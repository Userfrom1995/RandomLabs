name: opencode-test

on:
  issue_comment:
    types: [created]

concurrency:
  group: opencode-test-${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  test:
    if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/oc test')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Get PR info
        if: github.event_name == 'issue_comment'
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.issue.number }}"
          head_ref=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')
          head_oid=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid')
          author=$(gh pr view "$pr" --repo "${{ github.repository }}" --json author --jq '.author.login')
          head_repo=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRepository --jq '.headRepository.nameWithOwner // ""')
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_oid=$head_oid" >> "$GITHUB_OUTPUT"
          echo "author=$author" >> "$GITHUB_OUTPUT"
          echo "head_repo=$head_repo" >> "$GITHUB_OUTPUT"

      - name: Checkout repository (PR head)
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ github.token }}
          ref: ${{ github.event.pull_request.head.ref || steps.pr-info.outputs.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode tester
        timeout-minutes: 35
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/mimo-v2.5-free
          use_github_token: true
          prompt: |
            You are the Tester of the Random factory, triggered by "/oc test" on the open PR in this checkout.

            READ FIRST: `.github/agents/tester.md` — that file IS your complete system prompt; every rule there is binding.

            SAFETY NET (always binding): you NEVER write code to fix the app yourself, commit, push, rebase, merge, or create branches/PRs; you may write testing scripts or run the app; you MUST clean the working tree (`git checkout -- .`, `git clean -fd`, confirm `git status --porcelain` empty) before posting; you post ONE decision comment per run — "/oc approve-test" when everything is flawless, or "/oc fix: ..." otherwise. End every decision comment with your sign-off: `— the Tester`. Never post more than one decision comment.

      - name: Post /oc fix trigger as owner (if test failed)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.pull_request.number || github.event.issue.number }}"
          author="${{ steps.pr-info.outputs.author }}"
          head_repo="${{ steps.pr-info.outputs.head_repo }}"
          if [ "$author" != "github-actions[bot]" ] || [ "$head_repo" != "${{ github.repository }}" ]; then
            echo "PR #$pr is not a same-repo bot PR (author=$author repo=$head_repo); findings are guidance only — no /oc fix trigger"
            exit 0
          fi
          
          bot_time=$(gh api "repos/${{ github.repository }}/issues/${pr}/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("/oc")) and ((.body | startswith("/oc test")) | not) and ((.body | startswith("/oc approve-test")) | not))] | last | .created_at' 2>/dev/null || true)
          if [ -z "$bot_time" ]; then
            echo "No /oc fix comment found from github-actions[bot]"
            exit 0
          fi
          user_time=$(gh api "repos/${{ github.repository }}/issues/${pr}/comments" \
            --jq '[.[] | select(.user.login != "github-actions[bot]" and .body == "/oc fix")] | last | .created_at' 2>/dev/null || true)
          if [ -n "$user_time" ] && [ "$user_time" \> "$bot_time" ]; then
            echo "User /oc fix already posted for this test round, skipping"
            exit 0
          fi
          echo "Posting short /oc fix trigger as owner"
          gh api "repos/${{ github.repository }}/issues/${pr}/comments" -f body="/oc fix"

      - name: Hand over approved test PR to the Maintainer
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.pull_request.number || github.event.issue.number }}"
          approved=$(gh api "repos/${{ github.repository }}/issues/${pr}/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("/oc approve-test")))] | length' 2>/dev/null || echo "0")
          if [ "$approved" -eq 0 ]; then
            echo "Tester did not approve, skipping handover"
            exit 0
          fi
          echo "Posting /oc maintainer to hand over test-approved PR #$pr"
          gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc maintainer" || true
