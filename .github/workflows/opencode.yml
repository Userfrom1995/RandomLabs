      !startsWith(github.event.comment.body, '/opencode test') &&
      !startsWith(github.event.comment.body, '/oc architect') &&
      !startsWith(github.event.comment.body, '/opencode architect') &&
      !startsWith(github.event.comment.body, '/oc research') &&
      !startsWith(github.event.comment.body, '/opencode research') &&
      !startsWith(github.event.comment.body, '/oc plan') &&
      !startsWith(github.event.comment.body, '/opencode plan') &&
