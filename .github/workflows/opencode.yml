name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: opencode-${{ github.event.issue.number || 'global' }}
  cancel-in-progress: true

jobs:
  build:
    if: |
      !startsWith(github.event.comment.body, '/oc review') &&
      !startsWith(github.event.comment.body, '/oc approve') &&
      !startsWith(github.event.comment.body, '/opencode review') &&
      (contains(github.event.comment.body, ' /oc build') ||
       startsWith(github.event.comment.body, '/oc build') ||
       contains(github.event.comment.body, ' /oc continue') ||
       startsWith(github.event.comment.body, '/oc continue') ||
       contains(github.event.comment.body, ' /opencode build') ||
       startsWith(github.event.comment.body, '/opencode build') ||
       contains(github.event.comment.body, ' /opencode continue') ||
       startsWith(github.event.comment.body, '/opencode continue'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ github.token }}

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Capture baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branches_before=$(git ls-remote origin 'refs/heads/opencode/*' 2>/dev/null | sort | sha256sum | cut -c1-16)
          prs_before=$(gh pr list --repo "${{ github.repository }}" --state open --json number --jq '.[].number' 2>/dev/null | sort | tr '\n' ',')
          echo "branches_before=$branches_before" >> "$GITHUB_OUTPUT"
          echo "prs_before=$prs_before" >> "$GITHUB_OUTPUT"

      - name: Run opencode build agent
        id: opencode
        continue-on-error: true
        timeout-minutes: 25
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            You are the Builder of the Random factory, triggered by "/oc build" or "/oc continue" on this issue/PR.

            READ FIRST: `.github/agents/builder.md` — that file IS your complete system prompt; every rule there is binding (identity as the Builder, orientation, build plan, resume mode, ideas entry, docs/site rules, decision files, review-round behavior, sign-off). If the file is missing from the tree, rely on the safety net below plus AGENTS.md.

            SAFETY NET (always binding, outranks everything):
            - Commit your work yourself as `github-actions[bot]` (identity preconfigured). NEVER add any `Co-authored-by:` trailer. Never end the run without pushing (`git status --porcelain` must be empty at the end — the workflow auto-commit is forbidden to fire).
            - Branch `opencode/<issue-number>-<short-description>`; open your PR with `gh pr create --base main --head <branch> --title ... --body "Closes #N"` (rule: every task gets its OWN new issue; never a "universal" issue).
            - Rebase onto latest main before pushing; never leave the PR behind or conflicted.
            - You never post "/oc" comments (hardcoded steps post triggers; your comments are plain text, bot-signed).
            - Sign your work: every commit subject starts with `builder:`, every comment/PR body ends with your sign-off from builder.md (`— the Builder`).
            - No interactive input in anything you build; production quality; docs/ + ideas/ entry required; never touch the root index.html landing, the docs folder's existence, or pages.yml's PR-preview feature.
            - CONTINUE run ("/oc continue"): fetch the existing branch/PR for this issue, read its progress file, resume — never restart, never redo done work.
            - Think deeply before coding; use subagents when available. This is a real build: plan, scaffold with progress files, push after every milestone, mark Status: complete only when actually done.

      - name: Post /oc maintainer to trigger Maintainer
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "/oc maintainer" || true

      - name: Clean working tree (prevent auto-commit leaks)
        if: always()
        run: |
          git checkout -- . >/dev/null 2>&1 || true
          git clean -fd >/dev/null 2>&1 || true
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then echo "dirty after clean:"; echo "$dirty"; fi
          exit 0

      - name: Approve held CI runs on the PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          set +e
          issue="${{ github.event.issue.number }}"
          if [ -n "${{ github.event.issue.pull_request.html_url }}" ]; then
            pr="$issue"
          else
            pr=$(gh pr list --repo "${{ github.repository }}" --state open --json number,headRefName,createdAt \
              --jq '[.[] | select(.headRefName | startswith("opencode/"))] | sort_by(.createdAt) | last | .number' 2>/dev/null)
          fi
          if [ -z "$pr" ]; then
            echo "No PR context — repo-wide sweep of held runs"
            for i in $(seq 1 10); do
              held=$(gh run list --repo "${{ github.repository }}" --status action_required --limit 100 --json databaseId --jq '.[].databaseId' 2>/dev/null)
              if [ -z "$held" ]; then
                echo "No held runs remain (sweep $i)"
                exit 0
              fi
              for run in $held; do
                if gh api --method POST "repos/${{ github.repository }}/actions/runs/$run/approve" -H "Accept: application/vnd.github+json" >/dev/null 2>&1; then
                  echo "Approved run $run"
                else
                  echo "APPROVE FAILED for run $run (a later sweep or a human click will retry)"
                fi
              done
              sleep 5
            done
            echo "Held runs could not all be auto-approved after sweeping"
            exit 0
          fi
          for i in $(seq 1 30); do
            head_sha=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid' 2>/dev/null)
            if [ -z "$head_sha" ]; then
              echo "PR #$pr gone (poll $i); exiting"
              exit 0
            fi
            echo "Looking for held runs on PR #$pr (head $head_sha)"
            held=$(gh run list --repo "${{ github.repository }}" --commit "$head_sha" --status action_required --json databaseId --jq '.[].databaseId' 2>/dev/null)
            if [ -z "$held" ]; then
              echo "No held runs remain (poll $i)"
              exit 0
            fi
            for run in $held; do
              if gh api --method POST "repos/${{ github.repository }}/actions/runs/$run/approve" -H "Accept: application/vnd.github+json" >/dev/null 2>&1; then
                echo "Approved run $run"
              else
                echo "APPROVE FAILED for run $run"
              fi
            done
            sleep 5
          done
          echo "Held runs could not be auto-approved after polling"
          GH_TOKEN="${{ github.token }}" gh api "repos/${{ github.repository }}/issues/$pr/comments" \
            -f body="Workflow runs on this PR are awaiting approval and could not be auto-approved. Please approve them in the Actions tab so the review loop can continue: ${{ github.server_url }}/${{ github.repository }}/actions" >/dev/null 2>&1 || true
          exit 0

      - name: Verify build pushed, else auto-retry
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          BASELINE_BRANCHES: ${{ steps.baseline.outputs.branches_before }}
          BASELINE_PRS: ${{ steps.baseline.outputs.prs_before }}
        run: |
          issue="${{ github.event.issue.number }}"
          branches_after=$(git ls-remote origin 'refs/heads/opencode/*' 2>/dev/null | sort | sha256sum | cut -c1-16)
          prs_after=$(gh pr list --repo "${{ github.repository }}" --state open --json number --jq '.[].number' 2>/dev/null | sort | tr '\n' ',')
          if [ "$branches_after" != "$BASELINE_BRANCHES" ] || [ "$prs_after" != "$BASELINE_PRS" ]; then
            echo "Build pushed (branch/PR change detected)"
            exit 0
          fi
          echo "No push detected"
          retries=$(gh api "repos/${{ github.repository }}/issues/$issue/comments" \
            --jq '[.[] | select(.user.login == "${{ github.repository_owner }}" and (.body | startswith("/oc build this (auto-retry")))] | length' 2>/dev/null || echo "0")
          if [ "$retries" -lt 3 ]; then
            n=$((retries + 1))
            echo "Posting auto-retry $n"
            gh api "repos/${{ github.repository }}/issues/$issue/comments" -f body="/oc build this (auto-retry $n)"
            exit 0
          fi
          echo "::error::Build agent finished without pushing after 4 attempts (1 initial + 3 auto-retries). Manual intervention required."
          exit 1

  fix:
    if: |
      (github.event.comment.body == '/oc fix' ||
       startsWith(github.event.comment.body, '/oc fix (auto-retry')) &&
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ github.token }}

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Capture baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="${{ github.event.issue.number }}"
          head_before=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid' 2>/dev/null || echo "")
          echo "head_before=$head_before" >> "$GITHUB_OUTPUT"

      - name: Run opencode fix agent
        id: opencode
        continue-on-error: true
        timeout-minutes: 25
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            You are the Fixer of the Random factory, responding to the reviewer's findings on the open PR this comment was posted on.

            READ FIRST: `.github/agents/fixer.md` — that file IS your complete system prompt; every rule there is binding (apply the latest "/oc fix: ..." findings, partial-application + plain-text rebuttals for what you skip, rebase before push). If the file is missing from the tree, rely on the safety net below plus AGENTS.md.

            SAFETY NET (always binding):
            - Apply every requested fix you agree with on the PR's branch (fetch/checkout it first if needed).
            - Disagreements: post a plain-text rebuttal with technical justification (file:line), NEVER starting with "/oc". After two rounds of argument, apply the change.
            - Commit as `github-actions[bot]`, NEVER any `Co-authored-by:` trailer. Never end without pushing — if you made NO changes, push an empty commit (`git commit --allow-empty -m "chore: reply to reviewer"`). Rebase onto latest main before pushing.
            - Scope: only what the findings require — no new issues/branches/PRs, no docs//ideas/ unless the finding requires it, never merge.
            - Sign your work: commit subjects start with `fixer:`, comments end with `— the Fixer`.
            - Leave `git status --porcelain` empty at the end.

      - name: Post /oc review to trigger Reviewer
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "/oc review" || true

      - name: Clean working tree (prevent auto-commit leaks)
        if: always()
        run: |
          git checkout -- . >/dev/null 2>&1 || true
          git clean -fd >/dev/null 2>&1 || true
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then echo "dirty after clean:"; echo "$dirty"; fi
          exit 0

      - name: Strip owner Co-authored-by trailers from the PR branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          pr="${{ github.event.issue.number }}"
          branch=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName' 2>/dev/null || echo "")
          [ -z "$branch" ] && exit 0
          git fetch origin "refs/heads/$branch:refs/remotes/origin/prbranch" --quiet 2>/dev/null || exit 0
          bad=$(git log --format=%B refs/remotes/origin/main..refs/remotes/origin/prbranch 2>/dev/null | grep -c 'Co-authored-by: Userfrom1995' || true)
          if [ "$bad" -eq 0 ]; then
            echo "No leaked owner trailers on $branch"
            exit 0
          fi
          echo "Stripping $bad leaked Co-authored-by trailer(s) from $branch"
          git checkout --detach refs/remotes/origin/prbranch --quiet
          git filter-branch -f --msg-filter 'sed "/^Co-authored-by: Userfrom1995.*/d"' refs/remotes/origin/main..HEAD >/dev/null 2>&1
          git push --force origin "HEAD:refs/heads/$branch" --quiet
          echo "Trailers stripped and force-pushed to $branch"

      - name: Approve held CI runs on the PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          set +e
          pr="${{ github.event.issue.number }}"
          for i in $(seq 1 30); do
            head_sha=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid' 2>/dev/null)
            echo "Looking for held runs on PR #$pr (head $head_sha)"
            held=$(gh run list --repo "${{ github.repository }}" --commit "$head_sha" --status action_required --json databaseId --jq '.[].databaseId' 2>/dev/null)
            if [ -z "$held" ]; then
              echo "No held runs remain (poll $i)"
              exit 0
            fi
            for run in $held; do
              if gh api --method POST "repos/${{ github.repository }}/actions/runs/$run/approve" -H "Accept: application/vnd.github+json" >/dev/null 2>&1; then
                echo "Approved run $run"
              else
                echo "APPROVE FAILED for run $run"
              fi
            done
            sleep 5
          done
          echo "Held runs could not be auto-approved after polling"
          GH_TOKEN="${{ github.token }}" gh api "repos/${{ github.repository }}/issues/$pr/comments" \
            -f body="Workflow runs on this PR are awaiting approval and could not be auto-approved. Please approve them in the Actions tab so the review loop can continue: ${{ github.server_url }}/${{ github.repository }}/actions" >/dev/null 2>&1 || true
          exit 0

      - name: Verify fix pushed, else auto-retry
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          BASELINE_HEAD: ${{ steps.baseline.outputs.head_before }}
        run: |
          pr="${{ github.event.issue.number }}"
          head_after=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid' 2>/dev/null)
          if [ -n "$head_after" ] && [ "$head_after" != "$BASELINE_HEAD" ]; then
            echo "Fix pushed (PR head moved)"
            exit 0
          fi
          echo "No push detected"
          retries=$(gh api "repos/${{ github.repository }}/issues/$pr/comments" \
            --jq '[.[] | select(.user.login == "${{ github.repository_owner }}" and (.body | startswith("/oc fix (auto-retry")))] | length' 2>/dev/null || echo "0")
          if [ "$retries" -lt 3 ]; then
            n=$((retries + 1))
            echo "Posting auto-retry $n"
            gh api "repos/${{ github.repository }}/issues/$pr/comments" -f body="/oc fix (auto-retry $n)"
            exit 0
          fi
          echo "::error::Fix agent finished without pushing after 4 attempts (1 initial + 3 auto-retries). Manual intervention required."
          exit 1

  general:
    if: |
      !startsWith(github.event.comment.body, '/oc review') &&
      !startsWith(github.event.comment.body, '/oc approve') &&
      !startsWith(github.event.comment.body, '/opencode review') &&
      !startsWith(github.event.comment.body, '/oc build') &&
      !startsWith(github.event.comment.body, '/opencode build') &&
      !startsWith(github.event.comment.body, '/oc continue') &&
      !startsWith(github.event.comment.body, '/opencode continue') &&
      github.event.comment.body != '/oc fix' &&
      !startsWith(github.event.comment.body, '/oc fix (auto-retry') &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ github.token }}

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode general agent
        id: opencode
        continue-on-error: true
        timeout-minutes: 25
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            You are the General agent of the Random factory, triggered by a plain "/oc" request (a question, housekeeping, or a small change).

            READ FIRST: `.github/agents/general.md` — that file IS your complete system prompt; every rule there is binding (full capabilities, housekeeping vs code-change judgment, preservation rules, sign-off). If the file is missing from the tree, rely on the safety net below plus AGENTS.md.

            SAFETY NET (always binding):
            - Answer/housekeeping = a comment or API action is complete; code changes get committed (as `github-actions[bot]`, NEVER a `Co-authored-by:` trailer), pushed, and PR'd when appropriate — nothing forced.
            - You never post "/oc" comments; comment only as `github-actions[bot]`; never expose secrets; never remove the README first section, the root `index.html`, `docs/`, the pages.yml PR-preview feature, or the factory infrastructure without a clear request.
            - Sign your work: commit subjects start with `general:`, comments end with `— the General agent`.

      - name: Post /oc maintainer to trigger Maintainer
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "/oc maintainer" || true

      - name: Clean working tree (prevent auto-commit leaks)
        if: always()
        run: |
          git checkout -- . >/dev/null 2>&1 || true
          git clean -fd >/dev/null 2>&1 || true
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then echo "dirty after clean:"; echo "$dirty"; fi
          exit 0

      - name: Approve held CI runs on the PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          set +e
          issue="${{ github.event.issue.number }}"
          if [ -n "${{ github.event.issue.pull_request.html_url }}" ]; then
            pr="$issue"
          else
            pr=$(gh pr list --repo "${{ github.repository }}" --state open --json number,headRefName,createdAt \
              --jq '[.[] | select(.headRefName | startswith("opencode/"))] | sort_by(.createdAt) | last | .number' 2>/dev/null)
          fi
          if [ -z "$pr" ]; then
            echo "No PR context — repo-wide sweep of held runs"
            for i in $(seq 1 10); do
              held=$(gh run list --repo "${{ github.repository }}" --status action_required --limit 100 --json databaseId --jq '.[].databaseId' 2>/dev/null)
              if [ -z "$held" ]; then
                echo "No held runs remain (sweep $i)"
                exit 0
              fi
              for run in $held; do
                if gh api --method POST "repos/${{ github.repository }}/actions/runs/$run/approve" -H "Accept: application/vnd.github+json" >/dev/null 2>&1; then
                  echo "Approved run $run"
                else
                  echo "APPROVE FAILED for run $run (a later sweep or a human click will retry)"
                fi
              done
              sleep 5
            done
            echo "Held runs could not all be auto-approved after sweeping"
            exit 0
          fi
          for i in $(seq 1 30); do
            head_sha=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid' 2>/dev/null)
            if [ -z "$head_sha" ]; then
              echo "PR #$pr gone (poll $i); exiting"
              exit 0
            fi
            held=$(gh run list --repo "${{ github.repository }}" --commit "$head_sha" --status action_required --json databaseId --jq '.[].databaseId' 2>/dev/null)
            if [ -z "$held" ]; then
              echo "No held runs remain (poll $i)"
              exit 0
            fi
            for run in $held; do
              if gh api --method POST "repos/${{ github.repository }}/actions/runs/$run/approve" -H "Accept: application/vnd.github+json" >/dev/null 2>&1; then
                echo "Approved run $run"
              else
                echo "APPROVE FAILED for run $run"
              fi
            done
            sleep 5
          done
          echo "Held runs could not be auto-approved after polling"
          GH_TOKEN="${{ github.token }}" gh api "repos/${{ github.repository }}/issues/$pr/comments" \
            -f body="Workflow runs on this PR are awaiting approval and could not be auto-approved. Please approve them in the Actions tab so the review loop can continue: ${{ github.server_url }}/${{ github.repository }}/actions" >/dev/null 2>&1 || true
          exit 0