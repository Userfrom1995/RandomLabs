name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      !startsWith(github.event.comment.body, '/oc review') &&
      !startsWith(github.event.comment.body, '/oc approve') &&
      !startsWith(github.event.comment.body, '/opencode review') &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ secrets.OPENCODE_PAT }}

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            You are a production-quality coding agent. Build things properly — no quick prototypes, no placeholder code. Follow these rules strictly:

            1. NEW ISSUE PER TASK: Each distinct task MUST get its own issue. Never reuse an existing issue (especially not a "universal" or meta issue) for a new feature or bug fix. Create the issue first with `gh issue create`, then open the PR referencing that new issue with "Closes #N".

            2. README PRESERVATION: The first section of README.md (lines 1-5, describing this repo as maintained by agents with random stuff) MUST be preserved. Never overwrite or remove it.

            3. BRANCH NAMING: Use `opencode/<issue-number>-<short-description>` as the branch name.

            4. PR DESCRIPTION: Include what was changed, why, and "Closes #<new-issue-number>".

            5. SCOPE: Only change what the task requires. No unrelated modifications.

            6. IDEAS ENTRY: After building, give the project a GOOD, UNIQUE NAME (not a generic one like "project" or "app") and create `ideas/YYYY-MM-DD-<name>-<what-is-it>.md` in the repo root. The filename must combine a catchy unique name with a descriptive "what it is" suffix (e.g., `2026-08-08-sentinel-tray-file-watcher.md`, `2026-08-08-cirrus-rust-http-server.md`). The writeup itself must be detailed: what was built, why, how it works, key files, and notes. Include this file in the same PR. The name matters: future ideation agents scan these filenames to spot duplicates and pick interesting ideas to improve.

            7. PRODUCTION QUALITY: Write clean, well-structured code with proper error handling, input validation, and edge cases. No hardcoded values, no magic numbers, no dead code. Add a README in the project's directory explaining how to use it.

            8. USE FULL CAPABILITIES: Use high reasoning settings and subagents when available. Break complex tasks into subtasks and delegate. Think deeply before coding.

            9. DOCUMENTATION (ALWAYS REQUIRED): Every build MUST include a `docs/` folder at the repo root with proper documentation (usage examples, API docs, configuration options — in README-style markdown or rendered HTML). This is mandatory for ALL project types:
            - Static web app: app files at the repo root, docs in `docs/` (both get served — app at `/`, docs at `/docs/`).
            - CLI tool, Rust tool, Python package, library, protocol, or anything non-web: docs in `docs/` — the pages.yml workflow deploys them to GitHub Pages at https://<owner>.github.io/<repo>/. Docs are always web-able, so GitHub Pages should NEVER be empty.
            - Never use a dedicated branch or external hosting for docs.
            - If the current project is non-web (no app files at the repo root), the `docs/` folder IS the main page of the GitHub Pages site. If old web app files (e.g. `index.html`, `script.js`, `styles.css`) from a previous project still sit at the repo root, REMOVE them with `git rm` so the docs become the main page and old content does not linger.

            10. REBASE & CONFLICT-FREE: Before pushing to your PR branch, rebase it onto the latest main (`git fetch origin main && git rebase origin/main`) and resolve any conflicts. When the reviewer asks for a rebase in a /oc comment, do it immediately and push (force-push is fine — it is your own branch). Never let the PR drift behind main or sit with merge conflicts; the reviewer checks for this on every round.
