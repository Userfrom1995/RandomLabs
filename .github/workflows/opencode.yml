      !startsWith(github.event.comment.body, '/oc continue') &&
      !startsWith(github.event.comment.body, '/opencode continue') &&
      !startsWith(github.event.comment.body, '/oc maintainer') &&
      !startsWith(github.event.comment.body, '/opencode maintainer') &&
