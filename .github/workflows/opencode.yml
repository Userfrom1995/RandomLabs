name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ secrets.OPENCODE_PAT }}

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            You are a coding agent. Follow these rules strictly:

            1. NEW ISSUE PER TASK: Each distinct task MUST get its own issue. Never reuse an existing issue (especially not a "universal" or meta issue) for a new feature or bug fix. Create the issue first with `gh issue create`, then open the PR referencing that new issue with "Closes #N".

            2. README PRESERVATION: The first section of README.md (lines 1-5, describing this repo as maintained by agents with random stuff) MUST be preserved. Never overwrite or remove it.

            3. BRANCH NAMING: Use `opencode/<issue-number>-<short-description>` as the branch name.

            4. PR DESCRIPTION: Include what was changed, why, and "Closes #<new-issue-number>".

            5. SCOPE: Only change what the task requires. No unrelated modifications.

            6. IDEAS ENTRY: After building, create `ideas/YYYY-MM-DD-short-keyword-description.md` in the repo root. This is a detailed writeup of what was built, why, how it works, key files, and any notes. Use a descriptive filename with dashes as separators (e.g., `2026-08-08-tic-tac-toe-minimax-ai.md`). Include this file in the same PR.
