name: opencode-recover

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  # Issue #601: every comment on a PR spawns a recover run; non-"/oc recover"
  # comments skip at the job gate but still share this group with the real
  # recovery runs (comment triggers, PR-close detects). queue: max keeps up to
  # 100 pending runs FIFO so a pending recovery is never displaced.
  group: recover-${{ github.event.issue.number || github.event.pull_request.number || 'detect' }}
  queue: max
  cancel-in-progress: false

jobs:
  # Auto-detect closed (non-merged) build PRs whose branch advanced past the
  # recorded head, and recover them without any human action. Fully scripted:
  # no LLM, no chance of a runaway loop. The one-PR rule and the
  # "merged/already-recovered" guards inside recover.sh prevent duplicates.
  detect:
    if: |
      github.event_name != 'issue_comment' &&
      (github.event_name != 'pull_request' || github.event.pull_request.merged == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "The Recover Agent"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run auto-detect recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/recover.sh --detect

      - name: Approve held CI runs on recovered PRs
        continue-on-error: true
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          set +e
          # Shared self-healing logic (issue #137): head-scoped polling per PR,
          # then ALWAYS a terminal repo-wide sweep that also clears runs held on
          # intermediate head SHAs, which head-scoped polling can never match
          # again (review of PR #139, finding B). No notify ping here: the
          # detector runs every 20 minutes and will retry on its own.
          for pr in $(gh pr list --repo "${{ github.repository }}" --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("opencode/issue") or startswith("opencode/lab"))] | .[].number' 2>/dev/null); do
            APPROVE_PR="$pr" APPROVE_SERVER="${{ github.server_url }}" \
              bash .github/scripts/approve-held-runs.sh
          done
          exit 0

      # Issue #836: the Maintainer's own schedule is throttled by the platform
      # (about 4.2 wakes/day observed over the 10 days to 2026-11-09, median gap
      # 6.0 hours) and a pool-wide free-usage wall outlasts its one-attempt
      # recovery chain, so neither its cron nor its own walled runner can
      # re-arm the lane. This scripted arm is an independent wake source.
      # STATE.md on the maintainer/logs branch is the heartbeat: the memory
      # publish step replaces it only from the agent's own state bundle (the
      # walled auto-stub keeps the old file), so its "Last updated:" stamp is
      # written only by a real session (the Maintainer prompt pins the exact
      # `Last updated: <UTC>Z by run <id>` line). When that stamp is older than
      # the staleness threshold and no recent Maintainer run is active,
      # dispatch maintainer.yml once. The run gate reads the newest 1000 runs
      # (a 50-run window spans under the 75-minute job cap, so a burst of
      # short per-target runs could push a live global run out of view):
      # in-progress runs count at any age, while queued/requested/waiting/
      # pending runs are age-bounded so a months-old zombie cannot suppress
      # every future heartbeat. Every dispatch is recorded FIRST as one
      # bot-authored marker comment on the oldest open non-PR lab-health board
      # (a stable ledger, not the newest transient audit issue), which both
      # audits the wake and enforces the cooldown; if the dispatch then fails
      # the marker is rolled back so the failed attempt does not consume the
      # ledger. An unreadable board, comment list, or run list fails closed
      # (no dispatch), including a valid-JSON run page of the wrong shape
      # (an object instead of an array, or entries without a string status
      # and createdAt), so this can never become a dispatch storm. The
      # effective 90-minute staleness and cooldown arithmetic is pinned
      # exactly by R34. The note carries no inline trigger token (issue #775).
      - name: "Maintainer stale-session heartbeat (issue #836)"
        id: maintainer_heartbeat
        shell: bash
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          stale_minutes=90
          cooldown_minutes=90
          marker='<!-- maintainer-heartbeat -->'
          now=$(date -u +%s)
          cutoff=$(date -u -d "${stale_minutes} minutes ago" +%Y-%m-%dT%H:%M:%SZ)
          state=$(gh api "repos/${GITHUB_REPOSITORY}/contents/STATE.md?ref=maintainer/logs" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)
          stamp=$(printf '%s\n' "$state" | sed -n 's/^Last updated: \([0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]Z\).*/\1/p' | head -n 1)
          last=""
          if [ -n "$stamp" ]; then
            last=$(date -u -d "$stamp" +%s 2>/dev/null || true)
          fi
          if [ -n "$last" ]; then
            age=$(( (now - last) / 60 ))
            if [ "$age" -lt "$stale_minutes" ]; then
              echo "Maintainer heartbeat is fresh (last real session ${age}m ago, threshold ${stale_minutes}m); no heartbeat dispatch."
              exit 0
            fi
            echo "::warning::Maintainer heartbeat is stale (last real session ${age}m ago, threshold ${stale_minutes}m, issue #836); checking for an active run."
          else
            echo "::warning::could not establish the Maintainer heartbeat from STATE.md on maintainer/logs (missing or unparseable, issue #836); treating it as stale."
          fi
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow maintainer.yml --limit 1000 --json status,createdAt 2>/dev/null) || runs=""
          if [ -z "$runs" ] || [ "$runs" = "null" ]; then
            echo "::warning::could not enumerate Maintainer runs (issue #836); skipping the heartbeat so a broken query can never duplicate a live run."
            exit 0
          fi
          if ! printf '%s' "$runs" | jq -e 'type == "array" and all(.[]; type == "object" and (.status | type) == "string" and (.createdAt | type) == "string")' >/dev/null 2>&1; then
            echo "::warning::the Maintainer run list returned unexpected JSON (issue #836); skipping the heartbeat so a broken query can never duplicate a live run."
            exit 0
          fi
          active=$(printf '%s' "$runs" | jq --arg cutoff "$cutoff" '[.[] | select(.status == "in_progress" or ((.status == "queued" or .status == "requested" or .status == "waiting" or .status == "pending") and .createdAt >= $cutoff))] | length' 2>/dev/null) || active=""
          case "$active" in
            ''|*[!0-9]*)
              echo "::warning::could not classify active Maintainer runs (issue #836); skipping the heartbeat so a broken query can never duplicate a live run."
              exit 0
              ;;
          esac
          if [ "$active" -gt 0 ]; then
            echo "A Maintainer run is already active (${active}: in progress at any age, or queued inside the 90-minute window); no heartbeat dispatch."
            exit 0
          fi
          board=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=lab-health&sort=created&direction=asc&per_page=100" --jq '[.[] | select(.pull_request == null)] | sort_by(.number) | .[0].number' 2>/dev/null || true)
          if [ -z "$board" ] || [ "$board" = "null" ]; then
            echo "::warning::no open lab-health board; skipping the heartbeat dispatch (the cooldown ledger needs the board, issue #836)."
            exit 0
          fi
          comments=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${board}/comments?per_page=100" --paginate --slurp 2>/dev/null) || comments=""
          if [ -z "$comments" ]; then
            echo "::warning::could not read the lab-health board comments (issue #836); skipping the heartbeat dispatch (fail closed against duplicate wakes)."
            exit 0
          fi
          if ! printf '%s' "$comments" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::warning::lab-health board comments returned unexpected JSON (issue #836); skipping the heartbeat dispatch (fail closed against duplicate wakes)."
            exit 0
          fi
          if ! newest=$(printf '%s' "$comments" | jq -r --arg marker "$marker" '[.[][] | select(.user.login == "github-actions[bot]") | select((.body // "") | endswith($marker)) | .created_at] | sort | last // empty' 2>/dev/null); then
            echo "::warning::could not scan the lab-health board comments for the heartbeat marker (issue #836); skipping the heartbeat dispatch (fail closed)."
            exit 0
          fi
          if [ -n "$newest" ]; then
            posted_at=$(date -u -d "$newest" +%s 2>/dev/null || true)
            if [ -z "$posted_at" ]; then
              echo "::warning::could not parse the last heartbeat timestamp '${newest}' (issue #836); skipping the heartbeat dispatch (fail closed)."
              exit 0
            fi
            since=$(( (now - posted_at) / 60 ))
            if [ "$since" -lt "$cooldown_minutes" ]; then
              echo "A heartbeat dispatch was already recorded ${since}m ago (cooldown ${cooldown_minutes}m); no duplicate dispatch."
              exit 0
            fi
          fi
          note=$(printf 'Maintainer heartbeat (issue #836): the last real Maintainer session is older than %s minutes and no recent Maintainer run is active, so this recover-arm tick dispatches maintainer.yml once. The platform throttles the declared 20-minute Maintainer cron to only a few runs per day (about 4.2 observed over the 10 days to 2026-11-09), and a pool-wide free-usage wall outlasts the one-attempt recovery chain, so this scripted arm is the independent wake source. Cooldown: one dispatch per %s minutes, deduped by this marker.\n\n%s' "$stale_minutes" "$cooldown_minutes" "$marker")
          posted=""
          if ! posted=$(gh issue comment "$board" --body "$note"); then
            echo "::warning::could not record the heartbeat on lab-health issue #${board} (issue #836); skipping the dispatch so a missing cooldown marker can never cause a dispatch storm."
            exit 0
          fi
          if ! gh workflow run maintainer.yml --repo "$GITHUB_REPOSITORY" --ref main -f reason="heartbeat: no real Maintainer session for at least ${stale_minutes}m and no active run (issue #836)"; then
            comment_id="${posted##*-}"
            case "$comment_id" in
              ''|*[!0-9]*)
                echo "::warning::could not read the heartbeat marker comment id back from '${posted}'; the cooldown may suppress the next heartbeat for up to ${cooldown_minutes} minutes (issue #836)."
                ;;
              *)
                if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" >/dev/null 2>&1; then
                  echo "::warning::removed heartbeat marker comment ${comment_id} after the failed dispatch so the cooldown does not consume the next heartbeat (issue #836)."
                else
                  echo "::warning::could not remove heartbeat marker comment ${comment_id} after the failed dispatch; the cooldown may suppress the next heartbeat for up to ${cooldown_minutes} minutes (issue #836)."
                fi
                ;;
            esac
            echo "::error::could not dispatch the Maintainer heartbeat (issue #836); failing loudly so the dead wake path is visible."
            exit 1
          fi
          echo "::notice::dispatched the Maintainer heartbeat after a stale real session (issue #836)."

  # Manual /oc recover on a PR or issue: runs the Recover Agent, which invokes
  # recover.sh for the actual git/PR surgery and then reports.
  recover:
    if: startsWith(github.event.comment.body, '/oc recover') || startsWith(github.event.comment.body, '/opencode recover')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Actor write gate (issue #428)
        id: actor_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_ACTOR: ${{ github.actor }}
          GATE_LABEL: recover
        run: bash .github/scripts/actor-write-gate.sh

      - name: Configure git identity
        run: |
          git config --global user.name "The Recover Agent"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve target PR from the trigger
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue="${{ github.event.issue.number }}"
          if [ -n "${{ github.event.issue.pull_request.html_url }}" ]; then
            echo "pr=$issue" >> "$GITHUB_OUTPUT"
          else
            pr=$(gh pr list --repo "${{ github.repository }}" --state all --json number,headRefName,createdAt \
              --jq '[.[] | select(.headRefName | startswith("opencode/issue'"${issue}"'-"))] | sort_by(.createdAt) | last | .number' 2>/dev/null || echo "")
            echo "pr=${pr:-$issue}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved recovery target PR: ${pr:-$issue}"

      - name: Run Recover agent
        id: opencode
        if: steps.actor_gate.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 45
        uses: ./.github/actions/opencode-run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          # Issue #831: never auto-load project config/instructions from the
          # checked-out tree (a PR-triggered run operates on the PR head);
          # the vendored runner also removes the project plugin directories
          # before the CLI starts. The grant keeps this session's /tmp
          # contract files reachable when the opt-out disables the repo
          # permission.
          OPENCODE_DISABLE_PROJECT_CONFIG: "true"
          OPENCODE_PERMISSION: '{"external_directory":{"*":"allow"}}'
        with:
          variant: max
          model: opencode/deepseek-v4.1-flash-free
          use_github_token: true
          prompt: |
            You are The Recover Agent of the Random lab, triggered by "/oc recover".

            READ FIRST: `.github/agents/recover.md` - that file IS your complete system prompt; every rule there is binding.

            SAFETY NET (always binding):
            - Recovery target PR number: ${{ steps.target.outputs.pr }}.
            - You ONLY run `bash .github/scripts/recover.sh <PR_NUMBER>` and then post a plain-text bot-signed comment describing the outcome. You never push, merge, rewrite main, or post "/oc" comments yourself.
            - Commit as `github-actions[bot]`, NEVER add any `Co-authored-by:` trailer.
            - Sign your comment: ` -  the Recover Agent`. NO EM DASHES.

      - name: Fallback direct recovery if the agent produced no result
        if: always() && steps.actor_gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          pr="${{ steps.target.outputs.pr }}"
          [ -z "$pr" ] && exit 0
          # If a continuation PR already exists for this target's branch, the agent
          # (or a prior run) already handled it; otherwise run the engine directly.
          branch=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName' 2>/dev/null || echo "")
          if [ -n "$branch" ]; then
            exist=$(gh pr list --repo "${{ github.repository }}" --state open --head "$branch" --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -n "$exist" ] && [ "$exist" != "$pr" ]; then
              echo "Continuation PR #$exist already open for $branch; skipping direct run."
              exit 0
            fi
          fi
          bash .github/scripts/recover.sh "$pr" || true

      - name: Approve held CI runs on the recovered PR
        continue-on-error: true
        if: always() && steps.actor_gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          set +e
          # Shared self-healing logic (issue #137): head-scoped polling plus a
          # terminal repo-wide sweep that also clears runs held on intermediate
          # head SHAs, which head-scoped polling can never match again (review
          # of PR #139, finding B). No notify ping: the detector loop retries.
          pr="${{ steps.target.outputs.pr }}"
          [ -z "$pr" ] && exit 0
          APPROVE_PR="$pr" APPROVE_SERVER="${{ github.server_url }}" \
            bash .github/scripts/approve-held-runs.sh
          exit 0
