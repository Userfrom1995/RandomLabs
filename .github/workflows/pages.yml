name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage site
        run: |
          mkdir -p _site
          # If docs/ exists, deploy it (non-static projects)
          if [ -d "docs" ]; then
            cp -r docs/* _site/
          fi
          # If static web app files exist at root, deploy them
          if [ -f "index.html" ]; then
            cp index.html _site/
            [ -f "styles.css" ] && cp styles.css _site/
            [ -f "script.js" ] && cp script.js _site/
          fi
          # Always include docs/ subfolder if both app and docs exist
          if [ -d "docs" ] && [ -f "index.html" ]; then
            mkdir -p _site/docs
            cp -r docs/* _site/docs/
          fi

      - name: Stage PR previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs=$(gh api "repos/${{ github.repository }}/pulls?state=open" --jq '.[].number' || true)
          for pr in $prs; do
            if ! git fetch origin "pull/$pr/head:pr-$pr" --quiet; then
              echo "Skipping PR #$pr (could not fetch)"
              continue
            fi
            echo "Staging preview for PR #$pr"
            mkdir -p "_site/preview/pr-$pr"
            if ! git archive pr-$pr index.html styles.css script.js docs/ 2>/dev/null | tar -x -C "_site/preview/pr-$pr"; then
              echo "Skipping PR #$pr (could not archive)"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  comment:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Post or update preview URL comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="${{ github.event.pull_request.number }}"
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/pr-${pr}/"
          marker="<!-- opencode-preview-${pr} -->"
          body="### Preview

          ${marker}

          This PR's site will be served at **${url}** after the next deployment to \`main\`.

          - GitHub Pages only permits the default branch to deploy (the \`github-pages\` environment protection rules), and native Pages PR-preview support is still an internal alpha, so PRs cannot deploy directly.
          - The \`deploy\` job stages the production site plus previews of every open PR into a single artifact, so each push to \`main\` refreshes them. Once live, GitHub Pages can take ~30-60s to start serving the new build.
          - The preview is served under \`/preview/pr-${pr}/\`, so it never touches the production site."
          body="$(printf '%s\n' "$body" | sed 's/^[[:space:]]*//')"
          existing=$(gh api "repos/${{ github.repository }}/issues/${pr}/comments" --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${pr}/comments" -f body="$body" >/dev/null
          fi
