name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
  # Sweep aggregates push results with GITHUB_TOKEN, and GitHub never fires
  # push triggers for token-pushed commits (loop guard). Without this, M1/M2
  # medians land in git but Pages stays stale (seen 2026-09-12: no deploy on
  # 8a8e0989 or 77ee77d). Redeploy declaratively on sweep completion instead.
  workflow_run:
    workflows: [poolduel-m1, poolduel-m2, poolduel-m9, poolduel-m10-soak]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  actions: write

jobs:
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage site
        run: |
          mkdir -p _site
          # Root landing page at /, project docs at /docs/
          if [ -f "index.html" ]; then
            cp index.html _site/
            [ -f "styles.css" ] && cp styles.css _site/
            [ -f "script.js" ] && cp script.js _site/
            if [ -d "docs" ]; then
              mkdir -p _site/docs
              cp -r docs/* _site/docs/
            fi
          elif [ -d "docs" ]; then
            # Non-web project without a landing page: docs are the main page
            cp -r docs/* _site/
          fi
          # Automatically stage web apps OR project documentation
          for dir in */; do
            dir=${dir%/}
            if [ "$dir" != "docs" ] && [ "$dir" != "_site" ] && [ "$dir" != "preview" ] && [ -d "$dir" ]; then
              if [ -f "$dir/index.html" ]; then
                cp -r "$dir" "_site/$dir"
                rm -f "_site/$dir/"*.test.js "_site/$dir/README.md"
              elif [ -d "$dir/docs" ]; then
                mkdir -p "_site/$dir"
                cp -r "$dir/docs" "_site/$dir/"
              fi
            fi
          done
          # Fallback if nothing was staged
          if [ -z "$(ls -A _site)" ]; then
            echo "<h1>No site content yet</h1><p>This repo currently has no deployable web content.</p>" > _site/index.html
          fi

      - name: Stage PR previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs=$(gh api "repos/${{ github.repository }}/pulls?state=open" --jq '.[].number' || true)
          for pr in $prs; do
            if ! git fetch origin "pull/$pr/head:pr-$pr" --quiet; then
              echo "Skipping PR #$pr (could not fetch)"
              continue
            fi
            echo "Staging preview for PR #$pr"
            mkdir -p "_site/preview/pr-$pr"
            # Only archive paths that exist in the PR's tree, so a preview is
            # still staged when a project ships no root styles.css/script.js
            # (git archive aborts entirely on a missing pathspec otherwise).
            paths=""
            for p in index.html styles.css script.js docs; do
              if git rev-parse --verify "pr-$pr:$p" >/dev/null 2>&1; then paths="$paths $p"; fi
            done
            if [ -z "$paths" ]; then
              echo "Skipping PR #$pr (no site content)"
              continue
            fi
            if ! git archive pr-$pr $paths 2>/dev/null | tar -x -C "_site/preview/pr-$pr"; then
              echo "Skipping PR #$pr (could not archive)"
              continue
            fi
            # Pure-docs PRs: promote docs/ to the preview root so the advertised URL serves a page
            if [ ! -f "_site/preview/pr-$pr/index.html" ] && [ -f "_site/preview/pr-$pr/docs/index.html" ]; then
              cp -r "_site/preview/pr-$pr/docs/." "_site/preview/pr-$pr/"
            fi
            # Optional: stage web app or docs directory into the preview if the PR has one
            for dir in $(git ls-tree -d pr-$pr --name-only); do
              if [ "$dir" != "docs" ] && [ "$dir" != "_site" ] && [ -d "$dir" ] && [[ ! "$dir" == .* ]]; then
                if git archive pr-$pr "$dir/index.html" 2>/dev/null >/dev/null; then
                  if git archive pr-$pr "$dir/" 2>/dev/null | tar -x -C "_site/preview/pr-$pr"; then
                    rm -f "_site/preview/pr-$pr/$dir/"*.test.js "_site/preview/pr-$pr/$dir/README.md"
                  fi
                elif git archive pr-$pr "$dir/docs/" 2>/dev/null >/dev/null; then
                  mkdir -p "_site/preview/pr-$pr/$dir"
                  git archive pr-$pr "$dir/docs/" 2>/dev/null | tar -x -C "_site/preview/pr-$pr/$dir/"
                fi
              fi
            done
          done

      # upload-pages-artifact archives _site with `tar --dereference`, so a
      # symlink whose target is absent from the workspace aborts the whole tar
      # ("File removed before we read it", exit 1) and fails the deploy. One
      # dangling link anywhere in any staged PR preview therefore takes down
      # every deploy on main (live case 2026-09-24: PR #412 ships
      # prism/index.html, staging prism/benchmarks/data/kodak -> fetched,
      # untracked data; all main deploys died in Upload artifact while the
      # pull_request runs kept reporting green with the deploy job skipped).
      # A dangling link can never serve content on a static host, so drop it.
      - name: Prune dangling symlinks
        run: |
          if links=$(find _site -xtype l) && [ -n "$links" ]; then
            echo "Removing dangling symlinks that would abort the Pages artifact upload:"
            printf '%s\n' "$links"
            find _site -xtype l -delete
          fi

      # upload-pages-artifact archives _site with `tar --dereference
      # --hard-dereference`, so two distinct hostile-link classes can take
      # the main deploy down. Class 1 - boundary escapes: any symlink whose
      # canonical realpath is OUTSIDE _site is silently expanded into the
      # public Pages artifact and served from GitHub Pages (Tester hostile
      # proof on #416: a staged PR link to the runner's .git/config published
      # the checkout's GITHUB_TOKEN extraheader, and any `../` link pulls
      # workspace-adjacent paths). The dangling prune above only catches
      # broken links; it never inspects where a *valid* link points, and a
      # symlink loop also survives it (find -xtype l reports ELOOP and skips
      # the entry) while aborting tar outright, so pass 1 strips every link
      # whose realpath is not strictly inside _site: escaping targets,
      # symlink loops, and anything else unresolvable. Class 2 - in-site
      # ancestor recursion (reviewer finding on #419): a directory symlink
      # that canonicalizes strictly INSIDE _site can still walk back into its
      # own directory (`docs/up -> ../docs`, `preview/pr-N/docs/root -> .`,
      # cross-cycles `a/d1 -> ../b` + `b/d2 -> ../a`), so tar --dereference
      # follows it forever and dies (SIGSEGV after a 442 MB partial archive;
      # a cap instead times out). Both `git archive <pr> | tar -x` and `cp -r`
      # preserve such links from a hostile PR, so pass 2 walks the surviving
      # directory-link edges from each directory link's target and strips the
      # link when that walk can return to the link's own directory (exactly
      # when tar recurses forever).
      # The scan uses `find -type l` WITHOUT -L so it never follows a link
      # across the very boundary it enforces. Stripping instead of hard-failing
      # keeps a hostile or buggy PR from taking main deploys down, matching
      # the dangling-prune policy from #416. Idempotent: a rerun finds nothing
      # left to strip. Valid in-site links are untouched and still
      # dereference into the artifact.
      - name: Strip symlinks escaping _site
        run: |
          site_root="$(realpath -m -- _site)"
          stripped=0
          while IFS= read -r -d '' link; do
            if target="$(realpath -e -- "$link" 2>/dev/null)"; then
              case "$target" in
                "$site_root"/*) continue ;;
              esac
            else
              target="<unresolvable: dangling or symlink loop>"
            fi
            if [ "$stripped" -eq 0 ]; then
              echo "Removing symlinks that cross the _site boundary (tar --dereference would archive the target into the public Pages artifact):"
            fi
            printf '%s -> %s\n' "$link" "$target"
            rm -f -- "$link"
            stripped=$((stripped + 1))
          done < <(find _site -type l -print0)
          ep=()
          et=()
          cycle_logged=0
          while IFS= read -r -d '' link; do
            [ -d "$link" ] || continue
            t="$(realpath -e -- "$link" 2>/dev/null)" || continue
            ep+=("$(realpath -m -- "$(dirname -- "$link")")")
            et+=("$t")
          done < <(find _site -type l -print0)
          while IFS= read -r -d '' link; do
            [ -d "$link" ] || continue
            parent="$(realpath -m -- "$(dirname -- "$link")")"
            target="$(realpath -e -- "$link" 2>/dev/null)" || continue
            frontier="$target"
            seen=$'\n'
            hit=""
            while [ -n "$frontier" ]; do
              cur="${frontier%%$'\n'*}"
              if [ "$cur" = "$frontier" ]; then frontier=""; else frontier="${frontier#*$'\n'}"; fi
              [ -n "$cur" ] || continue
              case "$seen" in *$'\n'"$cur"$'\n'*) continue ;; esac
              seen="$seen$cur"$'\n'
              case "$parent" in "$cur"|"$cur"/*) hit=1; break ;; esac
              for i in "${!ep[@]}"; do
                case "${ep[$i]}" in "$cur"|"$cur"/*)
                  if [ -z "$frontier" ]; then frontier="${et[$i]}"; else frontier="$frontier"$'\n'"${et[$i]}"; fi ;;
                esac
              done
            done
            [ -n "$hit" ] || continue
            if [ "$cycle_logged" -eq 0 ]; then
              echo "Removing in-site directory symlinks that re-enter their own directory (tar --dereference recurses until SIGSEGV):"
              cycle_logged=1
            fi
            printf '%s -> %s\n' "$link" "$target"
            rm -f -- "$link"
            stripped=$((stripped + 1))
          done < <(find _site -type l -print0)
          if [ "$stripped" -gt 0 ]; then
            echo "Stripped $stripped symlink(s) crossing the _site boundary."
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  comment:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Post or update preview URL comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="${{ github.event.pull_request.number }}"
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/pr-${pr}/"
          marker="<!-- opencode-preview-${pr} -->"
          body="### Preview

          ${marker}

          This PR's site is live at **${url}** - deploying now; GitHub Pages can take ~30-60s to start serving it.

          - GitHub Pages only permits the default branch to deploy (the \`github-pages\` environment protection rules), so PRs cannot deploy directly; this job stages the production site plus previews of every open PR into a single artifact and re-deploys it whenever this PR opens or updates.
          - The preview is served under \`/preview/pr-${pr}/\`, so it never touches the production site."
          body="$(printf '%s\n' "$body" | sed 's/^[[:space:]]*//')"
          existing=$(gh api "repos/${{ github.repository }}/issues/${pr}/comments" --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${existing}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${pr}/comments" -f body="$body" >/dev/null
          fi

      - name: Trigger preview deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "${{ github.repository }}" 2>&1 | tail -2 || echo "Dispatch failed; preview will appear on the next push to main"
