          poster=$(gh api --hostname github.com -H "Accept: application/vnd.github.raw" "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/post-peros-findings.sh?ref=${GITHUB_SHA}" 2>/dev/null) || poster=""
