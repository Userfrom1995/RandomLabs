          guard=$(gh api --hostname github.com -H "Accept: application/vnd.github.raw" "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/peros-scope-guard.sh?ref=${GITHUB_SHA}" 2>/dev/null) || guard=""
          if [ -z "$guard" ]; then
            echo "::error::Per-OS scope guard absent from workflow commit ${GITHUB_SHA}; refusing to leave an unscoped branch (issue #798, fail closed)."
