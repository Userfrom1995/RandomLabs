        run: |
          # Issue #798: the vendored runner auto-commits inside the agent step,
          # so leaked owner trailers can only be removed after its push. Issue #798
          # review B8: read the reviewed strip helper through the GitHub contents
          # API, never with a post-agent `git show`. An agent can export GIT_DIR or
          # GIT_OBJECT_DIRECTORY through $GITHUB_ENV and plant a fake loose object
          # named GITHUB_SHA; git accepts it without hash verification, so a
          # workspace read would execute attacker-controlled helper text and turn
          # this step into a no-op. The API read is SHA-addressed to this run's
          # workflow commit and has no workspace git surface; the fresh private
          # GH_CONFIG_DIR prelude, the GH_HOST pin, and the lowercase-proxy unset
          # keep an agent-planted gh config or proxy from redirecting it (issue
          # #798 review B1 class). Issue #798 review F2/F3/F7: pass the captured
          # pre-agent baseline so only the new range is rewritten, and the pinned
          # REMOTE_URL plus the hardened config env so the helper never trusts the
          # post-agent workspace remote.
          set -eo pipefail
          gh_cfg="$(mktemp -d 2>/dev/null)" || gh_cfg=""
          if [ -z "$gh_cfg" ] || [ ! -d "$gh_cfg" ]; then
            echo "::error::Could not create a fresh gh config directory for the trailer strip; refusing to run with agent-writable gh state (issue #798, fail closed)."
            exit 1
          fi
          if ! chmod 700 "$gh_cfg"; then
            echo "::error::Could not secure the fresh gh config directory; refusing to run with agent-writable gh state (issue #798, fail closed)."
            exit 1
          fi
          export GH_CONFIG_DIR="$gh_cfg"
          trap 'rm -rf "$gh_cfg"' EXIT
          unset all_proxy http_proxy https_proxy no_proxy 2>/dev/null || true
          strip=$(gh api --hostname github.com -H "Accept: application/vnd.github.raw" "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/strip-trailers.sh?ref=${GITHUB_SHA}" 2>/dev/null) || strip=""
          if [ -z "$strip" ]; then
            echo "::error::Trailer strip helper absent from workflow commit ${GITHUB_SHA}; refusing to leave an unsanitized branch (issue #798, fail closed)."
            exit 1
          fi
          printf '%s\n' "$strip" | bash -s -- "$BASELINE_SHA"

