ion per planned pass) BEFORE the first heavy pass, update each section as its pass completes, and keep the sign-off as the last non-empty line at all times, so a capped or crashed agent step still leaves a usable partial report that the workflow salvages behind a provenance banner; the decision file stays the FINAL act and its absence still fails the run closed. The workflow posts the report as the findings comment; never depend on your final session message, and never post the findings comment or any "/oc" trigger yourself.

      - name: "Strip owner Co-authored-by trailers from the per-OS branch (issue #798)"
        id: strip_trailers
        if: always() && steps.actor_gate.outputs.run == 'true' && steps.pre_agent_baseline.outcome == 'success'
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
