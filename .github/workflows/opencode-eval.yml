name: opencode-eval

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: opencode-eval-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  eval:
    # Triggered explicitly by /oc eval (called after Tester approval in the pipeline).
    # Result comments never retrigger: they post as github-actions[bot] WITHOUT a
    # leading /oc prefix, and this guard excludes any legacy "/oc eval result" body
    # so a rejection can never self-dispatch an infinite eval loop.
    if: |
      github.event.issue.pull_request != null && (
        startsWith(github.event.comment.body, '/oc eval') ||
        startsWith(github.event.comment.body, '/opencode eval')
      ) && !startsWith(github.event.comment.body, '/oc eval result') && !startsWith(github.event.comment.body, '/opencode eval result')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Get PR info
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.issue.number }}"
          head_ref=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout repository (PR head)
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ github.token }}
          ref: ${{ steps.pr-info.outputs.head_ref }}
          fetch-depth: 0

      - name: Actor write gate (issue #428)
        id: actor_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_ACTOR: ${{ github.actor }}
          GATE_LABEL: eval
        run: bash .github/scripts/actor-write-gate.sh

      - name: Configure git identity
        run: |
          git config --global user.name "The Evaluator"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read deliverable context
        id: context
        if: steps.actor_gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.issue.number }}"
          head_ref=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName' 2>/dev/null || echo "")
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

          # Verify Tester approval presence (binding mechanism: evaluator blocks after tester).
          approval_comments=$(gh api "repos/${{ github.repository }}/issues/$pr/comments" \
            --jq '[.[] | select(.body | contains("/oc approve-test"))] | length' 2>/dev/null || echo "0")
          echo "approval_comments=$approval_comments" >> "$GITHUB_OUTPUT"

          # Read progress/status from the branch.
          branch="${head_ref:-main}"
          git fetch origin "$branch" --quiet 2>/dev/null || true

      - name: Clear runtime decision
        run: rm -f /tmp/evaluator-decision.json /tmp/live-run-evidence.json

      - name: Restore the vendored runner when the checked-out head predates it
        run: |
          set -o pipefail
          # Local `uses: ./.github/actions/opencode-run` resolves against this
          # workspace (the PR head), never against the ref this workflow file was
          # loaded from, so a branch forked before the runner was vendored dies
          # before the agent starts with "Can't find 'action.yml' ... under
          # .../opencode-run" (issue #430). Restore the runner from this run's
          # own workflow commit instead.
          if [ -f .github/actions/opencode-run/action.yml ]; then
            echo "Vendored runner present on the checked-out head; nothing to restore."
            exit 0
          fi
          if ! git cat-file -e "${GITHUB_SHA}:.github/actions/opencode-run/action.yml" 2>/dev/null; then
            git fetch --quiet --depth=1 origin "${GITHUB_SHA}" 2>/dev/null || true
          fi
          if ! git cat-file -e "${GITHUB_SHA}:.github/actions/opencode-run/action.yml" 2>/dev/null; then
            echo "::error::Vendored runner absent from the checked-out head and from workflow commit ${GITHUB_SHA}; the agent gate cannot run (fail closed)."
            exit 1
          fi
          rm -rf .github/actions/opencode-run
          git archive "${GITHUB_SHA}" -- .github/actions/opencode-run | tar -x
          printf '%s\n' ".github/actions/opencode-run/" >> "$(git rev-parse --git-path info/exclude)"
          if [ ! -f .github/actions/opencode-run/action.yml ]; then
            echo "::error::Runner restore from ${GITHUB_SHA} did not yield action.yml (fail closed)."
            exit 1
          fi
          echo "Restored .github/actions/opencode-run from workflow commit ${GITHUB_SHA}; the checked-out head predates the vendored runner."

      - name: Run evaluator agent
        id: evaluator
        if: steps.actor_gate.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 75
        uses: ./.github/actions/opencode-run
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: opencode/mimo-v2.6-flash-free
          use_github_token: true
          prompt: |
            You are the Evaluator of the Random lab, triggered by "/oc eval" on the open PR in this checkout.

            READ FIRST: `.github/agents/evaluator.md` - that file IS your complete system prompt; every rule there is binding.

            SAFETY NET (always binding):
            - Before ending the run, you MUST write `/tmp/evaluator-decision.json` with exactly one action: either `{"action":"approve-eval","score":X.X,"summary":"...","dimensions":{"empirical":X.X,"baseline":X.X,"visual":X.X,"resilience":X.X,"reproducibility":X.X}}` or `{"action":"fix","score":X.X,"critique":"...","dimensions":{"empirical":X.X,"baseline":X.X,"visual":X.X,"resilience":X.X,"reproducibility":X.X}}`.
            - Sign your work: every comment ends with your sign-off (`- The Quality Council (Evaluator)`).
            - You never post "/oc" comments yourself; the hardcoded workflow step posts the trigger.
            - Verify the Tester has approved (`/oc approve-test` is present in PR comments) before giving approval; otherwise document the missing phase in your decision file.
            - Invoke subagents for parallel evaluation: visual inspection (headless Playwright), scientific review (proof audit, benchmark verification, boundary fuzzing), CLI execution (interactive resilience, hostile inputs, reproduction script verification). NOTE: go test/vet/build and other bare test-runner commands are NOT CLI execution; only executing the shipped entrypoint with its runtime dependencies counts.
            - LIVE-EXECUTION PROOF (hard gate): before any approve-eval verdict you MUST write /tmp/live-run-evidence.json per evaluator.md section 6: {"commands":[{"cmd":"...","exit_code":0,"output_tail":"..."}]} with at least one NON-test command against the shipped entrypoint (or {"scope":"unrunnable","reason":"..."} if the environment truly cannot run it). The workflow blocks approve-eval (red run) if this file is missing or holds only test/compile commands.
            - End with a clean working tree (`git status --porcelain` must be empty at the end).

      - name: Verify evaluator decided
        id: verify-eval
        if: always()
        env:
          AGENT_GATE: ${{ steps.actor_gate.outputs.run }}
        run: |
          # Terminal third outcome for a gate skip (issue #428): the evaluator
          # step never started, so a missing decision file is a DENIAL, not a
          # crash. Report has_decision=false so the result post, the owner-PAT
          # forward, the evidence gate, and the memory push all stay skipped:
          # a denial must not post, escalate, or auto-retry.
          if [ "${AGENT_GATE:-}" != "true" ]; then
            echo "::notice::Actor write gate skipped the evaluator agent (issue #428): denial is not a crash - no auto-retry, no escalation."
            echo "outcome=skipped" >> "$GITHUB_OUTPUT"
            echo "has_decision=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          outcome="${{ steps.evaluator.outcome }}"

          # Fail-closed guard: any missing decision file is a hard failure (crash or timeout).
          if [ -f /tmp/evaluator-decision.json ]; then
            echo "Evaluator decision file present; gate produced a verdict (step outcome: $outcome)."
            echo "has_decision=true" >> "$GITHUB_OUTPUT"
            # Log what kind of result we have.
            action=$(jq -r '.action // "unknown"' /tmp/evaluator-decision.json 2>/dev/null || echo "unknown")
            echo "eval_action=$action" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Evaluator step finished with outcome '$outcome' and no decision file (timed out or crashed mid-run). Failing closed instead of exiting green."
          echo "has_decision=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Enforce live-execution evidence gate
        id: evidence-gate
        if: always() && steps.verify-eval.outputs.has_decision == 'true'
        run: |
          # Hard gate against green-but-never-ran approvals (PR #389 precedent):
          # an approve-eval verdict requires /tmp/live-run-evidence.json with at
          # least one NON-test command against the shipped entrypoint. Missing
          # or test-only evidence fails the gate red; the job failure reaches
          # the Maintainer's workflow_run trigger for a fresh /oc eval.
          action=$(jq -r '.action // empty' /tmp/evaluator-decision.json 2>/dev/null || echo "")
          if [ "$action" != "approve-eval" ]; then
            echo "Gate applies to approve-eval only (action='$action'); rejections pass unblocked."
            exit 0
          fi
          ev=/tmp/live-run-evidence.json
          if [ ! -f "$ev" ]; then
            echo "::error::Evaluator approved without /tmp/live-run-evidence.json. End-user execution proof is mandatory (evaluator.md section 6). Approval blocked."
            exit 1
          fi
          if jq -e '.scope == "unrunnable" and ((.reason // "") | length > 20)' "$ev" >/dev/null 2>&1; then
            echo "Evidence declares scope=unrunnable with a substantive reason; routing onward for Maintainer triage."
            exit 0
          fi
          if jq -e '.scope == "infra" and ((.checks // []) | length > 0)' "$ev" >/dev/null 2>&1; then
            echo "Evidence declares scope=infra with validation checks recorded."
            exit 0
          fi
          good=$(jq '[.commands[]? | select(((.cmd // "") | length) > 0) | select((.cmd | test("^((go (test|vet|build|run|install))|(make (test|build|vet|check|install))|(npm (test|run build))|(yarn (test|build))|(pnpm (test|build))|pytest|python[0-9.]* -m pytest|(cargo (test|build|check))|vitest|jest|dotnet test|mvn (test|compile)|gradle (test|build)|rspec|bundle exec (test|rspec))( |$)")) | not)] | length' "$ev" 2>/dev/null || echo 0)
          if [ "${good:-0}" -lt 1 ]; then
            echo "::error::Live-execution evidence contains only test/compile commands. 'CLI hostile: go build/vet/test green' is NOT end-user execution (the exact PR #389 failure). Approval blocked."
            exit 1
          fi
          echo "Evidence gate passed: $good non-test command(s) recorded against the deliverable."

      - name: Post Quality Council result as bot (never as owner, never with /oc prefix)
        if: always() && steps.actor_gate.outputs.run == 'true' && steps.verify-eval.outputs.has_decision == 'true' && steps.evidence-gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e

          if [ ! -f /tmp/evaluator-decision.json ]; then
            echo "No evaluator decision file found; nothing to post."
            exit 0
          fi

          # Read structured decision.
          action=$(jq -r '.action // "unknown"' /tmp/evaluator-decision.json 2>/dev/null || echo "unknown")
          score=$(jq -r '.score // "N/A"' /tmp/evaluator-decision.json 2>/dev/null || echo "N/A")
          summary=$(jq -r '.summary // .critique // "Evaluation complete. See `.github/agents/evaluator.md` for rubric details."' /tmp/evaluator-decision.json 2>/dev/null || echo "Evaluation complete.")

          # The binding mechanism: post the Quality Council result back to the PR.
          # Bot identity (GITHUB_TOKEN, github-actions[bot]) plus no leading /oc
          # prefix: result comments must neither impersonate the owner nor match
          # any workflow trigger (eval guard above, general exclusion, maintainer
          # bot-ignore). The Maintainer surveys comments fresh; it needs no /oc.
          if [ "$action" = "approve-eval" ]; then
            body="Quality Council APPROVED - Score ${score}/10. ${summary} - The Evaluator confirms the deliverable passes all 5 dimensions (aggregate at least 9.8). Passing to Hephaestus (Maintainer) for final merge. - The Quality Council (Evaluator)"
          elif [ "$action" = "fix" ]; then
            body="Quality Council REJECTION - Score ${score}/10. ${summary} - The Evaluator requires fixes before the deliverable can proceed to the Maintainer. Hephaestus will route the next step once the findings are applied. - The Quality Council (Evaluator)"
          else
            body="Quality Council INCOMPLETE - Action: ${action}. Score: ${score}. ${summary} - The Quality Council (Evaluator)"
          fi

          # Always post back to the PR so the pipeline has an auditable record.
          echo "Posting evaluation result to PR/issue..."
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "$body" || true

      - name: Forward evaluator decision to Maintainer (owner PAT handoff)
        if: always() && steps.actor_gate.outputs.run == 'true' && steps.verify-eval.outputs.has_decision == 'true' && steps.evidence-gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pr="${{ github.event.issue.number }}"
          if [ ! -f /tmp/evaluator-decision.json ]; then
            echo "::error::No evaluator decision file found; verify step above already failed the job closed."
            exit 1
          fi

          action=$(jq -r '.action // "unknown"' /tmp/evaluator-decision.json 2>/dev/null || echo "unknown")

          # Owner directive 2026-09-23 on #375: eval must hand its verdict to
          # Hephaestus via /oc maintainer using the owner PAT, same mechanism
          # as the review/test forward steps. Both approve-eval and fix route
          # to the Maintainer, which decides next (merge on approval, fix or
          # lab dispatch on rejection). The bare trigger keeps the
          # startsWith '/oc maintainer' match in maintainer.yml.
          # Loop safety: /oc maintainer never matches this workflow's /oc eval
          # trigger guard above, so this handoff cannot self-dispatch eval
          # (see 51c719cc for the retired /oc eval result loop).
          if [ "$action" = "approve-eval" ]; then
            echo "Quality Council approved. Posting /oc maintainer to hand over to Maintainer"
            gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc maintainer"
          elif [ "$action" = "fix" ]; then
            echo "Quality Council requested fixes. Posting /oc maintainer for Maintainer triage"
            gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc maintainer"
          else
            echo "Unknown evaluator action '$action'. Posting /oc maintainer for Maintainer triage"
            gh issue comment "$pr" --repo "${{ github.repository }}" --body "/oc maintainer"
          fi

      - name: Push evaluator memory to dedicated branch
        if: always() && steps.actor_gate.outputs.run == 'true' && steps.verify-eval.outputs.has_decision == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          # Push evaluation memory (rubric updates, attack vectors, evaluation logs) to the Evaluator's dedicated branch.
          git checkout -b evaluator/logs 2>/dev/null || git checkout evaluator/logs || true
          mkdir -p lab/memory/evaluator
          # Record the evaluation turn for institutional memory.
          echo "# Evaluator Memory Update - $(date -Iseconds)" >> lab/memory/evaluator/eval-log.md
          echo "- PR: ${{ github.event.issue.number }}" >> lab/memory/evaluator/eval-log.md
          echo "- Score: $(jq -r '.score // \"N/A\"' /tmp/evaluator-decision.json 2>/dev/null || echo \"N/A\")" >> lab/memory/evaluator/eval-log.md
          echo "- Action: $(jq -r '.action // \"unknown\"' /tmp/evaluator-decision.json 2>/dev/null || echo \"unknown\")" >> lab/memory/evaluator/eval-log.md
          git add lab/memory/evaluator/
          git commit -m "evaluator: update memory branch with evaluation turn for PR ${{ github.event.issue.number }}" || true
          git push origin evaluator/logs --force-with-lease || true
