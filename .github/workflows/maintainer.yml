name: maintainer

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR to focus on (optional)"
        required: false
        type: string
      issue_number:
        description: "Issue to focus on (optional)"
        required: false
        type: string
      reason:
        description: "Why this run was triggered (e.g. approve: PR #N)"
        required: false
        type: string
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request:
    types: [opened, closed]
  workflow_run:
    # Failure/crash summon. GitHub REQUIRES a non-empty `workflows:` list
    # here (an omitted list is an invalid workflow file that disables this
    # entire workflow) - there is no workflows-ignore filter. Names must
    # match each workflow's `name:` field exactly, and `maintainer` itself
    # is excluded (self-inclusion would re-trigger on every Maintainer
    # completion: infinite loop).
    # ROT GUARD (no allowlist can stay correct by itself): the Maintainer
    # audits this list against live workflow names on every run (prompt
    # rule) and the Reviewer blocks infra PRs that add/rename a workflow
    # without updating it - so a new workflow can never silently miss
    # failure triage.
    workflows: [auditor, "Deploy static site to GitHub Pages", "Lab Engineer", opencode-review, opencode-pr-trigger, opencode-test, opencode-peros-test, ideate, opencode, opencode-recover, poolduel-m1, poolduel-m2, poolduel-m9, poolduel-m10-soak, postformer-cpu-train, curator, opencode-eval, tor-cli]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: maintainer-${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch || 'global' }}
  cancel-in-progress: false

jobs:
  maintainer:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.name != 'maintainer' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out')) ||
      (github.event_name != 'issue_comment' && github.event_name != 'workflow_run') ||
      (github.event_name == 'issue_comment' && github.event.comment.user.login != 'github-actions[bot]' &&
       !startsWith(github.event.comment.body, '/oc') &&
       !startsWith(github.event.comment.body, '/opencode')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/oc maintainer'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          token: ${{ github.token }}
          # Full history is mandatory: the integrity guard and the PAT merge
          # sweep use merge-base ancestry checks, which fail closed on shallow
          # clones and misread legitimate merges as orphans (issue #283).
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "Hephaestus (Maintainer)"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Actor-permission preflight (issue #427): the opencode CLI asserts that
      # the TRIGGER ACTOR holds admin|write for user events (issue_comment,
      # pull_request_review_comment, issues, pull_request) before its session
      # starts. On failure it posts the raw error as a PR/issue comment and
      # exits 1, while the agent step's `continue-on-error: true` keeps this
      # job green: every bot-authored PR open got a noise comment plus a
      # green-but-no-op run. Preflight the identical check HERE so an
      # unprivileged actor skips the agent cleanly (no comment, visible
      # notice) instead of crashing into one, while the redundant wake paths
      # (opencode-pr-trigger.yml posts /oc maintainer as owner on every
      # non-draft same-repo PR open, the workflow_run failure summon, and the
      # 20-minute schedule) keep coverage.
      - name: Actor permission preflight
        id: actor_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_EVENT: ${{ github.event_name }}
          GATE_ACTOR: ${{ github.actor }}
        run: |
          case "$GATE_EVENT" in
            schedule|workflow_dispatch|workflow_run)
              # No trigger-actor assert on these events: the CLI only asserts
              # on issue_comment/pull_request_review_comment/issues/pull_request,
              # and the agent step below presents workflow_run to the CLI as
              # workflow_dispatch.
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "preflight: '$GATE_EVENT' carries no trigger-actor assert; agent allowed."
              exit 0
              ;;
          esac
          # URL-encode the actor: 'github-actions[bot]' contains brackets.
          enc=$(printf '%s' "$GATE_ACTOR" | jq -sRr @uri)
          perm=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${enc}/permission" --jq '.permission' 2>/dev/null) || perm=""
          case "$perm" in
            admin|write)
              # Mirror of the CLI's own allow-list (["admin","write"]).
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "preflight: actor '$GATE_ACTOR' holds '$perm'; agent allowed."
              ;;
            "")
              # Unresolvable permission (API failure/404): skipping silently
              # would recreate the green-but-no-op class this lab hunts, and
              # running blind would crash into a noise comment for exactly the
              # actors that need gating. Fail red and loud instead.
              echo "::error::Could not resolve the repository permission of actor '$GATE_ACTOR'; refusing to run the Maintainer agent blind (issue #427 preflight)."
              exit 1
              ;;
            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Actor '$GATE_ACTOR' holds '$perm' (not admin|write); skipping the Maintainer agent to avoid the opencode permission-assert crash and its noise comment (issue #427). Redundant wake paths (opencode-pr-trigger, workflow_run summons, the schedule) keep coverage."
              ;;
          esac

      - name: Load Maintainer memory (maintainer/logs)
        run: |
          mkdir -p .maintainer/memory/logs
          git fetch origin maintainer/logs:refs/remotes/origin/logs --quiet || echo "no memory branch yet (first run)"
          for f in STATE.md personality.md REGISTRY.md; do
            if git cat-file -e "refs/remotes/origin/logs:$f" 2>/dev/null; then
              git show "refs/remotes/origin/logs:$f" > ".maintainer/memory/$f"
            fi
          done
          for d in 0 1 2 3 4 5 6; do
            day=$(date -u -d "-$d day" +%Y-%m-%d 2>/dev/null || date -u -v-$d'd' +%Y-%m-%d)
            if git cat-file -e "refs/remotes/origin/logs:logs/$day.md" 2>/dev/null; then
              git show "refs/remotes/origin/logs:logs/$day.md" > ".maintainer/memory/logs/$day.md"
            fi
          done
          ls -la .maintainer/memory .maintainer/memory/logs 2>/dev/null

      - name: Build run notification
        run: |
          {
            echo "WORKFLOW: ${{ github.workflow }}"
            echo "REPO: ${{ github.repository }}"
            echo "RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "--- event payload (jq) ---"
            jq -r '
              "EVENT: \(.action // "" // "unknown")",
              "ISSUE: \(.issue.number // "" // "")",
              "PR_NUMBER: \(.pull_request.number // "" // "")",
              "PR_TITLE: \(.pull_request.title // "" // "")",
              "PR_HEAD: \(.pull_request.head.sha // "" // "")",
              "PR_HEAD_REF: \(.pull_request.head.ref // "" // "")",
              "PR_MERGED: \(.pull_request.merged // false)",
              "PR_AUTHOR: \(.pull_request.user.login // .issue.user.login // "" // "")",
              "PR_BODY: \(.pull_request.body // "" // "")",
              "COMMENT_AUTHOR: \(.comment.user.login // "" // "")",
              "ISSUE_TITLE: \(.issue.title // "" // "")",
              "ISSUE_USER: \(.issue.user.login // "" // "")",
              "WORKFLOW_RUN_NAME: \(.workflow_run.name // "" // "")",
              "WORKFLOW_RUN_CONCLUSION: \(.workflow_run.conclusion // "" // "")",
              "WORKFLOW_RUN_BRANCH: \(.workflow_run.head_branch // "" // "")",
              "WORKFLOW_RUN_SHA: \(.workflow_run.head_sha // "" // "")",
              "WORKFLOW_RUN_ID: \(.workflow_run.id // "" // "")",
              "WORKFLOW_RUN_PR: \(.workflow_run.pull_requests[0].number // "" // "")",
              "INPUTS: \((.inputs // {}) | tostring)"' "$GITHUB_EVENT_PATH"
          } > .maintainer/notification.txt
          echo "--- notification ---"
          cat .maintainer/notification.txt

      - name: Record main SHA before
        id: pre_agent
        run: echo "sha=$(git ls-remote origin main | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Get opencode version
        id: opencode_version
        shell: bash
        # Best-effort cache-key lookup only: it must NEVER veto the run.
        # Belt and suspenders with the in-script `|| true` fallback below
        # (issue #336: two runs died here on unauthenticated rate limits
        # before the agent ever started).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Authenticated (5000 req/hour, per-repo) so shared-runner-IP
          # unauthenticated rate limits (60 req/hour) stop applying.
          # Retry loop with backoff; the `|| true` keeps `pipefail` from
          # aborting on curl non-2xx or grep no-match, so the
          # `${VERSION:-latest}` fallback always engages.
          VERSION=""
          for attempt in 1 2 3; do
            VERSION=$(curl -sf --retry 2 --retry-delay 5 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/anomalyco/opencode/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4 || true)
            if [ -n "$VERSION" ]; then
              break
            fi
            echo "version lookup attempt $attempt failed; retrying..."
            sleep $((attempt * 10))
          done
          echo "version=${VERSION:-latest}" >> $GITHUB_OUTPUT
          echo "resolved opencode version: ${VERSION:-latest}"

      - name: Cache opencode
        id: opencode_cache
        uses: actions/cache@v4
        with:
          path: ~/.opencode/bin
          key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ steps.opencode_version.outputs.version }}

      - name: Install opencode
        if: steps.opencode_cache.outputs.cache-hit != 'true'
        shell: bash
        # Single-shot network fetch: retry transient blips, but a genuine
        # failure still fails loudly (the install is really needed).
        run: curl -fsSL --retry 3 --retry-delay 10 https://opencode.ai/install | bash

      - name: Add opencode to PATH
        shell: bash
        run: echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Run Maintainer agent
        id: maintainer_run
        # Gated by the actor-permission preflight (issue #427): an unprivileged
        # trigger actor skips this step cleanly (annotated notice above), which
        # kills the noise-comment crash while keeping the run's downstream
        # maintenance steps (sweeps, memory, approvals) intact.
        if: steps.actor_gate.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 60
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          MODEL: opencode/muse-spark-1.2-contributor-free
          USE_GITHUB_TOKEN: "true"
          PROMPT: |
            You are the lab Maintainer (Hephaestus) on the Random repo, in a scheduled/dispatched/event run.

            READ FIRST: `.github/agents/maintainer.md` - that file IS your complete system prompt; every rule there is binding and outranks this envelope except the safety net below.

            You also have, on disk:
            - `.maintainer/memory/` - your memory bundle: STATE.md (live checkpoint), personality.md, REGISTRY.md, and logs/*.md (last 7 days). Read it all before deciding.
            - `.maintainer/notification.txt` - why this run started. It is a heads-up, never a limit: re-survey the whole repo fresh with gh (open PRs/issues, comments, progress/*.md) and act on everything that needs you.

            SAFETY NET (always binding): you NEVER post comments with "/oc" (a hardcoded step posts triggers for you); you never create issues or PRs and never push feature code to main or PR branches; you NEVER run git commit, git push, git checkout -b, or any branch command yourself; and you NEVER edit .github/workflows/**, .github/agents/**, opencode.json, AGENTS.md, or LAB.md as part of routine work - ALL infra, workflow, agent, and model changes route through {"action": "lab"} (the Lab Engineer). The ONLY exception is the emergency revival contract: after a dispatched lab run demonstrably failed (or lab.yml itself cannot execute because its own model is dead/rate-limited) AND production is fully halted, you MAY write .maintainer/emergency.json and leave your .github/workflows/*.yml edits UNCOMMITTED in the tree for the hardcoded PAT step to verify, commit, and push. Without a valid declaration file, any protected-path edits you leave behind are reverted automatically and never pushed. Otherwise you only write the output files below; everything you write is later committed to the maintainer/logs branch by hardcoded steps. Never print or reference any PAT or secret.

            OUTPUT CONTRACT - write exactly these files (hardcoded steps act on them):
            1. `.maintainer/decision.json` - a JSON array of {action, pr?, issue?, head?, target?, message?} entries, actions: review | continue | architect | research | build | lab | auditor | curate | fix | ideate | recover | ping | test | eval. One entry max per PR/issue. Empty array [] is fine - do not invent work.
            2. `.maintainer/comment.md` - your public bot comment for this run's target PR/issue (or leave empty). It must end with the sign-off ` -  Hephaestus, the Maintainer` (a hardcoded step appends it if missing).
            3. `.maintainer/log-entry.md` - the FULL content of today's logs/YYYY-MM-DD.md (preserve what you found in memory, append today's entry: state snapshot, decisions + rationale, callbacks, run link, open questions). MANDATORY - write it in EVERY run, even a quiet day: this file is how maintainer instances talk to each other across runs.
            4. `.maintainer/state.md` - the FULL new STATE.md content (current pipeline status per PR/issue, next steps, open questions).
            5. `.maintainer/personality.md` - updated identity ONLY if it genuinely evolved today; otherwise leave empty.
            6. `.maintainer/emergency.json` - ONLY under the emergency revival contract above (a failed/broken lab attempt you can link + production halted): exactly {"reason": "...", "lab_run": "<failing lab run URL>", "production_stopped": true}. Omit the file entirely in every other run - its presence unlocks a direct push to main.

            When you finish, print a one-line summary of what you decided (the decision list is the deliverable).
        run: |
          # opencode CLI does not natively recognize workflow_run events (it only supports
          # issue_comment, pull_request_review_comment, issues, pull_request, schedule, workflow_dispatch).
          # For workflow_run triggers, present the event as workflow_dispatch so opencode handles
          # repo-level autonomous triage while the notification file (.maintainer/notification.txt)
          # conveys the failing workflow run details.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            export GITHUB_EVENT_NAME="workflow_dispatch"
          fi
          opencode github run

      - name: Remove maintainer stray PRs and branches (the Maintainer never opens PRs)
        if: always()
        run: |
          gh pr list --author app/github-actions --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("opencode/schedule-") or startswith("opencode/dispatch-") or startswith("opencode/issue")) | .number' \
            | while read num; do
                gh pr close "$num" --delete-branch --comment "auto-closed by hardcoded cleanup: the Maintainer never opens PRs - its state lives on the maintainer/logs branch." || true
              done
          gh api --paginate repos/${{ github.repository }}/branches --jq '.[].name' 2>/dev/null \
            | grep -E '^opencode/(schedule-|dispatch-|issue)' \
            | while read br; do
                enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$br")
                gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$enc" || true
              done
          echo "stray cleanup complete"

      - name: Emergency-gated commit and push of workflow model updates to main
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          GIT_AUTHOR_NAME: "Hephaestus (Maintainer)"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "Hephaestus (Maintainer)"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          dirty=$(git status --porcelain -- .github/workflows .github/agents opencode.json AGENTS.md LAB.md 2>/dev/null || true)
          if [ -z "$dirty" ]; then
            echo "No protected-path modifications left by the Maintainer; nothing to do."
            exit 0
          fi

          # Gate: a direct push to main requires a complete emergency declaration:
          # {"reason": "...", "lab_run": "<failing lab run URL>", "production_stopped": true}
          ok=0
          if [ -f .maintainer/emergency.json ]; then
            echo "Emergency declaration found:"; cat .maintainer/emergency.json
            decl=$(python3 - <<'PY'
          import json
          try:
              d = json.load(open('.maintainer/emergency.json'))
              valid = (
                  isinstance(d, dict)
                  and bool(str(d.get('reason', '')).strip())
                  and bool(str(d.get('lab_run', '')).strip())
                  and d.get('production_stopped') is True
              )
              print('valid' if valid else 'invalid')
          except Exception:
              print('invalid')
          PY
            )
            if [ "$decl" = "valid" ]; then
              ok=1
              echo "Emergency declaration complete; revival contract unlocked."
            else
              echo "::warning::.maintainer/emergency.json exists but is incomplete/unparseable; treating as absent."
            fi
          fi

          if [ "$ok" != "1" ]; then
            echo "::warning::Protected-path modifications found WITHOUT a valid emergency declaration. Reverting them; infra/model/workflow changes must be routed to the Lab Engineer ({\"action\": \"lab\"})."
            for p in .github/workflows .github/agents opencode.json AGENTS.md LAB.md; do
              git checkout -- "$p" 2>/dev/null || true
            done
            git clean -fd -- .github/workflows .github/agents opencode.json AGENTS.md LAB.md >/dev/null 2>&1 || true
            echo "EMERGENCY_GATE=reverted" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Emergency contract satisfied. Staging and committing strictly as Hephaestus (Maintainer)..."
          # Remove actions/checkout credential injection so the PAT URL actually authenticates:
          # checkout v6 stores the App-token extraheader in $RUNNER_TEMP/git-credentials-*.config,
          # referenced via includeIf.gitdir:* entries; a plain unset of http.extraheader cannot remove it.
          git config --local --unset-all 'http.https://github.com/.extraheader' 2>/dev/null || true
          for cfg in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:.*\.path$' 2>/dev/null); do
            git config --local --unset-all "$cfg" 2>/dev/null || true
          done
          git add .github/workflows/*.yml
          [ -f opencode.json ] && git add opencode.json || true
          git commit --author="Hephaestus (Maintainer) <github-actions[bot]@users.noreply.github.com>" -m "maintainer: emergency revival - update workflow model configuration (see .maintainer/emergency.json declaration in run log)"
          git fetch origin main --quiet
          # Orphan guard: never push a history that would rewrite main as a divergent/orphan root.
          # main must stay a strict descendant of origin/main (fast-forwardable). Rebase first if needed;
          # if the rebase cannot make HEAD a descendant of origin/main, ABORT instead of orphaning main.
          if ! git merge-base --is-ancestor origin/main HEAD 2>/dev/null; then
            echo "Local main is NOT a descendant of origin/main; rebasing to preserve full main history..."
            git rebase origin/main --quiet || {
              echo "::error::Rebase onto origin/main failed; aborting main push to avoid orphaning main."
              exit 1
            }
          fi
          git push "https://x-access-token:${{ secrets.OPENCODE_PAT }}@github.com/${{ github.repository }}.git" HEAD:main || {
            echo "Push failed, attempting rebase..."
            git fetch origin main --quiet
            git rebase origin/main --quiet
            git push "https://x-access-token:${{ secrets.OPENCODE_PAT }}@github.com/${{ github.repository }}.git" HEAD:main
          }
          echo "EMERGENCY_GATE=pushed" >> "$GITHUB_ENV"
          echo "Emergency revival pushed to main as Hephaestus (Maintainer)."

      - name: Commit Maintainer memory (maintainer/logs)
        if: always()
        env:
          AGENT_GATE: ${{ steps.actor_gate.outputs.run }}
        run: |
          git fetch origin maintainer/logs:refs/remotes/origin/logs --quiet || true
          if git rev-parse --verify refs/remotes/origin/logs >/dev/null 2>&1; then
            git checkout --force --detach refs/remotes/origin/logs --quiet
          else
            git checkout --orphan logs-bootstrap --quiet
            git rm -rf . --quiet 2>/dev/null || true
          fi
          mkdir -p logs
          if [ -s .maintainer/state.md ]; then cp .maintainer/state.md STATE.md; fi
          if [ -s .maintainer/personality.md ]; then cp .maintainer/personality.md personality.md; fi
          today="$(date -u +%Y-%m-%d)"
          if [ -s ".maintainer/log-entry.md" ]; then
            cp ".maintainer/log-entry.md" "logs/$today.md"
          elif [ ! -f "logs/$today.md" ]; then
            if [ "$AGENT_GATE" = "false" ]; then
              # Deliberate preflight skip (issue #427): the agent never started,
              # so record the truth instead of the "Agent Output Missing"
              # crash stub - a skip must not read as a mid-run crash downstream.
              printf '# %s - auto entry (agent skipped by actor-permission preflight)\n\nRun: https://github.com/%s/actions/runs/%s (%s)\n> Note: the trigger actor did not hold admin/write, so the issue #427 preflight skipped the Maintainer agent cleanly (no decision file, no noise comment). Redundant wake paths (opencode-pr-trigger, workflow_run summons, the schedule) cover this trigger.\n' \
                "$today" "${{ github.repository }}" "${{ github.run_id }}" "${{ github.event_name }}" > "logs/$today.md"
            else
              printf '# %s - auto entry (agent produced no log)\n\nRun: https://github.com/%s/actions/runs/%s (%s)\n> [!WARNING]\n> Agent Output Missing\n\nNote: the agent finished without writing a log entry; this stub keeps instances in sync. See the run logs for details.\n' \
                "$today" "${{ github.repository }}" "${{ github.run_id }}" "${{ github.event_name }}" > "logs/$today.md"
            fi
          fi
          echo "<!-- run: ${{ github.run_id }} -->" >> "logs/$today.md"
          if git cat-file -e "origin/main:.github/agents/REGISTRY.md" 2>/dev/null; then
            git show "origin/main:.github/agents/REGISTRY.md" > REGISTRY.md
          elif [ -f .github/agents/REGISTRY.md ]; then
            cp .github/agents/REGISTRY.md REGISTRY.md
          fi
          # Stage ONLY the memory files - never the whole repo - then commit and push.
          git add -- STATE.md personality.md REGISTRY.md logs 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git -c user.name="Hephaestus (Maintainer)" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "maintainer: memory update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin "HEAD:maintainer/logs" --quiet || {
              git fetch origin maintainer/logs:refs/remotes/origin/logs --quiet
              git rebase refs/remotes/origin/logs --quiet && git push origin "HEAD:maintainer/logs" --quiet
            }
            echo "memory pushed to maintainer/logs"
          else
            echo "no memory changes"
          fi
          # Restore workspace to origin/main so subsequent steps have access to repo scripts
          git checkout --force origin/main --quiet || git checkout --force main --quiet || true

      - name: Post Maintainer comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OC_TARGET: ${{ github.event.pull_request.number || github.event.issue.number || inputs.issue_number || inputs.pr_number || '' }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          target = os.environ.get("OC_TARGET", "")

          decisions = []
          if os.path.exists(".maintainer/decision.json"):
              try:
                  decisions = json.load(open(".maintainer/decision.json"))
              except Exception as e:
                  print(f"decision.json unparseable: {e}")
          if isinstance(decisions, dict):
              decisions = [decisions]
          elif not isinstance(decisions, list):
              decisions = []

          posts = []
          for d in decisions:
              if not isinstance(d, dict):
                  continue
              if d.get("action") == "ping" and d.get("target"):
                  posts.append((d["target"], d.get("message", ""), False))

          if os.path.isfile(".maintainer/comment.md") and os.path.getsize(".maintainer/comment.md") > 0 and target:
              posts.append((target, open(".maintainer/comment.md").read(), True))

          # Emergency-gate transparency: keep Hephaestus's public comments consistent with
          # what the hardcoded steps actually did with any protected-path edits.
          gate_notice = ""
          gate = os.environ.get("EMERGENCY_GATE", "")
          if gate == "reverted":
              gate_notice = (
                  "[lab-gate] This run left workflow/config edits WITHOUT the required emergency declaration "
                  "(.maintainer/emergency.json), so a hardcoded step reverted them before anything was pushed. "
                  "Infra/model/workflow changes must route to the Lab Engineer ({\"action\": \"lab\"}).\n\n"
              )
          elif gate == "pushed":
              gate_notice = (
                  "[emergency-revival] This run's workflow changes landed on main under the emergency revival "
                  "contract (a failed/broken Lab Engineer attempt plus halted production, declared in "
                  ".maintainer/emergency.json).\n\n"
              )

          sign = "- Hephaestus, the Maintainer"
          for t, body, is_main_comment in posts:
              body = body.strip()
              if not body:
                  continue
              if is_main_comment and gate_notice:
                  body = gate_notice + body
              if sign not in body:
                  body = body + "\n\n" + sign
              subprocess.run(
                  ["gh", "api", f"repos/{repo}/issues/{t}/comments", "-f", f"body={body}"],
                  check=False,
              )
              print(f"posted comment on #{t}")
          PY
      - name: Run /oc triggers as owner
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
          BOT_TOKEN: ${{ github.token }}
          AGENT_GATE: ${{ steps.actor_gate.outputs.run }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time

          repo = os.environ["GITHUB_REPOSITORY"]
          owner = os.environ["GITHUB_REPOSITORY_OWNER"]
          
          # Strip GITHUB_TOKEN from env so gh CLI authenticates exclusively via GH_TOKEN (OPENCODE_PAT as owner)
          os.environ.pop("GITHUB_TOKEN", None)

          bot_env = os.environ.copy()
          bot_env["GH_TOKEN"] = os.environ.get("BOT_TOKEN", "")
          bot_env.pop("GITHUB_TOKEN", None)

          def api(*args, check=True):
              r = subprocess.run(["gh", "api", *args], capture_output=True, text=True, check=check)
              return r.stdout.strip(), r

          def pr_info(n):
              out, _ = api(f"repos/{repo}/pulls/{n}", check=False)
              try:
                  return json.loads(out)
              except Exception:
                  return {}

          decisions = []
          if os.path.exists(".maintainer/decision.json"):
              try:
                  decisions = json.load(open(".maintainer/decision.json"))
              except Exception as e:
                  print(f"decision.json unparseable: {e}")
          if isinstance(decisions, dict):
              decisions = [decisions]
          elif not isinstance(decisions, list):
              decisions = []

          if not decisions:
            if os.environ.get("AGENT_GATE") == "false":
                # Deliberate preflight skip (issue #427): an empty decision
                # list is the expected outcome, not a crash - keep the log
                # honest instead of pointing triage at a failure that is not there.
                print("Maintainer agent was skipped by the actor-permission preflight (issue #427): "
                      "the trigger actor does not hold admin/write, so no decision.json is expected "
                      "and no /oc triggers were posted.")
            else:
                print("::warning::Maintainer produced no decisions (missing or empty decision.json). "
                      "Check the 'Run Maintainer agent' step log: a step timeout, a model/billing error, "
                      "or an earlier setup step failure (Get opencode version, Cache opencode, Install opencode) "
                      "may have stopped the agent before it wrote its output files. No /oc triggers were posted.")

          posted = set()
          sweep_failed = False
          for d in decisions:
              if not isinstance(d, dict):
                  continue
              action = d.get("action")
              pr = d.get("pr")
              target = d.get("target") or pr or d.get("issue")
              if action in ("create_issue", "create_pr"):
                  title = d.get("title", "New Item")
                  body_text = d.get("body", "")
                  if action == "create_issue":
                      r = subprocess.run(["gh", "issue", "create", "--repo", repo, "--title", title, "--body", body_text], capture_output=True, text=True, check=False, env=bot_env)
                      if r.returncode == 0:
                          print(f"Created new issue: {title}")
                      else:
                          print(f"::error::Failed to create issue '{title}': {r.stderr.strip()}")
                  else:
                      head = d.get("head", "")
                      if head:
                          r = subprocess.run(["gh", "pr", "create", "--repo", repo, "--head", head, "--base", "main", "--title", title, "--body", body_text], capture_output=True, text=True, check=False, env=bot_env)
                          if r.returncode == 0:
                              print(f"Created new PR for branch: {head}")
                          else:
                              print(f"::error::Failed to create PR for '{head}': {r.stderr.strip()}")
                  continue

              # SWEEP DISPATCH (PAT-backed): run a sweep/train workflow whose
              # completion must summon triage. Runs dispatched with the bot
              # token do NOT emit workflow_run triggers (platform
              # anti-recursion), so their failures complete silently - sweeps
              # must go out with the owner credential. Handled here (never
              # via an agent-run gh call, never via /oc comment) because no
              # agent env may hold the PAT.
              SWEEP_ALLOWLIST = ("poolduel-m1", "poolduel-m2", "poolduel-m9", "poolduel-m10-soak", "postformer-cpu-train", "tor-cli")
              if action == "sweep":
                  wf = d.get("workflow", "")
                  ref = d.get("ref", "") or "main"
                  inputs = d.get("inputs", "") or {}
                  skey = ("sweep", wf, ref, json.dumps(inputs, sort_keys=True) if isinstance(inputs, dict) else str(inputs))
                  if skey in posted:
                      print(f"skip sweep '{wf}' (duplicate in this run)")
                      continue
                  if wf not in SWEEP_ALLOWLIST:
                      print(f"::error::Refusing sweep dispatch for '{wf}': not in allowlist {list(SWEEP_ALLOWLIST)} (route new sweep workflows via lab first)")
                      sweep_failed = True
                      continue
                  if not isinstance(inputs, dict):
                      print(f"::error::sweep 'inputs' must be an object for '{wf}'")
                      sweep_failed = True
                      continue
                  cmd = ["gh", "workflow", "run", wf, "--repo", repo, "--ref", ref]
                  for k, v in inputs.items():
                      cmd += ["-f", f"{k}={v}"]
                  r = subprocess.run(cmd, capture_output=True, text=True, check=False)
                  if r.returncode != 0:
                      print(f"::error::Failed to dispatch sweep '{wf}': {r.stderr.strip()}")
                      sweep_failed = True
                      continue
                  print(f"dispatched sweep '{wf}' on ref '{ref}'" + (f" inputs {inputs}" if inputs else " (defaults)"))
                  # Run-existence verification (issue #399): a dispatch that
                  # emits no run must fail loudly instead of silently
                  # blocking closure. Resolve the ref to its head SHA, then
                  # poll for a matching workflow_dispatch run.
                  expected_sha = ""
                  rr = subprocess.run(["gh", "api", f"repos/{repo}/git/ref/heads/{ref}", "--jq", ".object.sha"], capture_output=True, text=True, check=False)
                  if rr.returncode == 0 and rr.stdout.strip():
                      expected_sha = rr.stdout.strip().lower()
                  elif len(ref) >= 4 and all(c in "0123456789abcdef" for c in ref.lower()):
                      expected_sha = ref.lower()
                  def _sweep_match(run):
                      if run.get("event") != "workflow_dispatch":
                          return False
                      if expected_sha:
                          return run.get("headSha", "").lower().startswith(expected_sha[:12])
                      return run.get("headBranch", "") == ref
                  found = False
                  for attempt in range(6):
                      time.sleep(30)
                      lr = subprocess.run(["gh", "run", "list", "--repo", repo, "--workflow", wf, "--event", "workflow_dispatch", "--limit", "10", "--json", "databaseId,headSha,headBranch,event,createdAt"], capture_output=True, text=True, check=False)
                      try:
                          runs = json.loads(lr.stdout) if lr.returncode == 0 else []
                      except Exception:
                          runs = []
                      for run in runs:
                          if _sweep_match(run):
                              print(f"verified sweep '{wf}' run {run.get('databaseId')} on {(run.get('headSha') or '')[:12]} (attempt {attempt + 1})")
                              found = True
                              break
                      if found:
                          break
                      print(f"sweep '{wf}' run not yet visible (attempt {attempt + 1}/6)")
                  if found:
                      posted.add(skey)
                  else:
                      print(f"::error::Sweep '{wf}' dispatched on ref '{ref}' but no workflow_dispatch run on {(expected_sha[:12] if expected_sha else ref)} appeared within 3m (dispatch misfire or allowlist drift)")
                      sweep_failed = True
                  continue

              if not target:
                  continue
              try:
                  target = int(target)
              except (ValueError, TypeError):
                  print(f"::warning::Skipping malformed target '{target}' for action '{action}'")
                  continue
              key = (action, target)
              if key in posted:
                  print(f"skip {action} #{target} (one trigger per PR per run)")
                  continue

              body = None
              if action == "review":
                  head = d.get("head", "")
                  body = f"/oc review (head {head})"
              elif action == "test":
                  body = "/oc test"
              elif action == "test-linux":
                  body = "/oc test-linux"
              elif action == "test-macos":
                  body = "/oc test-macos"
              elif action == "test-windows":
                  body = "/oc test-windows"
              elif action == "eval":
                  body = "/oc eval"
              elif action == "continue":
                  body = "/oc continue"
              elif action == "build":
                  body = "/oc build this"
              elif action == "auditor":
                  body = "/oc auditor"
              elif action == "curate":
                  body = "/oc curate"
              elif action == "architect":
                  body = "/oc architect"
              elif action == "research":
                  body = "/oc research"
              elif action == "lab":
                  extra = d.get("instruction") or d.get("mode") or ""
                  if extra:
                      body = f"/oc lab {extra}"
                  else:
                      body = "/oc lab"
              elif action == "recover":
                  # Maintainer's ONLY self-initiated branch/PR action: recover
                  # in-flight work from a closed/orphaned build PR. Never opens
                  # a new project; only continues existing work (recover.sh and
                  # recover.yml enforce this). This is the governance exception
                  # granted by issue #112.
                  body = "/oc recover"
              elif action == "fix":
                  info = pr_info(target)
                  author = info.get("user", {}).get("login", "")
                  head_repo = (info.get("head", {}) or {}).get("repo", {}) or {}
                  same_repo = head_repo.get("full_name", "") == repo
                  if author not in ("github-actions[bot]", "app/github-actions") or not same_repo:
                      print(f"skip fix #{target} (not a same-repo bot PR: author={author} repo={head_repo.get('full_name')})")
                      continue
                  body = "/oc fix"

              if body:
                  r = subprocess.run(
                      ["gh", "api", f"repos/{repo}/issues/{target}/comments", "-f", f"body={body}"],
                      capture_output=True,
                      text=True,
                      check=False,
                  )
                  if r.returncode == 0:
                      posted.add(key)
                      print(f"posted '{body}' on #{target}")
                  else:
                      print(f"::error::Failed to post '{body}' on #{target}: {r.stderr.strip()}")

          if sweep_failed:
              print("::error::Sweep dispatch or run-existence verification failed (see errors above); failing loudly so the missing-run gap pages triage instead of silently blocking closure")
              raise SystemExit(1)
          PY

      - name: PAT-backed merge for approved workflow-touching PRs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          set -euo pipefail
          # Remove actions/checkout credential injection so PAT operations authenticate correctly
          # (checkout v6 stores App-token extraheader in RUNNER_TEMP; plain unset insufficient)
          git config --local --unset-all 'http.https://github.com/.extraheader' 2>/dev/null || true
          for cfg in $(git config --local --name-only --get-regexp '^includeIf\.gitdir:.*\.path$' 2>/dev/null); do
            git config --local --unset-all "$cfg" 2>/dev/null || true
          done
          git fetch origin main --quiet 2>/dev/null || true
          prs=$(gh pr list --repo "${{ github.repository }}" --state open --json number --jq '.[].number' 2>/dev/null || true)
          if [ -z "$prs" ]; then
            echo "No open PRs to consider for PAT merge"
            exit 0
          fi
          for pr in $prs; do
            echo "--- Evaluating PR #$pr for PAT-backed workflow merge ---"
            head_ref=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName' 2>/dev/null || continue)
            [ -z "$head_ref" ] && continue
            git fetch origin "$head_ref" --quiet 2>/dev/null || continue
            if ! git diff --name-only "origin/main...origin/$head_ref" 2>/dev/null | grep -qE '^\.github/workflows/'; then
              echo "PR #$pr does not touch workflows; skipping PAT merge"
              continue
            fi
            echo "PR #$pr touches workflows; checking approval and mergeability"
            head_sha=$(gh pr view "$pr" --repo "${{ github.repository }}" --json headRefOid --jq '.headRefOid' 2>/dev/null || echo "")
            # Orphan guard: PR branch must share history with main
            if [ -n "$head_sha" ]; then
              git fetch origin "$head_sha" --quiet 2>/dev/null || true
              if [ -z "$(git merge-base origin/main "$head_sha" 2>/dev/null)" ]; then
                echo "PR #$pr has no common ancestor with main (orphan); skipping direct merge, requires re-link"
                continue
              fi
            else
              if [ -z "$(git merge-base origin/main "origin/$head_ref" 2>/dev/null)" ]; then
                echo "PR #$pr has no common ancestor with main (orphan); skipping direct merge"
                continue
              fi
            fi
            comments=$(gh api --paginate "repos/${{ github.repository }}/issues/$pr/comments" --jq '.' 2>/dev/null || echo "[]")
            approve_test_time=$(echo "$comments" | jq -r '[.[] | select(.user.login=="github-actions[bot]" and (.body|contains("/oc approve-test")))] | last | .created_at // empty' 2>/dev/null || echo "")
            if [ -z "$approve_test_time" ]; then
              echo "PR #$pr has no /oc approve-test; not merge-ready"
              continue
            fi
            last_fix_time=$(echo "$comments" | jq -r '[.[] | select(.body | startswith("/oc fix"))] | last | .created_at // empty' 2>/dev/null || echo "")
            if [ -n "$last_fix_time" ] && [ "$last_fix_time" \> "$approve_test_time" ]; then
              echo "PR #$pr has /oc fix after approve-test ($last_fix_time > $approve_test_time); not merge-ready"
              continue
            fi
            mergeable=$(gh pr view "$pr" --repo "${{ github.repository }}" --json mergeable --jq '.mergeable' 2>/dev/null || echo "")
            echo "PR #$pr mergeable=$mergeable approve-test=$approve_test_time"
            if [ "$mergeable" != "MERGEABLE" ]; then
              echo "PR #$pr not MERGEABLE ($mergeable); skipping"
              continue
            fi
            echo "Attempting PAT-backed merge for PR #$pr (workflow-touching, approved)"
            if gh pr merge "$pr" --repo "${{ github.repository }}" --rebase 2>&1 || \
               gh pr merge "$pr" --repo "${{ github.repository }}" --merge 2>&1; then
              echo "Successfully merged PR #$pr via PAT"
              git fetch origin main --quiet 2>/dev/null || true
            else
              echo "::warning::PAT merge failed for PR #$pr (may need owner click or further checks)"
            fi
          done
          echo "PAT merge sweep complete"

      - name: Trigger pages deployment if main advanced
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          new_sha=$(git ls-remote origin main | awk '{print $1}')
          if [ "${{ steps.pre_agent.outputs.sha }}" != "$new_sha" ] && [ -n "$new_sha" ]; then
            echo "Main branch advanced from ${{ steps.pre_agent.outputs.sha }} to $new_sha. Triggering pages.yml."
            gh workflow run pages.yml --repo "${{ github.repository }}" || true
          else
            echo "Main branch did not advance."
          fi

      - name: Main integrity guard (prevent orphan or divergent main rewrite)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          pre="${{ steps.pre_agent.outputs.sha }}"
          if [ -z "$pre" ]; then
            echo "No pre-agent main SHA recorded; skipping integrity guard."
            exit 0
          fi
          # Read the live remote main SHA with ls-remote (does NOT update the local
          # origin/main tracking ref), so the force-with-lease below pins to exactly the
          # main we observed. A concurrent push by another workflow (e.g. lab.yml) after
          # this point makes the lease mismatch and the restore is rejected instead of
          # clobbering unrelated, legitimate main advances (see reviewer advisory on #92).
          cur=$(git ls-remote origin main | awk '{print $1}')
          if [ -z "$cur" ]; then
            echo "Could not read current main SHA; skipping integrity guard."
            exit 0
          fi
          # Ancestry checks require full history. A shallow clone cannot prove
          # divergence: merge-base fails closed and a legitimate rebase merge
          # reads as an orphan, so the guard below would rewind a good main
          # (issue #283: merge 46b9d9 was reverted, stranding the build).
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            git fetch origin main --unshallow --quiet 2>/dev/null \
              || git fetch origin main --quiet 2>/dev/null || true
          else
            git fetch origin main --quiet 2>/dev/null || true
          fi
          git fetch origin "$pre" --quiet 2>/dev/null || true
          git fetch origin "$cur" --quiet 2>/dev/null || true
          # Fail-open: if either SHA cannot be resolved locally, ancestry is
          # unprovable, so skip the guard instead of restoring main.
          if ! git cat-file -e "$pre" 2>/dev/null || ! git cat-file -e "$cur" 2>/dev/null; then
            echo "Cannot resolve both main SHAs locally (pre=$pre, now=$cur); skipping integrity guard without restore."
            exit 0
          fi
          # main must remain a strict descendant of the pre-run main. A rebase merge of a
          # correctly linked PR keeps main descending from pre. Only a divergent/orphan rewrite
          # (the recurring lab defect) fails this check, and we auto-restore to the pre-run SHA.
          if git merge-base --is-ancestor "$pre" "$cur" 2>/dev/null; then
            echo "Main integrity OK: $cur descends from pre-run main $pre."
            exit 0
          fi
          echo "::error::main was rewritten or orphaned by this run (pre=$pre, now=$cur). Auto-restoring main to pre-run state."
          if git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$pre:main" --force-with-lease="main:$cur" 2>/dev/null; then
            echo "Restored main to $pre."
          else
            echo "::error::Auto-restore of main failed; manual intervention required (pre=$pre)."
          fi
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "ALERT: a merge in this Maintainer run would have orphaned or diverged \`main\` (pre=$pre, now=$cur). The lab integrity guard auto-restored \`main\` to $pre. Investigate the merge path before any further main push." \
            || true

      - name: Dispatch ideator when asked
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          if not os.path.exists(".maintainer/decision.json"):
              raise SystemExit(0)
          try:
              decisions = json.load(open(".maintainer/decision.json"))
          except Exception:
              raise SystemExit(0)
          if isinstance(decisions, dict):
              decisions = [decisions]
          elif not isinstance(decisions, list):
              decisions = []
          if any(isinstance(d, dict) and d.get("action") == "ideate" for d in decisions):
              r = subprocess.run(
                  ["gh", "workflow", "run", "ideate.yml", "--repo", os.environ["GITHUB_REPOSITORY"]],
                  capture_output=True, text=True,
              )
              print("ideator dispatched" if r.returncode == 0 else f"ideator dispatch failed: {r.stderr[:200]}")
          PY

      - name: Approve held CI runs (PR or repo-wide sweep)
        continue-on-error: true
        if: always()
        env:
          GH_TOKEN: ${{ secrets.OPENCODE_PAT }}
        run: |
          set +e
          # Ensure repository scripts exist even if working tree was on maintainer/logs
          if [ ! -f ".github/scripts/approve-held-runs.sh" ]; then
            git checkout --force origin/main --quiet 2>/dev/null || true
          fi
          pr="${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || '' }}"
          # Shared self-healing logic (issue #137): head-scoped polling when a
          # PR context resolves, then ALWAYS a terminal repo-wide sweep that
          # also clears runs held on intermediate head SHAs, which head-scoped
          # polling can never match again.
          APPROVE_PR="$pr" APPROVE_NOTIFY_ISSUE="$pr" APPROVE_SERVER="${{ github.server_url }}" APPROVE_BOT_TOKEN="${{ github.token }}" \
            bash .github/scripts/approve-held-runs.sh