name: poolduel-m9

# Poolduel M9 powered resweep (issue #302): 103 chunk jobs across six
# blocks (R scale-10 M1, W scale-10 M2, U Supavisor twins, C scale-100,
# K warmup curve, E equalized churn), each with per-chunk direct control
# where a comparison is drawn, each under 60 min measured. Runs ONLY on
# manual dispatch (no push trigger): the Maintainer launches the sweep
# once the harness PR is Tester-green.
#
# PROMOTED by the Lab Engineer from poolduel/ci/poolduel-m9.yml (PR #328
# staged it; Builder token cannot push workflow scope). Incumbent builds
# below are verbatim copies of the poolduel-m1.yml "Build poolers (pinned
# versions)" block (same pins per poolduel/docs/versions.md); Supavisor
# builds as a Mix prod release at the pinned tag with SHA recorded.
# Chunk list generated from the harness, never hand-typed:
#   PYTHONPATH=. python3 -c "from poolduel.harness.m9 import M9_CHUNKS; ..."
# Budgets verified by poolduel/harness/check.py (check_m9_*).
#
# Refs #302 (never Closes: only the final M12 gate may close #302).

on:
  workflow_dispatch:
    inputs:
      chunk:
        description: "Chunk to run (empty = all 103)"
        required: false
        default: ""
      ref:
        description: "Git ref to benchmark (default main)"
        required: false
        default: "main"

permissions:
  contents: read
  actions: read

concurrency:
  group: poolduel-m9-${{ inputs.chunk || 'all' }}
  cancel-in-progress: false

env:
  PYTHONPATH: "."

jobs:
  sweep:
    name: M9 sweep chunk
    runs-on: ubuntu-24.04
    # Measurement per chunk stays under 60 min per poolduel/docs/test-matrix.md
    # section 5 and poolduel/docs/m9-matrix.md; the extra cap covers one-time
    # pinned source builds below (pgcat compiles from source, Supavisor is a
    # Mix release build, no release assets exist for either).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chunk: [m9c01, m9c02, m9c03, m9c04, m9c05, m9c06, m9c07, m9c08, m9c09, m9c10, m9c11, m9c12, m9c13, m9c14, m9c15, m9c16, m9c17, m9c18, m9c19, m9c20, m9c21, m9c22, m9c23, m9c24, m9c25, m9e01, m9e02, m9e03, m9k01, m9r01, m9r02, m9r03, m9r04, m9r05, m9r06, m9r07, m9r08, m9r09, m9r10, m9r11, m9r12, m9r13, m9r14, m9r15, m9r16, m9r17, m9r18, m9r19, m9r20, m9r21, m9r22, m9r23, m9r24, m9r25, m9u01, m9u02, m9u03, m9u04, m9u05, m9u06, m9u07, m9u08, m9u09, m9u10, m9u11, m9u12, m9u13, m9u14, m9u15, m9u16, m9u17, m9u18, m9u19, m9u20, m9u21, m9u22, m9u23, m9w01, m9w02, m9w03, m9w04, m9w05, m9w06, m9w07, m9w08, m9w09, m9w10, m9w11, m9w12, m9w13, m9w14, m9w15, m9w16, m9w17, m9w18, m9w19, m9w20, m9w21, m9w22, m9w23, m9w24, m9w25, m9w26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL 17
        run: |
          set -eux
          # ubuntu-24.04 (noble) stock apt has no postgresql-17; PG 17 is
          # pinned per poolduel/docs/versions.md so add the PGDG repo first.
          # Ref: https://www.postgresql.org/download/linux/ubuntu/
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | \
            sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17
          sudo pg_ctlcluster 16 main stop || true
          sudo pg_dropcluster 16 main --stop || true
          if sudo pg_lsclusters | grep -qE '^17[[:space:]]'; then
            sudo pg_ctlcluster 17 main start || true
          else
            sudo pg_createcluster 17 main -p 5432 --start
          fi
          if ! sudo pg_lsclusters | grep -qE '^17[[:space:]]+main[[:space:]]+5432[[:space:]]'; then
            echo "poolduel: PG 17 is not on port 5432" >&2
            sudo pg_lsclusters || true
            exit 1
          fi
          sudo ln -sf /usr/lib/postgresql/17/bin/pgbench /usr/local/bin/pgbench
          sudo ln -sf /usr/lib/postgresql/17/bin/psql /usr/local/bin/psql
          pgbench --version
          sudo pg_lsclusters || true

      - name: Build poolers (pinned versions)
        run: |
          set -eux
          # Pinned per poolduel/docs/versions.md; any upgrade means a re-run,
          # never carried-forward numbers. Verbatim copy of the poolduel-m1.yml
          # "Build poolers (pinned versions)" block (same five incumbents).
          # Refs:
          # https://www.pgbouncer.org/downloads/
          # https://www.pgpool.net/docs/pgpool-II-4.7.2/en/html/install-getsource.html
          # https://github.com/yandex/odyssey/releases/tag/v1.5.1
          # https://github.com/pgagroal/pgagroal
          # https://github.com/postgresml/pgcat/releases/tag/v1.2.0
          # pgagroal CMakeLists.txt lists FATAL deps: zlib, bzip2, zstd, lz4,
          # OpenSSL 3+, rst2man, liburing 2.5+ on Linux, libatomic.
          # Ref: https://github.com/pgagroal/pgagroal/blob/master/CMakeLists.txt
          sudo apt-get install -y -qq libevent-dev libssl-dev \
            libpq-dev pkg-config build-essential git curl cmake \
            flex bison libev-dev pandoc libbz2-dev zlib1g-dev \
            libzstd-dev liblz4-dev liburing-dev python3-docutils jq openssl
          mkdir -p /tmp/poolers
          cd /tmp/poolers
          # --- PgBouncer 1.25.2 (2026-05-08) ---
          curl -fsSL -o pgbouncer-1.25.2.tar.gz \
            https://www.pgbouncer.org/downloads/files/1.25.2/pgbouncer-1.25.2.tar.gz
          sha256sum pgbouncer-1.25.2.tar.gz | tee pgbouncer-1.25.2.sha256
          tar xzf pgbouncer-1.25.2.tar.gz
          cd pgbouncer-1.25.2
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          cd /tmp/poolers
          # --- pgpool-II 4.7.2 (head of 4.7 series, 2026-06-04) ---
          curl -fsSL -o pgpool-II-4.7.2.tar.gz \
            https://www.pgpool.net/source/pgpool-II-4.7.2.tar.gz
          sha256sum pgpool-II-4.7.2.tar.gz | tee pgpool-II-4.7.2.sha256
          tar xzf pgpool-II-4.7.2.tar.gz
          cd pgpool-II-4.7.2
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          cd /tmp/poolers
          # --- Odyssey v1.5.1 stable (2026-07-12) ---
          git clone --branch v1.5.1 --depth 1 \
            https://github.com/yandex/odyssey.git odyssey-1.5.1
          cd odyssey-1.5.1
          git rev-parse HEAD | tee /tmp/poolers/odyssey.sha
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j"$(nproc)"
          sudo make install || sudo install -m 0755 odyssey /usr/local/bin/odyssey
          cd /tmp/poolers
          # --- pgagroal master tip (SHA pinned at build, disclosed) ---
          git clone https://github.com/pgagroal/pgagroal.git pgagroal-tip
          cd pgagroal-tip
          git rev-parse HEAD | tee /tmp/poolers/pgagroal.sha
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j"$(nproc)"
          sudo make install
          cd /tmp/poolers
          # --- pgcat v1.2.0 (2024-08-30; release carries no binary
          # --- assets, so build the v1.2.0 tag from source with cargo) ---
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          git clone --branch v1.2.0 --depth 1 \
            https://github.com/postgresml/pgcat.git pgcat-1.2.0
          cd pgcat-1.2.0
          git rev-parse HEAD | tee /tmp/poolers/pgcat.sha
          cargo build --release
          sudo install -m 0755 target/release/pgcat /usr/local/bin/pgcat
          cd /tmp/poolers
          # Refresh the loader cache: pgagroal installs libpgagroal.so.2
          # under /usr/local/lib and fails at startup without this.
          sudo ldconfig
          ldconfig -p | grep -E 'libpgagroal|libpq' || true

      - name: Set up Elixir/OTP and Rust (Supavisor build toolchain)
        # Warn-only by design: Supavisor is the new contender, so a
        # toolchain flake must record honest per-arm Supavisor errors
        # instead of killing all 103 chunks (run 34775215643 failed 103/103
        # inside setup-beam at `mix local.rebar` with a builds.hex.pm TLS
        # `unsupported_certificate` alert; every downstream step skipped).
        continue-on-error: true
        uses: erlef/setup-beam@v1
        with:
          # Pinned toolchain satisfying supavisor mix.exs (elixir ~> 1.14):
          # Elixir 1.17 line with OTP 27. Rust (for the pgparser NIF via
          # rustler) comes from rustup below, not from setup-beam.
          elixir-version: "1.17.3"
          otp-version: "27.1"
          # Do NOT fetch hex/rebar inside the action: that fetch is what
          # failed with the TLS alert above. The Build Supavisor step
          # installs them manually with retries instead.
          install-hex: false
          install-rebar: false

      - name: Build Supavisor (pinned v2.9.13, SHA recorded)
        # Warn-only by design (see setup-beam note above): any Supavisor-only
        # failure writes a BLOCKED marker sha and exits 0 so incumbents
        # still measure; Supavisor arms then error loudly per-cell via the
        # shared runner healthcheck. Never kills the chunk.
        if: always()
        continue-on-error: true
        run: |
          set -eux
          # Pinned per poolduel/docs/versions.md + harness/supavisor.py
          # PINNED_VERSION. Mix prod release per the upstream installation
          # doc; the exact tag SHA is recorded into the artifact manifest
          # (a matrix entry without a recorded SHA is a blocking defect,
          # never a silent moving tip). The Rust toolchain builds the
          # pgparser NIF (rustler) inside mix deps/compile.
          # Refs: https://supabase.github.io/supavisor/development/installation/
          # Release tag commit: 5a51fbfadaa6d6286c1fee0a95d4c629e81a2750
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$HOME/.mix:$PATH"
          # If setup-beam flaked, mix is absent: record BLOCKED and exit 0
          # (warn-only) so incumbents still measure.
          if ! command -v mix >/dev/null 2>&1; then
            echo "poolduel: mix missing (setup-beam flaked), Supavisor BLOCKED this chunk" >&2
            mkdir -p /tmp/poolers
            echo "BLOCKED: no elixir toolchain" > /tmp/poolers/supavisor.sha
            exit 0
          fi
          # Manual hex/rebar install with retries (the builds.hex.pm TLS
          # flake from run 34775215643 must not kill incumbents).
          attempt=1
          until mix local.hex --force; do
            if [ "$attempt" -ge 3 ]; then
              echo "poolduel: mix local.hex failed, Supavisor BLOCKED this chunk" >&2
              mkdir -p /tmp/poolers
              echo "BLOCKED: hex install failed" > /tmp/poolers/supavisor.sha
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 15
          done
          attempt=1
          until mix local.rebar --force; do
            if [ "$attempt" -ge 3 ]; then
              echo "poolduel: mix local.rebar failed, Supavisor BLOCKED this chunk" >&2
              mkdir -p /tmp/poolers
              echo "BLOCKED: rebar install failed" > /tmp/poolers/supavisor.sha
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 15
          done
          mkdir -p /tmp/poolers
          cd /tmp/poolers
          rm -rf supavisor-2.9.13
          git clone --branch v2.9.13 --depth 1 \
            https://github.com/supabase/supavisor.git supavisor-2.9.13
          cd supavisor-2.9.13
          git rev-parse HEAD | tee /tmp/poolers/supavisor.sha
          test -s /tmp/poolers/supavisor.sha
          # Release build itself is warn-only: on failure record BLOCKED
          # beside the real SHA attempt and exit 0 (incumbents still
          # measure; Supavisor arms error loudly per-cell).
          if ! MIX_ENV=prod mix deps.get --only prod; then
            echo "poolduel: supavisor deps.get failed, Supavisor BLOCKED this chunk" >&2
            echo "BLOCKED: deps.get failed" >> /tmp/poolers/supavisor.sha
            exit 0
          fi
          if ! MIX_ENV=prod mix release; then
            echo "poolduel: supavisor release failed, Supavisor BLOCKED this chunk" >&2
            echo "BLOCKED: release failed" >> /tmp/poolers/supavisor.sha
            exit 0
          fi
          # Install the release binary on PATH as `supavisor` (the name the
          # harness adapter execs). The release boots with `supavisor start`
          # per development/installation/; the adapter wraps that exact call
          # in SUPAVISOR_RUN.sh with the provisioned env file.
          ls "_build/prod/rel/supavisor/bin/"
          sudo ln -sf "$(pwd)/_build/prod/rel/supavisor/bin/supavisor" /usr/local/bin/supavisor
          command -v supavisor
          elixir --version

      - name: Verify pooler binaries
        # Must run even when Supavisor toolchain flaked (warn-only there).
        if: always()
        run: |
          set -eux
          export PATH="/usr/lib/postgresql/17/bin:/usr/local/bin:$HOME/.cargo/bin:$HOME/.mix:$PATH"
          # Fail loudly here (before any pgbench minute is spent) if any
          # incumbent pooler binary the harness adapters exec is missing.
          # Supavisor is warn-only: it is the new contender, so a build
          # flake records honest per-arm Supavisor errors instead of killing
          # all 103 chunks.
          for bin in pgbouncer pgpool odyssey pgagroal pgcat; do
            command -v "$bin" || { echo "missing pooler binary: $bin" >&2; exit 1; }
          done
          command -v supavisor || echo "poolduel: supavisor missing (Supavisor arms will error loudly per-cell, incumbents still measure)"
          # Pinned per poolduel/docs/versions.md: pgbench must be PG 17.
          case "$(pgbench --version)" in
            *" 17."*) echo "pgbench is PG 17: $(pgbench --version)" ;;
            *) echo "poolduel: pgbench is not PG 17: $(pgbench --version)" >&2; exit 1 ;;
          esac
          pgagroal --version || true
          pgbouncer --version || true
          pgpool --version || true
          odyssey --version || true
          pgcat --version || true
          echo "--- pinned SHAs ---"
          cat /tmp/poolers/pgagroal.sha
          cat /tmp/poolers/odyssey.sha
          cat /tmp/poolers/pgcat.sha
          cat /tmp/poolers/supavisor.sha

      - name: Init dataset and checkpoint (scale-aware)
        # Must run even when Supavisor toolchain flaked.
        if: always()
        run: |
          set -eux
          export PATH="/usr/lib/postgresql/17/bin:/usr/local/bin:$PATH"
          sudo service postgresql start || sudo pg_ctlcluster 17 main start
          sudo mkdir -p /var/run/pgpool
          sudo chown "$(id -un)" /var/run/pgpool
          sudo -u postgres /usr/bin/psql --cluster 17/main -c "CREATE ROLE benchuser WITH LOGIN SUPERUSER PASSWORD 'benchpass';" || true
          sudo -u postgres /usr/bin/psql --cluster 17/main -c "CREATE DATABASE benchdb OWNER benchuser;" || true
          # Scale comes from the harness chunk table, never hand-typed:
          # C block inits -s 100 (~1.5 GB), every other block -s 10.
          SCALE="$(PYTHONPATH=. python3 -c "from poolduel.harness.m9 import m9_chunk_scale; print(m9_chunk_scale('${{ matrix.chunk }}'))")"
          echo "poolduel: chunk ${{ matrix.chunk }} dataset scale $SCALE"
          PGPASSWORD=benchpass pgbench -h 127.0.0.1 -U benchuser -i -s "$SCALE" benchdb
          PGPASSWORD=benchpass psql -h 127.0.0.1 -U benchuser -d benchdb -c "CHECKPOINT;"
          PGPASSWORD=benchpass psql -h 127.0.0.1 -U benchuser -d benchdb -c "VACUUM (ANALYZE);"

      - name: Provision Supavisor metadata + tenant (static smoke gate)
        # Warn-only by design: a Supavisor-only provision failure must not
        # kill incumbent measurement (same doctrine as the build steps).
        if: always()
        continue-on-error: true
        run: |
          set -eux
          # Renders the provisioning bundle with the real adapter setup()
          # (supavisor.env + tenant.json + metadata.sql + SUPAVISOR_RUN.sh)
          # and evaluates the M7 static smoke gate. Live checks (release
          # binary, metadata DB, REST, listener) stay pending here and are
          # proven per-cell at sweep time by the shared runner healthcheck,
          # exactly as for every other arm: per-cell pool_size/mode live in
          # the workdir bundle, so a single global provision cannot cover
          # them. Every step fails loudly (--fail, set -eux) so a wrong
          # bundle reads as a failed chunk, never as silent numbers.
          # Refs: development/setup/ (REST provisioning),
          # development/installation/ (metadata DB + migrations).
          export SUPAVISOR_SHA="$(cut -d' ' -f1 /tmp/poolers/supavisor.sha | head -c 40)"
          PYTHONPATH=. python3 -m poolduel.harness.cli --smoke-supavisor \
            --out "$(pwd)/poolduel/results/m9-${{ matrix.chunk }}"

      - name: Preflight check
        # Must run even when Supavisor steps flaked.
        if: always()
        run: |
          python3 poolduel/harness/check.py

      - name: Run M9 chunk
        # Must run even when Supavisor steps flaked; chunk filter preserved.
        # Supavisor warn-only doctrine (same as the setup-beam, build,
        # verify, and provision steps above): a chunk whose ONLY failures
        # are Supavisor arms still measured its incumbents, so it succeeds
        # honestly instead of going red. Per-arm Supavisor errors stay
        # printed in the log and Supavisor medians stay null (never
        # zero-filled). Any non-supavisor error, or zero incumbent
        # records, still fails the chunk loudly.
        # Refs: run 34782062919 failed 76 chunks here with supavisor-only
        # rc=127 (BLOCKED toolchain, binary missing) while every one of
        # those chunks wrote incumbent raw records; aggregate committed
        # 250 medians anyway, so the red chunks were pure signal noise.
        if: ${{ always() && (inputs.chunk == '' || inputs.chunk == matrix.chunk) }}
        env:
          PGPASSWORD: benchpass
        run: |
          export PATH="/usr/lib/postgresql/17/bin:/usr/local/bin:$PATH"
          export SUPAVISOR_SHA="$(cut -d' ' -f1 /tmp/poolers/supavisor.sha | head -c 40)"
          out="$(pwd)/poolduel/results/m9-${{ matrix.chunk }}"
          mkdir -p "$out"
          chunk_log="/tmp/poolduel-m9-${{ matrix.chunk }}.log"
          set +e
          python3 -m poolduel.harness.cli --matrix m9 --chunk "${{ matrix.chunk }}" \
            --threads "$(nproc)" --out "$out" >"$chunk_log" 2>&1
          rc=$?
          set -e
          cat "$chunk_log"
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if grep -E '^ERROR' "$chunk_log" | grep -v '/supavisor/' >/dev/null 2>&1; then
            echo "poolduel: non-supavisor arm errors present, chunk fails" >&2
            exit "$rc"
          fi
          if ! grep -E '^ERROR' "$chunk_log" | grep -q '/supavisor/'; then
            echo "poolduel: harness failed without supavisor errors, chunk fails" >&2
            exit "$rc"
          fi
          incumbent="$(OUT_DIR="$out" PYTHONPATH=. python3 -c 'import glob, json, os
          n = 0
          for path in glob.glob(os.path.join(os.environ["OUT_DIR"], "raw", "*.json")):
              try:
                  rec = json.load(open(path))
              except Exception:
                  continue
              if rec.get("pooler") != "supavisor":
                  n += 1
          print(n)')" || incumbent=0
          if [ "${incumbent:-0}" -gt 0 ]; then
            echo "poolduel: supavisor-only errors with $incumbent incumbent records, chunk honestly partial (Refs #302)"
            exit 0
          fi
          echo "poolduel: no incumbent records, chunk fails" >&2
          exit "$rc"

      - name: Record pooler versions
        if: always()
        run: |
          set -eux
          export PATH="/usr/local/bin:$HOME/.cargo/bin:$PATH"
          out="poolduel/results/m9-${{ matrix.chunk }}"
          mkdir -p "$out"
          {
            echo "pgbouncer 1.25.2 tarball sha256:"
            cat /tmp/poolers/pgbouncer-1.25.2.sha256 2>/dev/null || echo "n/a"
            echo "pgpool-II 4.7.2 tarball sha256:"
            cat /tmp/poolers/pgpool-II-4.7.2.sha256 2>/dev/null || echo "n/a"
            echo "odyssey v1.5.1 git SHA:"
            cat /tmp/poolers/odyssey.sha 2>/dev/null || echo "n/a"
            echo "pgagroal master tip SHA:"
            cat /tmp/poolers/pgagroal.sha 2>/dev/null || echo "n/a"
            echo "pgcat v1.2.0 git SHA:"
            cat /tmp/poolers/pgcat.sha 2>/dev/null || echo "n/a"
            echo "supavisor v2.9.13 git SHA:"
            cat /tmp/poolers/supavisor.sha 2>/dev/null || echo "n/a (BLOCKED: no matrix entry)"
            echo "binaries:"
            command -v pgbouncer || echo "n/a (missing pgbouncer)"
            command -v pgpool || echo "n/a (missing pgpool)"
            command -v odyssey || echo "n/a (missing odyssey)"
            command -v pgagroal || echo "n/a (missing pgagroal)"
            command -v pgcat || echo "n/a (missing pgcat)"
            command -v supavisor || echo "n/a (missing supavisor)"
          } > "$out/pooler-versions.txt"
          cat "$out/pooler-versions.txt"

      - name: Upload chunk results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poolduel-m9-${{ matrix.chunk }}
          path: poolduel/results/m9-${{ matrix.chunk }}
          retention-days: 30
          overwrite: true

  aggregate:
    name: Aggregate M9 medians
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download chunk artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: poolduel-m9-*
          path: /tmp/poolduel-m9-artifacts
          merge-multiple: false

      - name: Merge raw records and rebuild medians
        env:
          PYTHONPATH: "."
        run: |
          set -eux
          mkdir -p poolduel/results/m9/raw
          if [ -d /tmp/poolduel-m9-artifacts ]; then
            for rawdir in $(find /tmp/poolduel-m9-artifacts -type d -name raw 2>/dev/null); do
              for f in "$rawdir"/*.json; do
                [ -f "$f" ] || continue
                case "$(basename "$f")" in
                  manifest.json|summary.json|medians.json|report.json|comparisons.json)
                    continue ;;
                esac
                cp "$f" poolduel/results/m9/raw/
              done
            done
            for vf in $(find /tmp/poolduel-m9-artifacts -name pooler-versions.txt 2>/dev/null); do
              parent="$(basename "$(dirname "$vf")")"
              cp "$vf" "poolduel/results/m9/pooler-versions-$parent.txt"
            done
          fi
          if ! ls poolduel/results/m9/raw/*.json >/dev/null 2>&1; then
            echo "poolduel-m9 aggregate: no raw cell records, nothing to commit" >&2
            exit 1
          fi
          python3 -m poolduel.harness.cli --matrix m9 --write-na \
            --out poolduel/results/m9
          PYTHONPATH=. python3 -c "
          import glob, json
          from poolduel.harness.runner import write_medians
          records = []
          for path in sorted(glob.glob('poolduel/results/m9/raw/*.json')):
              with open(path) as f:
                  records.append(json.load(f))
          # Every raw record aggregates (measured rows carry medians,
          # timeout/inconclusive and N/A rows carry nulls, never zeros).
          medians = write_medians(records, 'poolduel/results/m9/medians.json')
          print('poolduel-m9 aggregate: %d raw files, %d medians'
                % (len(records), len(medians)))
          "

      - name: Commit and push results
        env:
          TARGET_REF: ${{ inputs.ref }}
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add poolduel/results
          if git diff --cached --quiet; then
            echo "poolduel-m9 aggregate: no changes to commit"
            exit 0
          fi
          git commit -m "poolduel M9 sweep results (Refs #302)"
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if git pull --rebase origin "$TARGET_REF" && git push origin "HEAD:$TARGET_REF"; then
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 10
          done
          echo "poolduel-m9 aggregate: push failed after 3 attempts" >&2
          exit 1
