name: "opencode GitHub Action (vendored, hardened)"
description: >-
  In-repo vendoring of anomalyco/opencode/github@latest with a non-fatal,
  authenticated version lookup, so an anonymous releases-API rate limit can
  never abort an agent run before the agent starts (issue #422), plus a
  bounded model fallback ladder, so a provider-side model retirement can no
  longer kill every arm at once or conclude a Model-not-found death green
  (issue #591), a bounded same-model retry on the provider's transient
  FreeTierError rejection, so one free-tier blip cannot kill a gate or drop
  a wake-up (issue #620), and a bounded same-model retry on transient 429/5xx
  provider errors plus an inactivity watchdog that aborts a silent provider
  stall before the step timeout burns the whole tick (issue #653), and a named
  fast-fail for the provider's 403 abusive-traffic egress-IP block, whose
  recovery is a fresh run on a new runner rather than a same-runner retry
  (issue #669).
branding:
  icon: "code"
  color: "orange"

# Vendored from github/action.yml of anomalyco/opencode at @latest.
# Keep inputs and the cache/install/PATH/run steps byte-compatible with
# upstream so a future re-sync is a mechanical diff; the intentional
# divergences are (1) the hardened "Get opencode version" step below and
# (2) the model-resilience pair (resolve-model.sh + model-ladder.txt and the
# per-rung retry loop in "Run opencode", audit rule R15, plus the bounded
# FreeTierError same-model retry plus the bounded transient-429/5xx retry and
# the provider-stall watchdog, all guarded by extended audit rule R15).
# Per-lane model selection stays an input (the previous flexible setup).
# opencode.json in the repository root is still staged from the maintained
# default-branch commit and loaded via OPENCODE_CONFIG so the CLI's paid
# built-in small model (gpt-5.4-nano) is never used on PR-gated lanes, where
# OPENCODE_DISABLE_PROJECT_CONFIG would otherwise ignore the root file. The
# staged config supplies `small_model`; the main model remains the per-lane
# `model` input below.
inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  share:
    description: "Share the opencode session (defaults to true for public repos)"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of OpenCode App token exchange. When true, skips OIDC and uses the GITHUB_TOKEN env var."
    required: false
    default: "false"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/opencode,/oc'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  oidc_base_url:
    description: "Base URL for OIDC token exchange API. Only required when running a custom GitHub App install. Defaults to https://api.opencode.ai"
    required: false

runs:
  using: "composite"
  steps:
    - name: Get opencode version
      id: version
      shell: bash
      # Cache-key lookup ONLY: it must never veto the run. The script below
      # is written so it cannot exit non-zero; continue-on-error is the belt
      # to that suspenders (issue #422: three agent runs died in 60-128 ms
      # here, before the agent ever started, because the upstream step ran
      # an unauthenticated curl -sf under `bash -e -o pipefail`, so a 403/429
      # aborted the pipeline and the intended ${VERSION:-latest} fallback
      # was dead code).
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Authenticated (5000 req/hour, per-repo) instead of the anonymous
        # shared-runner-IP pool (60 req/hour); `|| true` keeps `pipefail`
        # from aborting on a curl non-2xx or a grep no-match in a rate-limit
        # body; the bounded retry loop absorbs transient blips and hard curl
        # timeouts keep a stalled connection from hanging the step. Every path
        # therefore reaches the fallback: a failed lookup degrades to
        # `latest` instead of killing the run.
        VERSION=""
        for attempt in 1 2 3; do
          VERSION=$(curl -sf --retry 2 --retry-delay 5 --connect-timeout 10 --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/anomalyco/opencode/releases/latest \
            | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4 || true)
          if [ -n "$VERSION" ]; then
            break
          fi
          echo "version lookup attempt $attempt failed; retrying..."
          sleep 3
        done
        echo "version=${VERSION:-latest}" >> "$GITHUB_OUTPUT"
        echo "resolved opencode version: ${VERSION:-latest}"

    - name: Cache opencode
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.opencode/bin
        key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Verify cached opencode binary (poisoned-cache guard)
      id: verify
      shell: bash
      run: |
        # A cache entry can be poisoned (saved with no binary inside, e.g.
        # the 189-byte opencode-macOS-ARM64-v1.19.0 entry of 2026-10-11):
        # restore succeeds, install is skipped on cache-hit, and the agent
        # then dies with "opencode: command not found" (exit 127).
        if [ -x "$HOME/.opencode/bin/opencode" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install opencode
      if: steps.cache.outputs.cache-hit != 'true' || steps.verify.outputs.present != 'true'
      shell: bash
      run: |
        curl -fsSL https://opencode.ai/install | bash
        test -x "$HOME/.opencode/bin/opencode"

    - name: Add opencode to PATH
      shell: bash
      run: echo "$HOME/.opencode/bin" >> $GITHUB_PATH

    - name: Stage the maintained opencode config (small-model guard)
      id: opencode_config
      shell: bash
      # The PR-gated lanes keep OPENCODE_DISABLE_PROJECT_CONFIG so a PR cannot
      # inject project config, and without an explicit config file the CLI
      # falls back to its built-in paid small model (gpt-5.4-nano), which
      # died with "Insufficient account funds" (HTTP 402) on review run
      # 40457674498. Stage the maintained default-branch opencode.json (never
      # the PR head), validate it, and point OPENCODE_CONFIG at the staged
      # copy so its `small_model` is respected. The main model is still the
      # per-lane `model` input; passing `MODEL` to the CLI overrides the
      # config's `model`, so per-lane flexibility is preserved. The
      # handoff-contract checker is advisory: prefer its default-branch
      # edition, fall back to the checked-out edition so a PR introducing it
      # can run its own lanes before merge, and never fail the run just
      # because it is absent.
      env:
        TRUSTED_REF: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        config_dir="${RUNNER_TEMP}/lab-config"
        bin_dir="${RUNNER_TEMP}/lab-bin"
        mkdir -p "$config_dir" "$bin_dir"
        # Full fetch (no --depth): planting a shallow boundary here would
        # break the merge-base checks later in the job (issue #602).
        git fetch --quiet origin "$TRUSTED_REF"
        trusted_sha=$(git rev-parse --verify FETCH_HEAD)
        if ! git show "${trusted_sha}:opencode.json" > "$config_dir/opencode.json" 2>/dev/null; then
          echo "::error::Could not read opencode.json from the maintained default-branch commit ${trusted_sha}; refusing to start an agent with the CLI's built-in model defaults."
          exit 1
        fi
        # The handoff-contract checker is advisory (the post-agent gates are
        # authoritative). Prefer the maintained default-branch edition; fall
        # back to the checked-out edition so a PR that introduces the checker
        # can run its own review/test lanes before that PR merges, and never
        # fail the run just because the helper is not on the default branch yet.
        if git show "${trusted_sha}:.github/scripts/verify-agent-contract.sh" > "$bin_dir/verify-agent-contract.sh" 2>/dev/null; then
          :
        elif [ -f .github/scripts/verify-agent-contract.sh ]; then
          cp .github/scripts/verify-agent-contract.sh "$bin_dir/verify-agent-contract.sh"
          echo "::warning::The maintained default branch does not carry verify-agent-contract.sh yet; using the checked-out edition for this run's advisory self-check. The post-agent gates remain authoritative."
        else
          echo "::warning::verify-agent-contract.sh is unavailable on the default branch and in the checkout; the agent self-check is unavailable, but the post-agent gates remain authoritative."
        fi
        test -s "$config_dir/opencode.json"
        if [ -s "$bin_dir/verify-agent-contract.sh" ]; then
          chmod +x "$bin_dir/verify-agent-contract.sh" 2>/dev/null || true
        fi
        model=$(jq -r '.model // empty' "$config_dir/opencode.json")
        small_model=$(jq -r '.small_model // empty' "$config_dir/opencode.json")
        for pair in "model=$model" "small_model=$small_model"; do
          key=${pair%%=*}
          value=${pair#*=}
          if [ -z "$value" ]; then
            echo "::error::opencode.json on ${trusted_sha} has no '$key'; a missing pin lets the CLI choose its paid built-in default, so refusing to start."
            exit 1
          fi
          if ! printf '%s' "$value" | grep -qE '^opencode/[A-Za-z0-9._-]+$'; then
            echo "::error::opencode.json '$key' value '$value' is not a well-formed opencode/<name> ref."
            exit 1
          fi
          if ! printf '%s' "$value" | grep -qE -- '-free$'; then
            echo "::error::opencode.json '$key' value '$value' is not free-tier; the lab never runs paid models (free-tier guard, issue #130)."
            exit 1
          fi
        done
        {
          echo "model=$model"
          echo "small_model=$small_model"
        } >> "$GITHUB_OUTPUT"
        echo "::notice::Staged opencode.json from ${trusted_sha}: small_model='$small_model' (main model remains the per-lane model input)."

    - name: Resolve model (bounded fallback ladder)
      id: model_ladder
      shell: bash
      # Fail-loud pre-flight (issue #591): resolves the requested pin against
      # the live registry and substitutes the first live ladder rung when the
      # provider retired the pin. A registry outage degrades to pass-through
      # (never blocks the run); a fully dead ladder exits 1 here so the
      # caller's crash-parity verify step decides retry/escalation instead of
      # hollow green. Script + ladder co-locate with this action so the
      # PR-head restore archive (issue #430) carries them atomically.
      env:
        REQUESTED_MODEL: ${{ inputs.model }}
      run: |
        script="${GITHUB_ACTION_PATH:-.github/actions/opencode-run}/resolve-model.sh"
        bash "$script"

    # The wrapper prints the provider's terminal error at column 0 (the
    # final text part `Model not found: <id>. Did you mean: ...`, or
    # `Error: Model not found: ...` when its catch handler prints the
    # throw), while a transcript echo of the phrase (a tool-call echo
    # rendered with the tool prefix, a quoted log line embedded in prose)
    # cannot match both the column-0 anchor and the terminal form. The
    # 2026-10-17 exit-0 fire re-ran a healthy completed session because a
    # whole-log substring match hit tool-call echoes of the exact pin.
    # Residual (documented): a healthy run whose own final response
    # contains the exact terminal form as a standalone column-0 line
    # could still match; no such line has ever been observed.
    # ( set +o pipefail; ... ) wrap (issue #653 review F1): every
    # `shell: bash` step runs as `bash --noprofile --norc -eo pipefail`,
    # and `grep -q` exits at the first match while `tail` may still be
    # writing. Once the 40-line window exceeds the pipe buffer (64 KiB on
    # Linux), tail takes SIGPIPE and pipefail propagates its 141, so a
    # genuine terminal line would read as "no match" (a silent green on
    # the exit-0 path, a lost retry on the nonzero path). The subshell
    # restores the pipeline's own grep status without weakening either
    # the tail scope or the column-0 anchor. The same wrap guards all
    # three detectors.
    # FreeTierError detector (issue #620), same tail + column-0 terminal
    # anchoring as model_error_terminal: the provider prints the terminal
    # line bare from its AI SDK (`AI_APICallError: ...`) or from the CLI's
    # catch handler (`APIError: ...`), while a transcript echo (tool-call
    # echo, quoted log line in prose) and the responseBody JSON envelope
    # cannot match the anchored whole-line form.
    # Daily free-usage wall detector (issue #754), same column-0 terminal
    # anchoring as the other detectors but with a wider bounded window:
    # the CLI prints the terminal line, then a long error dump, then goes
    # silent. In review run 40048604834 the line sat about 345 lines above
    # the kill point, so the calibrated window is 600 lines (the 40-line
    # window of the other classes cannot see it). The phrase family covers
    # the older literal and the current `Free models work in OpenCode
    # (https://opencode.ai); ` variant; the `AI_RetryError: Failed after 3
    # attempts...` summary, the responseBody envelope, an indented echo, a
    # suffixed line, and a stale line beyond the window cannot match the
    # anchored whole-line form. Accepted residual (same as the other
    # detectors): a healthy session that prints the exact provider line at
    # column 0 in its last 600 log lines is fast-failed; the cost is one
    # fresh-run re-dispatch, which is this class's recovery.
    # Account-level funds rejection detector (issue #754): the provider's
    # `Upstream request failed: Insufficient account funds` line is
    # account-level, not a transient 5xx. It uses the same wider bounded
    # 600-line window as the quota class because the line can sit far above
    # the end of a long provider dump, and the classification is checked
    # inside the hang branch before the stall retry (and again after the
    # post-attempt quota check) so an account line followed by silence is
    # fast-failed instead of consuming the one same-model stall retry, and a
    # log carrying both terminal lines is the quota wall. It is excluded from
    # the transient family below (whose bounded `Upstream request failed: `
    # phrase would otherwise match it) so it can never consume the shared HTTP
    # retry. The line can be a non-fatal per-call paid-title-path 402, so a
    # fresh run is the first recovery; both runner paths fast-fail it by name,
    # and the provider-plan/Owner escalation is for a persistent rejection.
    # Transient HTTP-error detector (issues #653, #717), same tail +
    # column-0 terminal anchoring as the #591/#620 detectors: the observed
    # terminal forms are `AI_APICallError: Rate limit exceeded. Please try
    # again later.`, `AI_APICallError: Internal Server Error`, the standard
    # gateway phrases, and the retryable upstream-endpoint form
    # `AI_APICallError: Upstream request failed: Endpoint is unavailable.`
    # (statusCode 429, type server_error; matched by its bounded
    # `Upstream request failed: ` phrase family, never by a bare
    # `AI_APICallError:` prefix), bare at column 0, while the
    # `AI_RetryError: Failed after 3 attempts. Last error: ...` summary, a
    # transcript echo, and the responseBody JSON envelope cannot match the
    # anchored whole-line form. A persistent occurrence after the one
    # bounded same-model retry fails loudly on that model and does NOT
    # advance the ladder: every rung shares this gateway, so a fresh-run
    # re-dispatch (crash parity) is the recovery lane. The account-funds
    # rejection is structurally excluded (issue #754) so it can never
    # spend this budget.
    # Blocked-egress-IP detector (issue #669), same tail + column-0
    # terminal anchoring as the #591/#620/#653 detectors: the provider
    # rejects the runner's egress IP with HTTP 403 and one of two
    # FreeTierError forms (`Forbidden, OpenCode Free Model Gateway Detect
    # Abuse Traffic`, or the long "OpenCode's free models aren't available
    # from your current network ..." message). All four incidents
    # (2026-10-18: 39127259752, 39144091490, 39165526719; 2026-10-20:
    # 39378762068) hit on the session's FIRST provider call within 8-20
    # seconds, which is consistent with the runner's egress IP already
    # being blocked when the job starts, so this class is deliberately
    # FAST-FAILED rather than retried: a same-model retry from the same
    # runner would hit the same IP. The canonical error below names the
    # class and the fresh-run recovery path; crash-parity triage already
    # re-dispatches onto a new runner (review/curator owner auto-retry,
    # test/lab via Maintainer workflow_run triage, the Maintainer via its
    # recurring schedule).
    # Accepted residual (review observation): this detector also runs on
    # the exit-0 path, so a healthy session that prints the exact provider
    # line at column 0 within its last 40 log lines (for example a fenced
    # quote of the failure it is debugging) is fast-failed with no retry.
    # This is the same accepted residual as the #591/#620/#653 detectors
    # (their echo fixtures cover indented echoes only), and the cost is
    # one fresh-run re-dispatch, which is this class's intended recovery.
    # Provider-stall watchdog knobs (issue #653): an attempt whose captured
    # log does not grow for HANG_IDLE_SECONDS (checked every
    # HANG_POLL_SECONDS) while opencode has no live descendant is aborted
    # and classified as a provider hang (issue #805).
    # Env-overridable only so the audit harness can exercise the watchdog
    # in seconds; non-numeric values fall back to the production defaults.
    # Review F3: a zero poll interval would busy-loop with `idle += 0`
    # (watchdog silently disabled) and a value beyond the shell's integer
    # range would error on every `-ge` comparison (watchdog never fires),
    # so both knobs are clamped to sane positive bounds here.
    - name: Run opencode
      shell: bash
      id: run_opencode
      # Per-rung retry (issue #591): the task says a provider retirement is
      # unilateral and the death was silent. MODEL_CANDIDATES is the ordered
      # chain from resolve-model.sh (requested first when live, then the live
      # rungs). A provider "Model not found" (whether opencode exits nonzero
      # or exits 0 after posting its error comment) advances to the next rung
      # exactly once per rung; any other failure exits immediately; a fully
      # exhausted ladder exits 1 LOUDLY so the verify steps summon triage.
      # Exit-0 anchoring (issue #591, finding 7): a healthy completed run must
      # never advance merely because its own transcript echoed the phrase, so
      # the exit-0 path matches only the provider's anchored terminal error
      # line in the tail of the log; the nonzero path keeps the boundary
      # match (a genuine provider death exits nonzero with the error as the
      # terminal output).
      # Free-tier transient retry (issue #620): the provider intermittently
      # rejects a free-tier call with FreeTierError ("OpenCode's free tier can
      # only be used from within OpenCode ...") seconds into the agent step,
      # killing the gate with no decision file and no retry (Tester run
      # 39059437136, Maintainer run 39060571484, both 2026-10-17). A death on
      # that provider class retries the SAME model exactly once per arm
      # (bounded: no unbounded loops); a second rejection fails loudly. The
      # detector reuses the #591 anchoring rules: tail-scoped, column-0
      # anchored terminal form, so a transcript echo or the responseBody JSON
      # envelope can never consume the retry budget.
      # Transient HTTP retry (issue #653): the same provider class also dies
      # with bare 429/5xx terminal lines (`AI_APICallError: Rate limit
      # exceeded. Please try again later.` at 06:37:19Z in maintainer run
      # 39104661889, `AI_APICallError: Internal Server Error` in maintainer
      # run 39104695066 and eval/lab runs 39110580426/39110581700 on
      # 2026-10-18). Such a death retries the SAME model exactly once per arm
      # with the same tail + column-0 terminal anchoring; a second death
      # fails loudly. The `AI_RetryError: Failed after 3 attempts. ...`
      # summary and any transcript echo never match the anchored form.
      # Provider-stall watchdog (issue #653): run 39104661889 printed its
      # terminal 429/5xx line and then produced NO output for 60 silent
      # minutes until the agent step timeout (eval run 39094600854 stalled
      # ~46 minutes the same way), so the captured log is now watched for
      # growth: an attempt whose log does not grow for HANG_IDLE_SECONDS
      # (default 600) with no live opencode descendant is TERM/KILLed as a
      # provider hang and retried once on the SAME model, while a live
      # descendant resets the idle accounting (issue #805); a second stall
      # fails loudly. FIFO capture keeps
      # opencode and tee as separate known PIDs to signal; on a runner
      # without mkfifo the step degrades loudly to the legacy inline
      # pipeline without the watchdog instead of bricking the arm (the
      # audit harness exercises both shapes).
      run: |
        candidates="${MODEL_CANDIDATES:-${MODEL:-}}"
        if [ -z "$candidates" ]; then
          echo "::error::No model candidates resolved; refusing to run opencode (the resolve step did not produce a candidate chain)."
          exit 1
        fi
        model_error_terminal() {
          ( set +o pipefail; tail -n 40 "$1" | grep -qE "^(Error: )?Model not found: ${2//./\\.}(\. Did you mean: .*|\.?$)" )
        }
        freetier_error_terminal() {
          ( set +o pipefail; tail -n 40 "$1" | grep -qE "^(AI_APICallError: |APIError: |Error: )?OpenCode's free tier can only be used from within OpenCode\. Download it at https://opencode\.ai and keep building\.?$" )
        }
        free_usage_limit_terminal() {
          ( set +o pipefail; tail -n 600 "$1" | grep -qE "^(AI_APICallError: |APIError: |Error: )?Free usage limit reached\.( Subscribe to OpenCode Go to keep going: https://opencode\.ai/go| Free models work in OpenCode \(https://opencode\.ai\); subscribe to OpenCode Go to keep going: https://opencode\.ai/go)\.?$" )
        }
        account_funds_terminal() {
          ( set +o pipefail; tail -n 600 "$1" | grep -qE "^(AI_APICallError: |APIError: |Error: )?Upstream request failed: Insufficient account funds\.?$" )
        }
        account_funds_fail() {
          rm -f "$log" "$fifo" "$hang_flag" "$quota_flag"
          echo "::error::provider rejected the call for insufficient account funds (account-level rejection, issue #754) on model '$1'; this is not a transient 429/5xx, so it is never retried and never advances the ladder. The line can be a non-fatal per-call paid-title-path 402, so a fresh run is the first recovery; fund the provider plan or escalate to the Owner only if the rejection persists."
          exit 1
        }
        transient_http_error_terminal() {
          if account_funds_terminal "$1"; then
            return 1
          fi
          ( set +o pipefail; tail -n 40 "$1" | grep -qE "^(AI_APICallError: |APIError: |Error: )?(Rate limit exceeded\. Please try again later\.|Internal Server Error|Bad Gateway|Service Unavailable|Gateway Timeout|Upstream request failed: [A-Za-z0-9_.',-]+( [A-Za-z0-9_.',-]+)*)\.?$" )
        }
        ip_block_error_terminal() {
          ( set +o pipefail; tail -n 40 "$1" | grep -qE "^(AI_APICallError: |APIError: |Error: )?(Forbidden, OpenCode Free Model Gateway Detect Abuse Traffic|OpenCode's free models aren't available from your current network because we've detected abusive traffic from this IP address\. This isn't related to your account\. If you're on a VPN or proxy, turn it off and try again, or subscribe to OpenCode Go at https://opencode\.ai/go to keep building\.)$" )
        }
        live_descendant() {
          # Issue #805: a silent opencode log is not a provider stall while
          # opencode still has a live descendant. A tool command that writes
          # nothing to the session log (output redirected to a file, or only
          # summarized when the command returns) can run for its whole
          # runtime with the captured log unchanged, and the old byte-size
          # watchdog killed it at the idle threshold (run 41388720220: a
          # browser-e2e loop was TERM/KILLed at 600 silent seconds twice).
          # Walk the pid/ppid table from $1 and report any other live
          # process whose ancestry reaches $1. Any ps failure reads as "no
          # descendant", which is exactly the pre-#805 bounded behavior,
          # never an unbounded wait.
          {
            ps -A -o pid=,ppid= 2>/dev/null ||
              ps -e -o pid=,ppid= 2>/dev/null ||
              ps 2>/dev/null
          } | awk -v root="$1" '
            $1 ~ /^[0-9]+$/ && $2 ~ /^[0-9]+$/ { parent[$1] = $2 }
            END {
              for (pid in parent) {
                if (pid == root) continue
                cur = pid
                for (depth = 0; depth < 64 && cur in parent && cur != root; depth++) cur = parent[cur]
                if (cur == root) exit 0
              }
              exit 1
            }'
        }
        hang_idle_seconds="${HANG_IDLE_SECONDS:-600}"
        hang_poll_seconds="${HANG_POLL_SECONDS:-30}"
        case "$hang_idle_seconds" in ''|*[!0-9]*) hang_idle_seconds=600 ;; esac
        case "$hang_poll_seconds" in ''|*[!0-9]*) hang_poll_seconds=30 ;; esac
        [ "$hang_poll_seconds" -ge 1 ] 2>/dev/null || hang_poll_seconds=30
        [ "$hang_idle_seconds" -ge 1 ] 2>/dev/null || hang_idle_seconds=600
        [ "$hang_idle_seconds" -le 86400 ] 2>/dev/null || hang_idle_seconds=600
        freetier_retry_used=0
        transient_retry_used=0
        hang_retry_used=0
        status=1
        for model in $candidates; do
          while :; do
            log="$(mktemp)"
            fifo="${log}.fifo"
            hang_flag="${log}.hang"
            quota_flag="${log}.quota"
            rm -f "$fifo" "$hang_flag" "$quota_flag"
            echo "::notice::opencode run with model '$model'"
            if mkfifo "$fifo" 2>/dev/null; then
              # FIFO capture shape (issue #653): tee and opencode run as
              # separate background children with known PIDs, so the stall
              # watchdog can signal exactly those two processes. A failed tee
              # is still observed via tee_pid's status; a failed opencode via
              # oc_pid's status.
              set +e
              tee "$log" < "$fifo" &
              tee_pid=$!
              MODEL="$model" opencode github run > "$fifo" 2>&1 &
              oc_pid=$!
              (
                last_size=$(wc -c < "$log" 2>/dev/null || echo 0)
                idle=0
                child_active=0
                while kill -0 "$oc_pid" 2>/dev/null; do
                  sleep "$hang_poll_seconds"
                  kill -0 "$oc_pid" 2>/dev/null || exit 0
                  # Daily free-usage wall (issue #754): the terminal quota
                  # line is the last provider output and the session then
                  # hangs, so cut on the line itself at the next poll instead
                  # of waiting out the full stall threshold (about 21 minutes
                  # across two attempts in review run 40048604834). The
                  # dedicated flag takes precedence over the stall flag below,
                  # so this class is fast-failed without consuming the one
                  # same-model stall retry.
                  if free_usage_limit_terminal "$log"; then
                    echo "::warning::provider daily free-usage limit reached on model '$model' (FreeUsageLimitError, issue #754); aborting this attempt immediately instead of waiting out the stall watchdog."
                    printf 'quota\n' > "$quota_flag"
                    kill -TERM "$oc_pid" 2>/dev/null
                    kill -TERM "$tee_pid" 2>/dev/null
                    sleep 5
                    kill -KILL "$oc_pid" 2>/dev/null
                    kill -KILL "$tee_pid" 2>/dev/null
                    exit 0
                  fi
                  size=$(wc -c < "$log" 2>/dev/null || echo 0)
                  if [ "$size" -ne "$last_size" ]; then
                    idle=0
                    last_size=$size
                    continue
                  fi
                  # Issue #805: a live tool descendant means the attempt is
                  # working, not stalled, even when the tool writes nothing
                  # to the session log. Never accumulate idle time while one
                  # is alive, and grant one full poll window after it exits
                  # so its buffered result can reach the log before the
                  # threshold can fire.
                  if live_descendant "$oc_pid"; then
                    child_active=1
                    idle=0
                    continue
                  fi
                  if [ "$child_active" -eq 1 ]; then
                    child_active=0
                    idle=0
                    continue
                  fi
                  idle=$((idle + hang_poll_seconds))
                  if [ "$idle" -ge "$hang_idle_seconds" ]; then
                    echo "::warning::opencode produced no output for ${hang_idle_seconds}s on model '$model' with no live tool descendant (provider stall, issue #653); aborting this attempt."
                    printf 'hang\n' > "$hang_flag"
                    kill -TERM "$oc_pid" 2>/dev/null
                    kill -TERM "$tee_pid" 2>/dev/null
                    sleep 5
                    kill -KILL "$oc_pid" 2>/dev/null
                    kill -KILL "$tee_pid" 2>/dev/null
                    exit 0
                  fi
                done
              ) &
              watch_pid=$!
              wait "$oc_pid"; status=$?
              wait "$tee_pid"; tee_status=$?
              kill "$watch_pid" 2>/dev/null
              wait "$watch_pid" 2>/dev/null
              set -e
            else
              # No mkfifo (some Windows Git Bash environments): keep the
              # legacy inline pipeline, loudly without the stall watchdog,
              # instead of bricking the arm.
              echo "::warning::mkfifo is unavailable on this runner; running model '$model' without the provider-stall watchdog (issue #653)."
              set +e
              MODEL="$model" opencode github run 2>&1 | tee "$log"
              # Capture BOTH pipeline statuses in one assignment: a following
              # t=${PIPESTATUS[1]} would be empty because the first assignment
              # resets PIPESTATUS. A failed tee (e.g. full RUNNER_TEMP) leaves an
              # empty log whose grep can never match, so an exit-0 Model-not-found
              # death would take the success branch; fail loudly instead.
              st=("${PIPESTATUS[@]}")
              set -e
              status="${st[0]}"; tee_status="${st[1]}"
            fi
            # Daily free-usage wall fast-fail (issue #754): the watchdog sets
            # the quota flag when it cuts on the terminal line, so this class
            # never reaches the stall retry below and consumes no budget. The
            # branch sits ahead of the tee guard because the watchdog's TERM
            # can make tee exit nonzero after a deliberate abort.
            if [ -s "$quota_flag" ]; then
              rm -f "$log" "$fifo" "$hang_flag" "$quota_flag"
              echo "::error::provider daily free-usage limit reached (FreeUsageLimitError, issue #754) on model '$model'; every free rung shares the same per-egress allowance, so this is not retryable on the same model or ladder and the stall retry is not consumed. Fresh-run recovery: a re-dispatch lands on a new runner and may get a fresh bucket; the provider's retry-after header, when present, is diagnostic only and never a park horizon. Escalate the provider plan if it persists."
              exit 1
            fi
            if [ -s "$hang_flag" ]; then
              # Account-level funds rejection fast-fail (issue #754): checked
              # before the stall retry so a terminal account line followed by
              # silence is classified here instead of consuming the one
              # same-model stall retry. It is also checked before the
              # transient HTTP class (which structurally excludes it) so it
              # can never consume the shared HTTP retry, and it exits 1
              # unconditionally for both exit shapes.
              if account_funds_terminal "$log"; then
                account_funds_fail "$model"
              fi
              rm -f "$log" "$fifo" "$hang_flag"
              if [ "$hang_retry_used" -lt 1 ]; then
                hang_retry_used=1
                echo "::warning::provider stall on model '$model' (issue #653); one bounded retry of the same model in 10s."
                sleep 10
                continue
              fi
              echo "::error::repeated provider stall on model '$model' after the bounded retry (issue #653); failing loudly instead of retrying unboundedly."
              exit 1
            fi
            if [ "$tee_status" -ne 0 ]; then
              echo "::error::could not capture the opencode log for model '$model' (tee exit $tee_status); failing loudly instead of risking a blind advance."
              rm -f "$log" "$fifo" "$hang_flag" "$quota_flag"
              exit 1
            fi
            # Daily free-usage wall fast-fail (issue #754) for an attempt that
            # ended on its own (including the degraded no-mkfifo shape): the
            # terminal line is matched in the wider bounded window, and the
            # class exits 1 unconditionally so an exit-0 provider death can
            # never conclude green. No retry budget is consumed and the ladder
            # is never advanced: every free rung shares the same per-egress
            # allowance, so a fresh run is the recovery lane.
            if free_usage_limit_terminal "$log"; then
              echo "::error::provider daily free-usage limit reached (FreeUsageLimitError, issue #754) on model '$model'; every free rung shares the same per-egress allowance, so this is not retryable on the same model or ladder and the stall retry is not consumed. Fresh-run recovery: a re-dispatch lands on a new runner and may get a fresh bucket; the provider's retry-after header, when present, is diagnostic only and never a park horizon. Escalate the provider plan if it persists."
              rm -f "$log" "$fifo" "$hang_flag" "$quota_flag"
              exit 1
            fi
            # Account-level funds rejection fast-fail (issue #754) for an
            # attempt that ended on its own (including the degraded no-mkfifo
            # shape): checked after the quota class so a log carrying both
            # terminal lines is classified as the quota wall, never as account
            # funds. It exits 1 unconditionally for both exit shapes and never
            # consumes the shared HTTP retry.
            if account_funds_terminal "$log"; then
              account_funds_fail "$model"
            fi
            # Blocked-egress-IP fast-fail (issue #669): checked before the
            # exit-shape split so BOTH shapes are classified, and exits 1
            # unconditionally (never `exit "$status"`, which would conclude an
            # exit-0 provider death green). No retry budget is consumed and no
            # backoff is spent: the block is runner-specific, so a fresh run on
            # a new runner is the recovery, not an in-job retry.
            if ip_block_error_terminal "$log"; then
              echo "::error::provider blocked this runner's egress IP (HTTP 403 abusive-traffic classification, issue #669) on model '$model'; this is not retryable from the same runner. Fresh-run recovery: a re-dispatch lands on a new runner with a new egress IP (the crash-parity triage already re-dispatches review/test/lab, and the Maintainer schedule covers its own arm)."
              rm -f "$log" "$fifo" "$hang_flag"
              exit 1
            fi
            if [ "$status" -eq 0 ]; then
              if model_error_terminal "$log" "$model"; then
                echo "::warning::model '$model' died at the provider (terminal Model-not-found error on an exit-0 run); advancing to the next ladder rung if any."
                rm -f "$log" "$fifo" "$hang_flag"
                continue 2
              fi
              if freetier_error_terminal "$log"; then
                if [ "$freetier_retry_used" -lt 1 ]; then
                  freetier_retry_used=1
                  echo "::warning::transient free-tier rejection on model '$model' (exit-0 terminal FreeTierError, issue #620); one bounded retry of the same model in 15s."
                  rm -f "$log" "$fifo" "$hang_flag"
                  sleep 15
                  continue
                fi
                echo "::error::persistent free-tier rejection on model '$model' after the bounded retry (issue #620); failing loudly instead of retrying unboundedly."
                rm -f "$log" "$fifo" "$hang_flag"
                exit 1
              fi
              if transient_http_error_terminal "$log"; then
                if [ "$transient_retry_used" -lt 1 ]; then
                  transient_retry_used=1
                  echo "::warning::transient HTTP error on model '$model' (exit-0 terminal 429/5xx error, issue #653); one bounded retry of the same model in 30s."
                  rm -f "$log" "$fifo" "$hang_flag"
                  sleep 30
                  continue
                fi
                echo "::error::persistent HTTP error on model '$model' after the bounded retry (issue #653); failing loudly instead of retrying unboundedly."
                rm -f "$log" "$fifo" "$hang_flag"
                exit 1
              fi
              rm -f "$log" "$fifo" "$hang_flag"
              exit 0
            fi
            if grep -qE "Model not found: ${model//./\\.}([^A-Za-z0-9_-]|$)" "$log"; then
              echo "::warning::model '$model' was not found by the provider; advancing to the next ladder rung if any."
              rm -f "$log" "$fifo" "$hang_flag"
              continue 2
            fi
            if freetier_error_terminal "$log"; then
              if [ "$freetier_retry_used" -lt 1 ]; then
                freetier_retry_used=1
                echo "::warning::transient free-tier rejection on model '$model' (exit $status, issue #620); one bounded retry of the same model in 15s."
                rm -f "$log" "$fifo" "$hang_flag"
                sleep 15
                continue
              fi
              echo "::error::persistent free-tier rejection on model '$model' (exit $status) after the bounded retry (issue #620); failing loudly instead of retrying unboundedly."
              rm -f "$log" "$fifo" "$hang_flag"
              exit "$status"
            fi
            if transient_http_error_terminal "$log"; then
              if [ "$transient_retry_used" -lt 1 ]; then
                transient_retry_used=1
                echo "::warning::transient HTTP error on model '$model' (exit $status, issue #653); one bounded retry of the same model in 30s."
                rm -f "$log" "$fifo" "$hang_flag"
                sleep 30
                continue
              fi
              echo "::error::persistent HTTP error on model '$model' (exit $status) after the bounded retry (issue #653); failing loudly instead of retrying unboundedly."
              rm -f "$log" "$fifo" "$hang_flag"
              exit "$status"
            fi
            echo "::error::opencode failed with exit status $status on model '$model' (not a model-resolution, free-tier, or transient-HTTP death; remaining rungs are not retried)."
            rm -f "$log" "$fifo" "$hang_flag"
            exit "$status"
          done
        done
        echo "::error::opencode exhausted every model rung ($candidates) with 'Model not found' (issue #591 fallback ladder is dead); failing loudly so failure triage fires instead of a hollow green."
        exit 1
      env:
        MODEL_CANDIDATES: ${{ steps.model_ladder.outputs.candidates }}
        MODEL: ${{ steps.model_ladder.outputs.model }}
        # The staged maintained config supplies `small_model`, so the CLI's
        # paid built-in default is never used. The main model is the per-lane
        # `model` input, passed to the CLI as MODEL (it overrides the config).
        OPENCODE_CONFIG: ${{ runner.temp }}/lab-config/opencode.json
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
