<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1440" viewBox="0 0 960 1440">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2340"/>
      <stop offset="0.45" stop-color="#6a4a5a"/>
      <stop offset="0.72" stop-color="#c97a3a"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <radialGradient id="cairnfire" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c9"/>
      <stop offset="0.55" stop-color="#ffcf7a"/>
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="1440" fill="url(#dawn)"/>
  <!-- rising sun over the far ridge -->
  <circle cx="480" cy="880" r="120" fill="#ffe9b0" opacity="0.9"/>
  <!-- rekindling wave: rows of valley lanterns sweeping outward -->
  <g fill="#ffdf9a">
    <circle cx="480" cy="1060" r="11"/>
    <circle cx="400" cy="1090" r="9"/><circle cx="560" cy="1090" r="9"/>
    <circle cx="320" cy="1120" r="8"/><circle cx="480" cy="1120" r="8"/><circle cx="640" cy="1120" r="8"/>
    <circle cx="240" cy="1160" r="7"/><circle cx="400" cy="1160" r="7"/><circle cx="560" cy="1160" r="7"/><circle cx="720" cy="1160" r="7"/>
    <circle cx="160" cy="1200" r="6"/><circle cx="330" cy="1200" r="6"/><circle cx="480" cy="1200" r="6"/><circle cx="630" cy="1200" r="6"/><circle cx="800" cy="1200" r="6"/>
    <circle cx="120" cy="1250" r="5" opacity="0.6"/><circle cx="300" cy="1250" r="5" opacity="0.6"/><circle cx="660" cy="1250" r="5" opacity="0.6"/><circle cx="840" cy="1250" r="5" opacity="0.6"/>
  </g>
  <!-- high cairn ridge -->
  <path d="M0,1020 Q200,760 380,900 T700,860 L960,940 L960,1440 L0,1440 Z" fill="#241c26"/>
  <path d="M0,1150 Q300,1020 480,1080 T960,1060 L960,1440 L0,1440 Z" fill="#171221"/>
  <!-- cairn stones with the new flame -->
  <g>
    <rect x="452" y="800" width="56" height="26" rx="6" fill="#0e0a10"/>
    <rect x="462" y="778" width="36" height="24" rx="6" fill="#0e0a10"/>
    <rect x="470" y="758" width="20" height="22" rx="5" fill="#0e0a10"/>
    <circle cx="480" cy="700" r="110" fill="url(#cairnfire)" opacity="0.9"/>
    <path d="M480,760 Q462,720 474,690 Q470,722 486,706 Q482,732 480,760 Z" fill="#fff3c9"/>
  </g>
  <!-- Nia the keeper, small, seated by the cairn with the lantern -->
  <g>
    <path d="M560,900 L530,800 L600,800 Z" fill="#a03a2a"/>
    <circle cx="565" cy="778" r="17" fill="#e8b98a"/>
    <circle cx="610" cy="850" r="34" fill="url(#cairnfire)" opacity="0.8"/>
    <rect x="600" y="834" width="20" height="30" rx="5" fill="none" stroke="#0e0a06" stroke-width="4"/>
    <!-- Ruel the mossback, resting at the ridge -->
    <ellipse cx="330" cy="920" rx="90" ry="42" fill="#101010" opacity="0.92"/>
    <circle cx="262" cy="900" r="26" fill="#101010" opacity="0.92"/>
    <path d="M300,882 L312,862 M330,880 L344,858" stroke="#101010" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- title -->
  <text x="480" y="220" text-anchor="middle" font-family="Georgia,serif" font-size="96" letter-spacing="8" fill="#f2e8d5">HEARTHLIGHT</text>
  <text x="480" y="270" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-style="italic" fill="#ffe9b0">the rekindling - an original animated short</text>
  <text x="480" y="1370" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#b3a893">a film of the Random Lab - drawn and scored in code</text>
</svg>
