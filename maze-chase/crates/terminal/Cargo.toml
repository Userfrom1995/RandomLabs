[package]
name = "maze-chase-terminal"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Polished fullscreen terminal publication layer for Maze Chase (Unicode, Sixel, and Kitty graphics tiers on the shared engine)"

[lib]
name = "maze_chase_terminal"
path = "src/lib.rs"

[[bin]]
name = "maze-chase-terminal"
path = "src/main.rs"

[dependencies]
maze-chase-engine = { path = "../engine" }
maze-chase-assets = { path = "../assets" }
maze-chase-audio = { path = "../audio" }
maze-chase-config = { path = "../config" }
crossterm = "0.29"

# Bounded stdin waits for the live DA1 probe (poll(2) on Unix, a
# waitable console handle plus queued-record reads on Windows) so no
# reader blocks past the probe deadline.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
