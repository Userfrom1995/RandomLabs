# Maze Chase release pipeline source.
#
# This file is packaging-owned so the Builder can stage it with the
# packaging scripts; the Lab Engineer installs it as
# .github/workflows/maze-chase-release.yml (workflow changes route
# through /oc lab). Once installed, dispatch it or push a
# maze-chase-v<version> tag to build and publish the artifacts.
#
# Triggers: version tags (maze-chase-v*) plus manual dispatch. A branch
# dispatch always cuts a new release candidate: it takes the optional
# `rc` input, or picks the next unused maze-chase-v<version>-rc.N tag,
# so an existing candidate is never republished at a different commit.
# A tag push publishes that exact tag after the tag/commit parity gate.
# Jobs: native Linux, macOS, and Windows builders run the layer tests,
# the deterministic verifier, the packaging scripts, and the per-OS
# smoke (including a real install/uninstall on Windows and a real
# windowed probe on macOS and Linux where available); the publish job
# re-hashes the payloads and creates or refreshes the GitHub Release.
# Tag/version parity is fail-closed through packaging/release/check-tag.sh.
#
# Merges of PRs touching .github/workflows/* need an owner click or PAT
# merge (see LAB.md "Merge capability").

name: maze-chase-release

on:
  push:
    tags:
      - "maze-chase-v*"
  workflow_dispatch:
    inputs:
      rc:
        description: "Release-candidate number (default: the next unused rc)"
        required: false
        type: string

# Only the publish job needs to create or edit the release; the native
# build jobs only read the checkout and upload workflow artifacts.
permissions:
  contents: read

concurrency:
  group: maze-chase-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Linux packages plus smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and version parity
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            bash maze-chase/packaging/release/check-tag.sh "$GITHUB_REF_NAME"
          else
            bash maze-chase/packaging/release/check-tag.sh "$GITHUB_REF_NAME" --allow-branch
          fi

      - name: Pin Rust 1.99.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustup default 1.99.0
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version
          mkdir -p maze-chase/dist
          {
            echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            rustc --version
            cargo --version
          } > maze-chase/dist/toolchain-linux.txt

      - name: Install system tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev rpm rpm2cpio cpio libasound2-dev libudev-dev libxkbcommon-x11-0

      - name: Workspace tests and deterministic verifier
        shell: bash
        working-directory: maze-chase
        run: |
          set -euo pipefail
          cargo test --workspace --no-fail-fast --locked
          cargo run --release --locked --bin maze-chase-verify

      - name: Stage Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash maze-chase/packaging/release/stage-linux.sh

      - name: Rebuild the committed wasm
        shell: bash
        run: |
          set -euo pipefail
          bash maze-chase/packaging/release/check-wasm.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maze-chase-linux
          path: |
            maze-chase/dist/maze-chase-*-linux-*.tar.gz
            maze-chase/dist/maze-chase-*_*.deb
            maze-chase/dist/maze-chase-*-1.*.rpm
            maze-chase/dist/SHA256SUMS.txt
            maze-chase/dist/toolchain-linux.txt
          if-no-files-found: error

  build-macos:
    name: macOS packages plus smoke
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and version parity
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            bash maze-chase/packaging/release/check-tag.sh "$GITHUB_REF_NAME"
          else
            bash maze-chase/packaging/release/check-tag.sh "$GITHUB_REF_NAME" --allow-branch
          fi

      - name: Pin Rust 1.99.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustup default 1.99.0
          rustc --version
          cargo --version
          mkdir -p maze-chase/dist
          {
            echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            rustc --version
            cargo --version
          } > maze-chase/dist/toolchain-macos.txt

      - name: Workspace tests and deterministic verifier
        shell: bash
        working-directory: maze-chase
        run: |
          set -euo pipefail
          cargo test --workspace --no-fail-fast --locked
          cargo run --release --locked --bin maze-chase-verify

      - name: Stage macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash maze-chase/packaging/release/stage-macos.sh --probe

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maze-chase-macos
          path: |
            maze-chase/dist/maze-chase-*-macos-*.tar.gz
            maze-chase/dist/maze-chase-*-macos-*.dmg
            maze-chase/dist/SHA256SUMS.txt
            maze-chase/dist/toolchain-macos.txt
          if-no-files-found: error

  build-windows:
    name: Windows packages plus smoke
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and version parity
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            bash maze-chase/packaging/release/check-tag.sh "$GITHUB_REF_NAME"
          else
            bash maze-chase/packaging/release/check-tag.sh "$GITHUB_REF_NAME" --allow-branch
          fi

      - name: Pin Rust 1.99.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustup default 1.99.0
          rustc --version
          cargo --version
          mkdir -p maze-chase/dist
          {
            echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            rustc --version
            cargo --version
          } > maze-chase/dist/toolchain-windows.txt

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          }
          iscc /? | Select-Object -First 2

      - name: Workspace tests and deterministic verifier
        shell: bash
        working-directory: maze-chase
        run: |
          set -euo pipefail
          cargo test --workspace --no-fail-fast --locked
          cargo run --release --locked --bin maze-chase-verify

      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          powershell -ExecutionPolicy Bypass -File maze-chase/packaging/release/stage-windows.ps1 -Install

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maze-chase-windows
          path: |
            maze-chase/dist/maze-chase-*-windows-x86_64.zip
            maze-chase/dist/maze-chase-*-windows-x86_64-setup.exe
            maze-chase/dist/SHA256SUMS.txt
            maze-chase/dist/toolchain-windows.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-linux, build-macos, build-windows]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify version and re-hash payloads
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(bash maze-chase/packaging/release/check-tag.sh "${GITHUB_REF_NAME:-}" --allow-branch | sed -n 's/.*workspace version //p')"
          if [ -z "$VERSION" ]; then
            VERSION="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && $1=="version"{gsub(/"/,"",$3);print $3;exit}' maze-chase/Cargo.toml)"
          fi
          if [ -z "$VERSION" ]; then
            echo "error: cannot read the workspace version" >&2
            exit 1
          fi
          echo "[maze-chase-release] version $VERSION"
          ls -la release-assets/
          TOOLCHAIN_INFO=""
          for os in linux macos windows; do
            info="release-assets/toolchain-${os}.txt"
            if [ ! -f "$info" ]; then
              echo "error: missing toolchain record $info" >&2
              exit 1
            fi
            while IFS= read -r line; do
              TOOLCHAIN_INFO="${TOOLCHAIN_INFO}- ${line}"$'\n'
            done < "$info"
          done
          printf '%s' "$TOOLCHAIN_INFO" > "$RUNNER_TEMP/toolchain-info.txt"
          cat "$RUNNER_TEMP/toolchain-info.txt"
          rm -f release-assets/toolchain-*.txt release-assets/SHA256SUMS.txt
          (
            cd release-assets
            sha256sum maze-chase-terminal-*.tar.gz \
              maze-chase-desktop-*.tar.gz \
              maze-chase-desktop-*.dmg \
              maze-chase-*_*.deb \
              maze-chase-*-1.*.rpm \
              maze-chase-*-windows-x86_64.zip \
              maze-chase-*-windows-x86_64-setup.exe > SHA256SUMS.txt
          )
          cat release-assets/SHA256SUMS.txt
          test -s release-assets/SHA256SUMS.txt
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Resolve the release tag
        shell: bash
        env:
          RC_INPUT: ${{ github.event.inputs.rc }}
        run: |
          set -euo pipefail
          # A tag ref publishes that exact tag. A branch dispatch always
          # cuts a fresh candidate: an explicit rc input, otherwise the
          # next unused maze-chase-v<version>-rc.N. Existing tags are
          # listed server-side so the number never collides with a
          # candidate published from another branch or an earlier run.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            if [ -n "${RC_INPUT:-}" ]; then
              case "$RC_INPUT" in
                "" | *[!0-9]*)
                  echo "error: the rc input must be a positive integer (got: $RC_INPUT)" >&2
                  exit 1
                  ;;
              esac
              RC=$((10#$RC_INPUT))
              if [ "$RC" -lt 1 ]; then
                echo "error: the rc input must be a positive integer (got: $RC_INPUT)" >&2
                exit 1
              fi
            else
              TAGS="$(git ls-remote --tags origin "refs/tags/maze-chase-v${VERSION}-rc.*")"
              RC=0
              while IFS= read -r ref; do
                [ -n "$ref" ] || continue
                n="${ref##*-rc.}"
                case "$n" in
                  "" | *[!0-9]*) continue ;;
                esac
                n=$((10#$n))
                if [ "$n" -gt "$RC" ]; then
                  RC="$n"
                fi
              done <<< "$TAGS"
              RC=$((RC + 1))
            fi
            TAG="maze-chase-v${VERSION}-rc.${RC}"
          fi
          echo "[maze-chase-release] target tag $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create or refresh the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${TAG:?the release tag must be resolved before publishing}"
          # A tag ref derives the classification from its own name; a
          # branch dispatch is always a release candidate. A stable tag
          # can therefore never be published as a prerelease.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            case "$TAG" in
              *-rc.*) PRERELEASE="true" ;;
              *) PRERELEASE="false" ;;
            esac
          else
            PRERELEASE="true"
          fi
          NOTES="$(mktemp)"
          TOOLCHAIN_INFO="$(cat "$RUNNER_TEMP/toolchain-info.txt")"
          cat > "$NOTES" <<EOF
          Maze Chase $VERSION

          One shared deterministic Rust engine with three complete layers.

          Toolchain and native runners:
          $TOOLCHAIN_INFO

          Artifacts:
          - Linux terminal: maze-chase-terminal-${VERSION}-linux-*.tar.gz, maze-chase-terminal_${VERSION}_*.deb, maze-chase-terminal-${VERSION}-1.*.rpm
          - Linux desktop: maze-chase-desktop-${VERSION}-linux-*.tar.gz, maze-chase-desktop_${VERSION}_*.deb, maze-chase-desktop-${VERSION}-1.*.rpm
          - macOS desktop: maze-chase-desktop-${VERSION}-macos-*.dmg, maze-chase-desktop-${VERSION}-macos-*.tar.gz plus the terminal tarball
          - Windows desktop: maze-chase-desktop-${VERSION}-windows-x86_64-setup.exe, maze-chase-desktop-${VERSION}-windows-x86_64.zip plus the terminal zip

          Verify downloads with SHA256SUMS.txt:
          \`\`\`
          sha256sum -c SHA256SUMS.txt
          \`\`\`
          (use \`shasum -a 256 -c\` on macOS).

          Install, upgrade, and uninstall instructions:
          https://github.com/Userfrom1995/RandomLabs/blob/main/maze-chase/docs/release.md

          The terminal and Windows binaries are unsigned. The macOS app bundle
          is ad-hoc signed: the first launch shows the standard
          unidentified-developer dialog (Open Anyway, or a right-click Open),
          not a damaged-app refusal. Windows SmartScreen may warn on first
          launch (More info, then Run anyway).
          EOF
          # A tag can exist without a release, so validate its commit
          # before either the refresh or the create path. gh resolves
          # annotated tags to their commit; if that lookup fails, use
          # ls-remote to distinguish "no tag" from "tag but no answer"
          # and fail closed on the latter.
          TAG_SHA=""
          if ! TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha 2>/dev/null)"; then
            rc=0
            git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "error: release tag $TAG exists but its commit cannot be resolved" >&2
              exit 1
            fi
            if [ "$rc" -ne 2 ]; then
              echo "error: cannot check whether release tag $TAG exists" >&2
              exit 1
            fi
            TAG_SHA=""
          fi
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "error: release tag $TAG points at $TAG_SHA, not the tested commit $GITHUB_SHA" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Remove assets that are not in this verified set; an
            # upload alone leaves a stale architecture's package
            # published forever.
            gh release view "$TAG" --json assets --jq '.assets[].name' \
              > "$RUNNER_TEMP/release-existing-assets.txt"
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              if [ ! -f "release-assets/$asset" ]; then
                gh release delete-asset "$TAG" "$asset" --yes
              fi
            done < "$RUNNER_TEMP/release-existing-assets.txt"
            gh release upload "$TAG" --clobber release-assets/*
            if [ "$PRERELEASE" = "true" ]; then
              gh release edit "$TAG" --notes-file "$NOTES" --prerelease
            else
              gh release edit "$TAG" --notes-file "$NOTES" --prerelease=false
            fi
            echo "[maze-chase-release] refreshed $TAG"
          else
            # Bind the new tag to the commit the artifacts were built
            # from: on a branch dispatch the default branch is not it.
            if [ "$PRERELEASE" = "true" ]; then
              gh release create "$TAG" --target "$GITHUB_SHA" --title "Maze Chase $VERSION" --notes-file "$NOTES" --prerelease release-assets/*
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --title "Maze Chase $VERSION" --notes-file "$NOTES" release-assets/*
            fi
            echo "[maze-chase-release] published $TAG"
          fi
