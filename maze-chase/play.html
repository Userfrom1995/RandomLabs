<!DOCTYPE html>
<!-- Legacy Maze Chase play URL (issue #582, Refs #660).
  The game now lives at maze-chase/index.html. This page keeps old bookmarks
  and shared links working: it forwards the query string and fragment to the
  game page. The game starts a fresh run and does not read a seed from the
  URL. This page needs no wasm, no network, and no JavaScript to land on the
  game, but JavaScript preserves the query string and fragment. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<link rel="canonical" href="index.html" />
<title>Maze Chase - Play</title>
<meta http-equiv="refresh" content="0; url=index.html" />
<script>
  (function () {
    var target = "index.html" + window.location.search + window.location.hash;
    window.location.replace(target);
  })();
</script>
</head>
<body>
<p>Maze Chase now lives at <a href="index.html">the game page</a>. If you are
not redirected automatically, follow the link.</p>
</body>
</html>
